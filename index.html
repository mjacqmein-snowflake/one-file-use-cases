.","body":"Discovers table sizes, access recency, retention settings and Time Travel usage, then identifies candidates for cooler archival tiers or reduced retention.\n\nEach recommendation carries both halves: the projected saving, and what it makes slower or unavailable. A tiering recommendation without the second half is a trap.\n\nOngoing, the lifecycle policy is evaluated continuously by Snowflake once attached. Attaching it is what actually moves cold data down a tier \u2014 a savings estimate on its own has never reduced a bill.","dist":"Storage_Optimization_Setup.sql","path":"solutions/21_storage_optimization/dist/Storage_Optimization_Setup.sql","bytes":718321,"schema":"STORAGE_OPTIMIZATION","gate":"STORAGE_APPROVE","prefix":"STORAGE","steps":{"mode":true,"tier":true,"rate":3.0,"preflight":true,"oneClick":true,"teardown":true},"launchSteps":null,"configuration":"sql_settings","app":"STORAGE_APP","agent":"","editing":{"profile":"shared_streamlit","one_file_edit_handoff":true,"workspace_preparation_required":false,"source_handoff_live_verified":false,"ui_edit_rollback_verified":true,"snowsight_source_edit_verified":false,"container_verified":false,"sql_edit_verified":false,"full_backend_pipeline_verified":false},"credits":0.153033039,"standing":{"declared":true,"oneTime":false,"kind":"POLICY","object":"","cadence":"continuous, evaluated by Snowflake","dial":"POLICY_SCHEDULE","why":"Attaching a lifecycle policy is what actually moves cold data down a tier forever; a savings estimate on its own has never reduced a bill.","runsPerMonth":null,"runsHow":"continuous, driven by arrivals rather than a schedule","scaling":"FIXED","exponent":0.0,"sessionShape":"MATERIALIZED","intervalSec":null,"measured":false},"team":"Platform & IT","log":[{"kind":"run","text":"EXECUTE IMMEDIATE  \u00b7  Storage_Optimization_Setup.sql"},{"kind":"ok","text":"26 statements, none failed"},{"kind":"ok","text":"storage summary view"},{"kind":"ok","text":"build context view"},{"kind":"ok","text":"mode recorded  \u00b7  DISCOVER"},{"kind":"ok","text":"registry exists"},{"kind":"ok","text":"teardown proc exists"},{"kind":"ok","text":"table inventory view  \u00b7  4034"},{"kind":"ok","text":"tier candidates view  \u00b7  4034"},{"kind":"ok","text":"dashboard deployed  \u00b7  STORAGE_APP"},{"kind":"cost","text":"0.1530 credits, measured"},{"kind":"done","text":"STORAGE_OPTIMIZATION is standing"},{"kind":"ok","text":"Compact installer packaging and ordered-phase regression checks passed"},{"kind":"run","text":"Current revision has targeted execution checks, not a repeated full app-deployment gauntlet"}],"seed":834,"thumb":"img/21_storage_optimization_thumb.webp","full":"img/21_storage_optimization_full.webp","frames":["img/21_storage_optimization_s1.webp","img/21_storage_optimization_s2.webp","img/21_storage_optimization_s3.webp","img/21_storage_optimization_s4.webp","img/21_storage_optimization_s5.webp"],"play":"Platform, cost & governance"},{"key":"22_fraud_investigation","name":"Proactive Fraud Investigation","group":"Analytics & BI","fam":"analytics","headline":"A governed fraud logic layer that tests its own hypotheses and flags anomalies before anyone asks.","body":"The problem this is for: a fraud analytics team already builds its reporting in Snowflake, and the reporting is not the bottleneck. Investigation is \u2014 finding where fraud originates, testing a detection idea, and building the case for action. An assistant that only answers questions is reactive by construction. It can compute a refund rate, but somebody has to suspect a refund rate first, and somebody has to re-explain what a refund rate means every session.\n\nSo four things get installed, each answering a different half of that.\n\nA governed logic layer. A semantic view is the contract: a metric has one definition and it lives in the database rather than in a prompt. Beside it, tables hold the metric definitions, the join rules and the known data traps as data, so an agent, a dashboard and a person all read the same source. This is the part that stops the re-explaining.\n\nA hypothesis registry that runs itself. Each named, versioned detection idea is stored with the SQL that tests it, and a procedure executes each one and writes a verdict. Testing a detection approach stops being a session of ad-hoc queries and becomes a row.\n\nUnprompted anomaly detection. An anomaly model over a per-region daily series, scored nightly, writing findings out. This is the half that flags things before anyone searches, which an average over a window cannot do, because an average dissolves the step change it is meant to reveal.\n\nQuality metrics guarding the documented traps. The traps are not prose here. They are attached to your own tables as metrics, so a trap that comes back is caught by the platform rather than rediscovered by whoever next writes the join wrong.\n\nWhy one part is AI and the rest is not: everything above is deterministic SQL and ML on purpose, because a verdict you cannot reproduce is a verdict you cannot act on. One generative call per night writes the morning brief, because ranking five findings against prior case dispositions and saying which one deserves an hour is language work. A GROUP BY cannot say that this region spiked, but a closed case covered the same pattern.\n\nThat call is constrained: the prompt receives the trap list and the prior case notes, and is instructed to name only tables that exist. A brief that invents a source is worse than no brief, because it sends an investigator looking for something that is not there.\n\nOngoing, a daily task re-tests every registered hypothesis, re-scores the anomaly model, and writes the ranked brief.","dist":"Proactive_Fraud_Investigation_Setup.sql","path":"solutions/22_fraud_investigation/dist/Proactive_Fraud_Investigation_Setup.sql","bytes":792628,"schema":"FRAUD_OPS","gate":"FRAUD_APPROVE","prefix":"FRAUD","steps":{"mode":true,"tier":true,"rate":3.0,"preflight":true,"oneClick":true,"teardown":true},"launchSteps":null,"configuration":"sql_settings","app":"FRAUD_APP","agent":"FRAUD_AGENT","editing":{"profile":"shared_streamlit","one_file_edit_handoff":true,"workspace_preparation_required":false,"source_handoff_live_verified":false,"ui_edit_rollback_verified":true,"snowsight_source_edit_verified":false,"container_verified":false,"sql_edit_verified":false,"full_backend_pipeline_verified":false},"credits":0.479795825,"standing":{"declared":true,"oneTime":false,"kind":"TASK","object":"TASK_FRAUD_NIGHTLY","cadence":"daily at 06:00 UTC","dial":"NIGHTLY_SCHEDULE","why":"Re-testing every registered hypothesis and re-scoring the anomaly model every night, then writing a ranked brief, is the work that makes this proactive rather than reactive. No fraud team does that by hand nightly, which is why fraud is found weeks late.","runsPerMonth":30.0,"runsHow":"daily, 30 days/month","scaling":"LINEAR","exponent":1.0,"sessionShape":"MATERIALIZED","intervalSec":86400.0,"measured":false},"team":"Loss Prevention & Fraud","log":[{"kind":"run","text":"EXECUTE IMMEDIATE  \u00b7  Proactive_Fraud_Investigation_Setup.sql"},{"kind":"ok","text":"38 statements, none failed"},{"kind":"ok","text":"gotchas present"},{"kind":"ok","text":"build context view"},{"kind":"ok","text":"mode recorded  \u00b7  DISCOVER"},{"kind":"ok","text":"registry exists"},{"kind":"ok","text":"teardown proc exists"},{"kind":"ok","text":"metric definitions present  \u00b7  5"},{"kind":"ok","text":"join rules present  \u00b7  5"},{"kind":"ok","text":"dashboard deployed  \u00b7  FRAUD_APP"},{"kind":"ok","text":"agent created  \u00b7  FRAUD_AGENT"},{"kind":"cost","text":"0.4798 credits, measured"},{"kind":"done","text":"FRAUD_OPS is standing"},{"kind":"ok","text":"Compact installer packaging and ordered-phase regression checks passed"},{"kind":"run","text":"Current revision has targeted execution checks, not a repeated full app-deployment gauntlet"}],"seed":121,"thumb":"img/22_fraud_investigation_thumb.webp","full":"img/22_fraud_investigation_full.webp","frames":["img/22_fraud_investigation_s1.webp","img/22_fraud_investigation_s2.webp","img/22_fraud_investigation_s3.webp","img/22_fraud_investigation_s4.webp","img/22_fraud_investigation_s5.webp","img/22_fraud_investigation_s6.webp","img/22_fraud_investigation_s7.webp"],"play":"Analytics & BI"},{"key":"23_retail_merchant","name":"Retail Merchant Agent","group":"AI & agents","fam":"ai","headline":"Sell-through, weeks of supply, staffing efficiency and peer comparison, with an agent that explains the numbers.","body":"Discovers the tables carrying your store, product, sales, inventory, traffic and labour data, including SAP HANA column naming, and builds a suite of merchant views plus a Cortex Agent over them.\n\nThe views answer what the numbers are: sell-through, weeks of supply, staffing efficiency, inventory risk, and store-versus-peer comparison. The agent answers why they look that way and what to do about it \u2014 diagnosing cross-measure correlations such as conversion falling while traffic rises, and recommending inventory and staffing actions.\n\nThe agent earns its place rather than decorating the result. Staffing-sweet-spot analysis, cross-measure correlation and peer comparison need reasoning a GROUP BY cannot do. A semantic view can tell you conversion dropped; it cannot tell you that the drop tracks understaffing in a specific hour band at stores of a particular size.\n\nOngoing, a daily task rebuilds the rollups.","dist":"Retail_Merchant_Agent_Setup.sql","path":"solutions/23_retail_merchant/dist/Retail_Merchant_Agent_Setup.sql","bytes":692380,"schema":"RETAIL_MERCHANT","gate":"MERCHANT_APPROVE","prefix":"MERCHANT","steps":{"mode":true,"tier":true,"rate":3.0,"preflight":true,"oneClick":true,"teardown":true},"launchSteps":null,"configuration":"sql_settings","app":"RETAIL_MERCHANT_APP","agent":"MERCHANT_AGENT","editing":{"profile":"shared_streamlit","one_file_edit_handoff":true,"workspace_preparation_required":false,"source_handoff_live_verified":false,"ui_edit_rollback_verified":true,"snowsight_source_edit_verified":false,"container_verified":false,"sql_edit_verified":false,"full_backend_pipeline_verified":false},"credits":0.347878878,"standing":{"declared":true,"oneTime":false,"kind":"TASK","object":"TASK_MERCHANT_DAILY_ROLLUP","cadence":"daily at 06:00 UTC","dial":"ROLLUP_SCHEDULE","why":"Sell-through, weeks of supply and staffing efficiency degrade silently without a daily rollup. Stale, these measures are worse than absent, because somebody still acts on them.","runsPerMonth":30.0,"runsHow":"daily, 30 days/month","scaling":"LINEAR","exponent":1.0,"sessionShape":"MATERIALIZED","intervalSec":86400.0,"measured":false},"team":"Merchandising & Pricing","log":[{"kind":"run","text":"EXECUTE IMMEDIATE  \u00b7  Retail_Merchant_Agent_Setup.sql"},{"kind":"ok","text":"35 statements, none failed"},{"kind":"ok","text":"conversion rate view"},{"kind":"ok","text":"build context view"},{"kind":"ok","text":"mode recorded  \u00b7  DISCOVER"},{"kind":"ok","text":"registry exists"},{"kind":"ok","text":"teardown proc exists"},{"kind":"ok","text":"sell through view  \u00b7  927"},{"kind":"ok","text":"weeks of supply view  \u00b7  879"},{"kind":"ok","text":"dashboard deployed  \u00b7  RETAIL_MERCHANT_APP"},{"kind":"ok","text":"agent created  \u00b7  MERCHANT_AGENT"},{"kind":"cost","text":"0.3479 credits, measured"},{"kind":"done","text":"RETAIL_MERCHANT is standing"},{"kind":"ok","text":"Compact installer packaging and ordered-phase regression checks passed"},{"kind":"run","text":"Current revision has targeted execution checks, not a repeated full app-deployment gauntlet"}],"seed":935,"thumb":"img/23_retail_merchant_thumb.webp","full":"img/23_retail_merchant_full.webp","frames":["img/23_retail_merchant_s1.webp","img/23_retail_merchant_s2.webp","img/23_retail_merchant_s3.webp","img/23_retail_merchant_s4.webp"],"play":"AI & agents"},{"key":"24_voice_of_customer","name":"Voice of Customer","group":"AI & agents","fam":"ai","headline":"Surface the themes, sentiment and quality scores already sitting in your reviews, tickets and calls.","body":"Reads the review, ticket, call and survey tables you name and scores the text in them: sentiment on each item, a category on each ticket, a quality score against a rubric you define, and the themes running across the whole corpus rather than one record at a time.\n\nThe four sources are independent. Each checks whether you have pointed it at a table and skips with a note if you have not, so a partial configuration builds only the parts you have data behind rather than failing as a whole.\n\nCoverage, distribution and trend questions are answered by a semantic view, so they can be asked in plain language instead of being built as reports first. Ongoing, sentiment and categories stay current as new text lands and a task re-extracts themes every few hours \u2014 a single pass drifts within days, and the customers who just wrote to you are exactly the ones missing from it.","dist":"Voice_of_Customer_Setup.sql","path":"solutions/24_voice_of_customer/dist/Voice_of_Customer_Setup.sql","bytes":750108,"schema":"VOICE_OF_CUSTOMER","gate":"VOC_APPROVE","prefix":"VOC","steps":{"mode":true,"tier":true,"rate":3.0,"preflight":true,"oneClick":true,"teardown":true},"launchSteps":null,"configuration":"sql_settings","app":"VOICE_OF_CUSTOMER_APP","agent":"","editing":{"profile":"shared_streamlit","one_file_edit_handoff":true,"workspace_preparation_required":false,"source_handoff_live_verified":false,"ui_edit_rollback_verified":true,"snowsight_source_edit_verified":false,"container_verified":false,"sql_edit_verified":false,"full_backend_pipeline_verified":false},"credits":1.239377726,"standing":{"declared":true,"oneTime":false,"kind":"TASK","object":"TASK_REFRESH_THEMES","cadence":"360 MINUTE (every 6 hours)","dial":"THEME_SCHEDULE","why":"A one-shot theme extraction drifts within days as new reviews and tickets arrive, and the customers who just wrote are exactly the ones whose themes are missing from the aggregate that drives product and service decisions.","runsPerMonth":120.0,"runsHow":"43,200 min/month / 360 min","scaling":"LINEAR","exponent":1.0,"sessionShape":"MATERIALIZED","intervalSec":21600.0,"measured":false},"team":"Customer Service & CX","log":[{"kind":"run","text":"EXECUTE IMMEDIATE  \u00b7  Voice_of_Customer_Setup.sql"},{"kind":"ok","text":"43 statements, none failed"},{"kind":"ok","text":"ticket category not null"},{"kind":"ok","text":"build context"},{"kind":"ok","text":"review sentiment exists"},{"kind":"ok","text":"review sentiment has rows  \u00b7  601"},{"kind":"ok","text":"review sentiment not null  \u00b7  0"},{"kind":"ok","text":"ticket classification exists"},{"kind":"ok","text":"ticket classification has rows  \u00b7  82"},{"kind":"ok","text":"dashboard deployed  \u00b7  VOICE_OF_CUSTOMER_APP"},{"kind":"cost","text":"1.2394 credits, measured"},{"kind":"done","text":"VOICE_OF_CUSTOMER is standing"},{"kind":"ok","text":"Compact installer packaging and ordered-phase regression checks passed"},{"kind":"run","text":"Current revision has targeted execution checks, not a repeated full app-deployment gauntlet"}],"seed":444,"thumb":"img/24_voice_of_customer_thumb.webp","full":"img/24_voice_of_customer_full.webp","frames":["img/24_voice_of_customer_s1.webp","img/24_voice_of_customer_s2.webp","img/24_voice_of_customer_s3.webp","img/24_voice_of_customer_s4.webp","img/24_voice_of_customer_s5.webp"],"play":"AI & agents"},{"key":"25_warehouse_generation","name":"Warehouse Generation \u2014 Gen2 and Adaptive","group":"Platform, cost & governance","fam":"platform","headline":"Measure whether a generation change lowers the bill, not just query runtime.","body":"At a 1.35 same-size Gen2 rate ratio, billed cluster-time must fall more than 25.93% for equivalent work to cost less. Query execution becoming 26% faster does not establish that reduction. Continuous ingestion can keep a warehouse running even when its queries finish much sooner.\n\nThis assessment separates performance eligibility from economics. It compares auto-suspend scenarios, shows cache and provisioning evidence, and supports a confirmed, named pilot with recorded settings and undo. It does not offer a fleet-wide Gen2 conversion.\n\nAfter a successful pilot, compare equal complete weekly windows, query volume, matched-pattern coverage, latency and metered credits. Faster but more expensive is a distinct outcome. A total-bill change is observational evidence, not causal savings when workload mix changes. QAS remains a separate cost decision.\n\nA weekly watch is enabled only at Production tier. Legacy baselines remain preserved but are not retrospectively certified. This revision passed regression, UI and sandbox apply/undo checks; the full installer deployment gauntlet has not been rerun.","dist":"Warehouse_Generation_Setup.sql","path":"solutions/25_warehouse_generation/dist/Warehouse_Generation_Setup.sql","bytes":759271,"schema":"WAREHOUSE_GENERATION","gate":"WHGEN_APPROVE","prefix":"WHGEN","steps":{"mode":true,"tier":true,"rate":3.0,"preflight":true,"oneClick":true,"teardown":true},"launchSteps":null,"configuration":"sql_settings","app":"WHGEN_APP","agent":"","editing":{"profile":"shared_streamlit","one_file_edit_handoff":true,"workspace_preparation_required":false,"source_handoff_live_verified":false,"ui_edit_rollback_verified":true,"snowsight_source_edit_verified":false,"container_verified":false,"sql_edit_verified":false,"full_backend_pipeline_verified":false},"credits":null,"standing":{"declared":true,"oneTime":false,"kind":"TASK","object":"TASK_GEN2_WATCH","cadence":"weekly on Monday at 07:00 UTC","dial":"WATCH_SCHEDULE","why":"Check the bill and performance independently after a named change. The weekly watch retains observations; a higher bill prompts review of workload mix, suspend behavior and latency rather than automatic rollback.","runsPerMonth":4.35,"runsHow":"weekly, 4.35 weeks/month","scaling":"FIXED","exponent":0.0,"sessionShape":"MATERIALIZED","intervalSec":595862.1,"measured":false},"team":"Platform & IT","log":[{"kind":"ok","text":"Billing scenarios and named apply/undo paths verified in a sandbox"},{"kind":"ok","text":"Regression, source reproducibility and app render checks passed"},{"kind":"run","text":"Full installer deployment gauntlet not rerun for this revision"},{"kind":"ok","text":"Compact installer packaging and ordered-phase regression checks passed"},{"kind":"run","text":"Current revision has targeted execution checks, not a repeated full app-deployment gauntlet"}],"seed":419,"thumb":"img/25_warehouse_generation_thumb.webp","full":"img/25_warehouse_generation_full.webp","frames":["img/25_warehouse_generation_s1.webp","img/25_warehouse_generation_s2.webp","img/25_warehouse_generation_s3.webp","img/25_warehouse_generation_s4.webp","img/25_warehouse_generation_s5.webp","img/25_warehouse_generation_s6.webp","img/25_warehouse_generation_s7.webp"],"play":"Platform, cost & governance","shotsNote":"Illustrative synthetic fixtures, not customer telemetry. The break-even measure is billed cluster-time; query speedup is shown separately.","gif":"img/25_warehouse_generation_walkthrough.gif"},{"key":"26_embedded_storefront","name":"Embedded Storefront Engine","group":"Apps & collaboration","fam":"apps_collab","headline":"Consent-gated personalisation for a storefront, where a probable identity match on its own unlocks nothing.","body":"Builds the decision layer a storefront page calls: a customer and visitor model, a seeded product catalogue, four consent-aware functions covering creative, offer, recommendations and on-site search, and a Cortex Agent over them that answers shopper questions without stepping outside what the visitor has agreed to.\n\nThe rule it exists to prove is that identity confidence and consent are separate things. A visitor matched to a known customer on a behavioural signal, at well below certainty, and with no consent on record, is served generic content \u2014 the match is real and it still buys nothing. A visitor who signed in and granted consent is served personalised content, and the reason is recorded next to the decision. Both outcomes come back from the same function call, so the difference is demonstrable rather than asserted.\n\nThe check sits in the data layer instead of in page code, which is the part that survives contact with a second channel. Consent enforced in an application holds for that application; the next integration to read the same tables has to remember to re-implement it, and eventually one does not. Enforced where the data is, every caller inherits it, and an auditor can be shown the enforcement rather than a description of it.\n\nIt ships with its own sample shoppers and consent records, so the behaviour is visible before any of your data is involved. What it delivers is the engine and the agent, not the web page \u2014 the page itself runs on your own origin and calls these functions.\n\nNothing recurs. There is no scheduled refresh or rollup to install, so once it is built there is no standing cost.\n\nThe screens above are a storefront page served from an ordinary web origin \u2014 a laptop, in that capture \u2014 which calls the engine once per zone and prints what came back: the function that decided the zone, the resolution method and confidence behind it, and whether personalisation was permitted. Switch visitor and the page re-decides. The sponsored slot is a separate process framed inside the page, fed by the same call as the hero, which is what a retail-media slot handed to a third party actually looks like when the decision stays governed and no customer list leaves the database.\n\nWhere the page runs is not a detail. Snowflake decides; something you own renders and reaches the shopper. A page served from inside Snowflake sits behind an account login, so it can show a colleague the engine working and cannot serve a customer. That boundary is the reason the engine is the deliverable here and the page is an example of calling it.","dist":"Embedded_Storefront_Setup.sql","path":"solutions/26_embedded_storefront/dist/Embedded_Storefront_Setup.sql","bytes":177301,"schema":"EMBEDDED_STOREFRONT","gate":"STOREFRONT_APPROVE","prefix":"STOREFRONT","steps":{"mode":true,"tier":true,"rate":3.0,"preflight":true,"oneClick":true,"teardown":true},"launchSteps":null,"configuration":"sql_settings","app":"STOREFRONT_DEMO","agent":"SHOPPER_AGENT","editing":{"profile":"bespoke_streamlit","one_file_edit_handoff":true,"workspace_preparation_required":false,"source_handoff_live_verified":false,"ui_edit_rollback_verified":false,"snowsight_source_edit_verified":true,"container_verified":true,"sql_edit_verified":false,"full_backend_pipeline_verified":false},"credits":0.180848324,"standing":{"declared":true,"oneTime":true,"reason":"The storefront engine is a set of tables, functions, and an agent that are created once and queried on demand. There is no recurring rollup, refresh, or scheduled task to install."},"team":"Marketing & Loyalty","log":[{"kind":"run","text":"EXECUTE IMMEDIATE  \u00b7  Embedded_Storefront_Setup.sql"},{"kind":"ok","text":"32 statements, none failed"},{"kind":"ok","text":"products seeded"},{"kind":"ok","text":"build context view"},{"kind":"ok","text":"mode recorded  \u00b7  DISCOVER"},{"kind":"ok","text":"registry exists"},{"kind":"ok","text":"teardown proc exists"},{"kind":"ok","text":"customers seeded  \u00b7  3"},{"kind":"ok","text":"visitors seeded  \u00b7  4"},{"kind":"ok","text":"dashboard deployed  \u00b7  STOREFRONT_DEMO"},{"kind":"ok","text":"agent created  \u00b7  SHOPPER_AGENT"},{"kind":"cost","text":"0.1808 credits, measured"},{"kind":"done","text":"EMBEDDED_STOREFRONT is standing"},{"kind":"ok","text":"Compact installer packaging and ordered-phase regression checks passed"},{"kind":"run","text":"Current revision has targeted execution checks, not a repeated full app-deployment gauntlet"}],"seed":127,"thumb":"img/26_embedded_storefront_thumb.webp","full":"img/26_embedded_storefront_full.webp","frames":["img/26_embedded_storefront_s1.webp","img/26_embedded_storefront_s2.webp"],"shotsNote":"A storefront page on a self-hosted origin, calling this engine per zone \u2014 Snowflake decides, the page renders. One capture per visitor.","play":"Apps & collaboration"},{"key":"28_delegated_orchestration","name":"Zero-Privilege Orchestration","group":"Data engineering","fam":"de","headline":"Let your scheduler run dbt and notebooks without letting it read the data.","body":"Snowflake runs dbt projects and notebooks with the caller's rights, and a stored procedure cannot turn that into the owner's rights. So an external scheduler \u2014 Airflow, Astronomer, Dagster, Control-M \u2014 appears to need read and write on your source and target tables, which is exactly what a security review refuses.\n\nA task is the way out. A task always runs with the privileges of the role that owns it, even when a different role triggers it, so the task becomes the boundary the stored procedure could not be. Your scheduler ends up holding permission to start one task and nothing else.\n\nThe substance here is the arithmetic, not the task. This reads each dbt project's own declared sources and targets to work out what the work actually requires, walks your whole role graph to work out what the scheduler can actually reach, and reports the difference as privileges you can revoke today. A remediation that cannot show you the excess it removes is a claim, and a security architect does not sign claims.\n\nIt also answers the objection that usually kills this pattern. Polling one Snowflake task per pipeline step adds latency that stacks up; chaining the steps inside Snowflake means the scheduler triggers once and checks once, however many dbt commands the pipeline runs. The script hands you the trigger call and the matching status query alongside the grants.\n\nLeft running, it re-derives the scheduler's reach on a schedule you set, because least privilege decays quietly \u2014 someone grants a role at 2am to fix a broken run and nobody recomputes the blast radius afterwards.","dist":"Delegated_Orchestration_Setup.sql","path":"solutions/28_delegated_orchestration/dist/Delegated_Orchestration_Setup.sql","bytes":738641,"schema":"DELEGATED_ORCHESTRATION","gate":"DELEG_APPROVE","prefix":"DELEG","steps":{"mode":true,"tier":true,"rate":3.0,"preflight":true,"oneClick":true,"teardown":true},"launchSteps":null,"configuration":"sql_settings","app":"DELEGATED_ORCHESTRATION_APP","agent":"","editing":{"profile":"shared_streamlit","one_file_edit_handoff":true,"workspace_preparation_required":false,"source_handoff_live_verified":false,"ui_edit_rollback_verified":true,"snowsight_source_edit_verified":false,"container_verified":false,"sql_edit_verified":false,"full_backend_pipeline_verified":false},"credits":0.304588882,"standing":{"declared":true,"oneTime":false,"kind":"TASK","object":"TASK_PRIVILEGE_DRIFT_MONITOR","cadence":"1440 minutes (daily)","dial":"DRIFT_CADENCE_MINUTES","why":"Least privilege on an orchestration service role decays silently: someone grants a role to fix a broken run at 2am and nobody recomputes the blast radius afterwards. Re-deriving it means walking the whole role graph against every dbt project's declared sources and targets, which no team does by hand after go-live.","runsPerMonth":30.0,"runsHow":"43,200 min/month / 1440 min","scaling":"FIXED","exponent":0.0,"sessionShape":"SCAN","intervalSec":86400.0,"measured":false},"team":"Platform & IT","log":[{"kind":"run","text":"EXECUTE IMMEDIATE  \u00b7  Delegated_Orchestration_Setup.sql"},{"kind":"ok","text":"35 statements, none failed"},{"kind":"ok","text":"registry exists"},{"kind":"ok","text":"findings view exists"},{"kind":"ok","text":"antipatterns view exists"},{"kind":"ok","text":"orchestrator reach view exists"},{"kind":"ok","text":"remediation view exists"},{"kind":"ok","text":"antipatterns readable  \u00b7  True"},{"kind":"ok","text":"findings readable  \u00b7  True"},{"kind":"ok","text":"dashboard deployed  \u00b7  DELEGATED_ORCHESTRATION_APP"},{"kind":"cost","text":"0.3046 credits, measured"},{"kind":"done","text":"DELEGATED_ORCHESTRATION is standing"},{"kind":"ok","text":"Compact installer packaging and ordered-phase regression checks passed"},{"kind":"run","text":"Current revision has targeted execution checks, not a repeated full app-deployment gauntlet"}],"seed":511,"thumb":"img/28_delegated_orchestration_thumb.webp","full":"img/28_delegated_orchestration_full.webp","frames":[],"play":"Data engineering"},{"key":"29_cdc_mirror_cost","name":"CDC Mirror Cost","group":"Platform, cost & governance","fam":"platform","headline":"Rank the tables your change streams keep fresh by what that refresh actually costs, then measure a cheaper shape against the most expensive one.","body":"A CDC mirror is the pattern where a change stream lands in a staging table and a MERGE folds it into a target on a key, once per micro-batch, forever. This reads those MERGE statements out of your query history, groups them by target table, and ranks each target on credit-weighted execution-hours per gigabyte scanned.\n\nThat ranking is the substance. Merge cost does not track data volume: a mirror can absorb tens of thousands of merges over well under a gigabyte, because what you are paying for is per-statement overhead \u2014 compilation, micro-partition rewrite, commit \u2014 repeated, not the data movement. Ranked by volume such a table is a rounding error and nobody ever looks at it. The ratio is printed next to the volume so you can see where the two disagree.\n\nRanking across warehouses of different sizes is weighted by each warehouse's own rate. An extra-small hour and a 4X-large hour are not the same cost, and comparing them as though they were is how a report recommends the wrong table. Where a rate cannot be read, the row is ranked only within its own warehouse and labelled that way.\n\nFor each ranked target it also infers what a CDC redesign needs: which column identifies a row, which column orders its versions, which columns change between versions. Those are read out of your merge text and labelled as inferred, because a key recovered from a statement is a reading rather than a schema fact \u2014 and a merge with no reliably increasing column is refused rather than given an invented ordering.\n\nThe comparison is measured, not modelled: the same events, the same batch count and the same warehouse, merged once and appended once. The difference between those two is the bookkeeping. Credit figures arrive on a delay, because metering lands hours after the work, so a fresh run reports those lines as pending rather than as zero \u2014 a zero there would be a claim about cost that nothing yet supports.\n\nOne limit worth knowing before you plan around it: the version-ordered interactive table that would remove the merge altogether does not parse on every account yet. Where it does not, the DDL is generated for review and labelled projected \u2014 a statement you can take to Support, never a measured result.\n\nOngoing, the serving layer refreshes on the lag you set, one minute by default. That refresh is real recurring consumption rather than a one-off build cost, which is why it appears as a standing line next to the dial that moves it. Its sibling assessment asks the latency question about interactive warehouses; this one asks the cost question.","dist":"CDC_Mirror_Cost_Setup.sql","path":"solutions/29_cdc_mirror_cost/dist/CDC_Mirror_Cost_Setup.sql","bytes":814495,"schema":"CDC_MIRROR_COST","gate":"CDCMIRROR_APPROVE","prefix":"CDCMIRROR","steps":{"mode":true,"tier":true,"rate":3.0,"preflight":true,"oneClick":true,"teardown":true},"launchSteps":null,"configuration":"sql_settings","app":"CDCMIRROR_APP","agent":"","editing":{"profile":"shared_streamlit","one_file_edit_handoff":true,"workspace_preparation_required":false,"source_handoff_live_verified":false,"ui_edit_rollback_verified":true,"snowsight_source_edit_verified":false,"container_verified":false,"sql_edit_verified":false,"full_backend_pipeline_verified":false},"credits":0.055687502,"standing":{"declared":true,"oneTime":false,"kind":"INTERACTIVE_TABLE","object":"IT_ORDER_MIRROR_SERVING","cadence":"60 seconds","dial":"IT_TARGET_LAG_SECONDS","why":"Replacing a per-batch MERGE mirror with a continuously refreshed serving table is the migration a team running CDC into Snowflake will not attempt on its own, because it means trusting a declarative refresh with the table their dashboards already read.","runsPerMonth":null,"runsHow":"cadence '60 seconds' not parsed","scaling":"LINEAR","exponent":1.0,"sessionShape":"MATERIALIZED","intervalSec":null,"measured":false},"team":"Platform & IT","log":[{"kind":"run","text":"EXECUTE IMMEDIATE  \u00b7  CDC_Mirror_Cost_Setup.sql"},{"kind":"ok","text":"36 statements, none failed"},{"kind":"ok","text":"build context view"},{"kind":"ok","text":"mode recorded  \u00b7  DISCOVER"},{"kind":"ok","text":"registry exists"},{"kind":"ok","text":"teardown proc exists"},{"kind":"ok","text":"streamlit app exists"},{"kind":"ok","text":"app file on stage  \u00b7  1"},{"kind":"ok","text":"dashboard deployed  \u00b7  CDCMIRROR_APP"},{"kind":"cost","text":"0.0557 credits, measured"},{"kind":"done","text":"CDC_MIRROR_COST is standing"},{"kind":"ok","text":"Compact installer packaging and ordered-phase regression checks passed"},{"kind":"run","text":"Current revision has targeted execution checks, not a repeated full app-deployment gauntlet"}],"seed":317,"thumb":"img/29_cdc_mirror_cost_thumb.webp","full":"img/29_cdc_mirror_cost_full.webp","frames":["img/29_cdc_mirror_cost_s1.webp","img/29_cdc_mirror_cost_s2.webp","img/29_cdc_mirror_cost_s3.webp"],"play":"Platform, cost & governance"},{"key":"35_ai_value_readiness","name":"AI Readiness and Value Activation","group":"AI & agents","fam":"ai","headline":"Find the AI work you can start now, then improve what makes it more valuable.","body":"Assesses a database/schema scope you choose and matches approved input slices to existing one-file use cases. Missing semantic coverage elsewhere never vetoes a feedback or search workflow that does not depend on it. The React workbench separates available pilots, useful narrower scopes and specific dependencies.\n\nExplore a value scenario that includes human review and manual fallback. An 80 percent acceptance assumption is editable, not a claimed accuracy score or measured return. When a workflow fits, download its complete configured SQL with creation approval and app warming still disabled. No child solution is deployed by the assessment.\n\nThree child installers have bounded synthetic execution evidence. The BI-model installer remains held until its key and metric assumptions are validated; a generic knowledge-base installer is not included. Customer-task quality and business value still require a representative review.\n\nThe assessment leaves no recurring workload. Metadata scans, optional profiling or AI assistance, storage and opening the app can incur charges. Each selected child has its own cost plan, approval and teardown.","dist":"AI_Value_Readiness_Setup.sql","path":"solutions/35_ai_value_readiness/dist/AI_Value_Readiness_Setup.sql","bytes":3473880,"schema":"","gate":"approve","prefix":"approve","steps":{"mode":false,"tier":false,"rate":null,"preflight":false,"teardown":true,"oneClick":true},"launchSteps":[{"title":"Run with defaults","description":"Run the complete file. It derives bounded metadata scope from the selected database and installs the existing React results viewer.","code":["No variable changes required","Open OPEN_APP_URL in the final result"],"note":"AI metadata advice is enabled; source-row profiling and downstream launches remain separately approved."},{"title":"Approve and inspect a bounded slice","description":"Approve selected source identities and aggregate profiling. Install the React results viewer in a new schema when ready.","code":["\"profile_approved\": true,","\"action\": \"INSTALL\",","\"approve\": true"],"note":"Source approvals, output access and installation identifiers are separate required settings. The initial JSON remains closed."},{"title":"Download a selected launch","description":"Inspect the opportunity, adjust value assumptions, and download its complete configured SQL installer from the application.","code":["Child creation approval: FALSE","App warming: FALSE","Child deployment tier: DISCOVER"],"note":"The child has independent approval and teardown. A download does not deploy anything. Its later discovery or build can incur charges."}],"configuration":"json","app":"AI_VALUE_READINESS","agent":"","editing":{"profile":"bespoke_streamlit","one_file_edit_handoff":true,"workspace_preparation_required":false,"source_handoff_live_verified":false,"ui_edit_rollback_verified":false,"snowsight_source_edit_verified":false,"container_verified":false,"sql_edit_verified":false,"full_backend_pipeline_verified":false},"credits":null,"standing":{"declared":true,"oneTime":true,"reason":"An on-demand assessment and gated SQL handoff, not recurring inference."},"team":"Platform & IT","log":[{"kind":"run","text":"Live bounded validation on synthetic inputs"},{"kind":"ok","text":"Three approved source contracts produced bounded starting points"},{"kind":"ok","text":"Zero semantic views did not veto unrelated workflows"},{"kind":"ok","text":"React value calculations and SQL downloads verified"},{"kind":"done","text":"Customer-task accuracy and financial ROI remain unmeasured"},{"kind":"ok","text":"Compact installer packaging and ordered-phase regression checks passed"},{"kind":"run","text":"Current revision has targeted execution checks, not a repeated full app-deployment gauntlet"}],"seed":342,"thumb":"img/35_ai_value_readiness_thumb.webp","full":"img/35_ai_value_readiness_full.webp","frames":["img/35_ai_value_readiness_s1.webp","img/35_ai_value_readiness_s2.webp","img/35_ai_value_readiness_s3.webp","img/35_ai_value_readiness_s4.webp"],"gif":"img/35_ai_value_readiness_walkthrough.gif","screensHosted":5,"shotsNote":"Captured from the real React application in signed-in Snowsight, using synthetic inputs. Scenario values are assumptions, not customer results.","play":"AI & agents"},{"key":"d1_search_quality","name":"Site Search Quality Monitor","group":"AI & agents","fam":"ai","headline":"The searches on your own site that returned nothing, classified by why they failed and ranked by the revenue behind them.","body":"Reads your search queries, your product catalog and your orders, and builds a view of where site search is failing shoppers.\n\nEvery failing search is classified rather than just counted, because the fix depends entirely on the cause. A synonym gap means you carry the product and the shopper used a different word for it. An assortment gap means you do not carry it at all. A catalog-data gap means you carry it and the record is too thin to match. Those go to three different teams, and a single list of zero-result queries sends them all to the wrong one.\n\nThe ranking is by revenue at stake, not by query volume. A high-volume search for something you will never stock matters less than a moderate one for something sitting in your warehouse under a name nobody types, and sorting by count inverts that.\n\nA weekly summary extracts the themes across failures, so you get \"shoppers are searching by room rather than by category\" rather than four hundred individual strings. There is also a natural-language view over the same measures, so you can ask which searches lost the most money last month without writing the query.\n\nIt is careful about what it will not claim. Revenue attribution is an estimate built from your own order history, not a measured loss, and it says so. If a source table you name is missing or empty, it names that table and builds nothing rather than reporting zero failures, which reads as a healthy search engine when it actually means no data.\n\nOngoing, metrics tables refresh on a lag you set and a weekly task re-classifies newly failing searches, because the words shoppers type shift with every season, promotion and catalog change.","dist":"Site_Search_Quality_Monitor_Setup.sql","path":"solutions/d1_search_quality/dist/Site_Search_Quality_Monitor_Setup.sql","bytes":679106,"schema":"SEARCH_QUALITY","gate":"SRCH_APPROVE","prefix":"SRCH","steps":{"mode":true,"tier":true,"rate":3.0,"preflight":true,"oneClick":true,"teardown":true},"launchSteps":null,"configuration":"sql_settings","app":"SEARCH_QUALITY_APP","agent":"SEARCH_QUALITY_AGENT","editing":{"profile":"shared_streamlit","one_file_edit_handoff":true,"workspace_preparation_required":false,"source_handoff_live_verified":false,"ui_edit_rollback_verified":true,"snowsight_source_edit_verified":false,"container_verified":false,"sql_edit_verified":false,"full_backend_pipeline_verified":false},"credits":0.175674402,"standing":{"declared":true,"oneTime":false,"kind":"TASK","object":"TASK_CLASSIFY_GAPS","cadence":"10080 MINUTE (weekly)","dial":"GAP_SCHEDULE","why":"Search failures are the one signal where the customer told you exactly what they wanted, in their own words, and left without it. A zero-result search is not a missing page view, it is a stated intent with a lost order attached, and almost nobody reports on it because the query log and the catalog live in different places.","runsPerMonth":4.29,"runsHow":"43,200 min/month / 10080 min","scaling":"LINEAR","exponent":1.0,"sessionShape":"MATERIALIZED","intervalSec":604800.0,"measured":false},"team":"Digital & Ecommerce","log":[{"kind":"run","text":"EXECUTE IMMEDIATE  \u00b7  Site_Search_Quality_Monitor_Setup.sql"},{"kind":"ok","text":"38 statements, none failed"},{"kind":"ok","text":"v low ctr exists"},{"kind":"ok","text":"build context view"},{"kind":"ok","text":"mode recorded  \u00b7  DISCOVER"},{"kind":"ok","text":"dt search quality exists"},{"kind":"ok","text":"dt search quality has rows  \u00b7  21"},{"kind":"ok","text":"v zero result exists"},{"kind":"ok","text":"v zero result has rows  \u00b7  20"},{"kind":"ok","text":"dashboard deployed  \u00b7  SEARCH_QUALITY_APP"},{"kind":"ok","text":"agent created  \u00b7  SEARCH_QUALITY_AGENT"},{"kind":"cost","text":"0.1757 credits, measured"},{"kind":"done","text":"SEARCH_QUALITY is standing"},{"kind":"ok","text":"Compact installer packaging and ordered-phase regression checks passed"},{"kind":"run","text":"Current revision has targeted execution checks, not a repeated full app-deployment gauntlet"}],"seed":462,"thumb":"img/d1_search_quality_thumb.webp","full":"img/d1_search_quality_full.webp","frames":["img/d1_search_quality_s1.webp","img/d1_search_quality_s2.webp","img/d1_search_quality_s3.webp","img/d1_search_quality_s4.webp"],"play":"AI & agents"},{"key":"f1_recovery_audit","name":"Continuous Recovery Audit","group":"Analytics & BI","fam":"analytics","headline":"Duplicate payments, contract price overcharges and unclaimed vendor rebates, found continuously in your own payables rather than in an audit a year later.","body":"Discovers the tables holding your payables, purchase orders, contract terms and vendor master, then builds three detections over them.\n\nDuplicate payment candidates, matched on the patterns that actually cause duplicates rather than on exact equality: the same invoice re-keyed with a transposed number, the same amount to the same vendor days apart, the same reference across two entities. Exact-match deduplication finds almost nothing, because a genuine duplicate is nearly always a near-miss.\n\nContract price variance, comparing what you were invoiced against the price your own contract records, so an overcharge surfaces as a priced difference rather than as an impression that a vendor has crept.\n\nRebate and allowance shortfalls, comparing volume actually purchased against the tiers your agreements entitle you to, which is the category most often left unclaimed simply because nobody was tracking cumulative volume against a threshold.\n\nEach finding carries the evidence behind it: the documents involved, the amount, and the rule that fired. That matters because a recovery claim is a conversation with a supplier, and one that cannot show its working does not survive the first reply.\n\nIt states its limits plainly. A candidate is a candidate, not a confirmed overpayment; a duplicate flag can be a legitimate repeat order, and the output is built to be reviewed rather than actioned blind. Where a source table you name is unreadable, it says which one and builds nothing.\n\nOngoing, the detection tables refresh on a lag you set, which is the whole point: continuous detection in front of payment rather than a review behind it.","dist":"Recovery_Audit_Setup.sql","path":"solutions/f1_recovery_audit/dist/Recovery_Audit_Setup.sql","bytes":678344,"schema":"RECOVERY_AUDIT","gate":"RECOV_APPROVE","prefix":"RECOV","steps":{"mode":true,"tier":true,"rate":3.0,"preflight":true,"oneClick":true,"teardown":true},"launchSteps":null,"configuration":"sql_settings","app":"RECOVERY_AUDIT_APP","agent":"RECOVERY_AGENT","editing":{"profile":"shared_streamlit","one_file_edit_handoff":true,"workspace_preparation_required":false,"source_handoff_live_verified":false,"ui_edit_rollback_verified":true,"snowsight_source_edit_verified":false,"container_verified":false,"sql_edit_verified":false,"full_backend_pipeline_verified":false},"credits":0.250592626,"standing":{"declared":true,"oneTime":false,"kind":"DYNAMIC_TABLE","object":"DT_DUPLICATE_CANDIDATES","cadence":"60 minutes","dial":"TARGET_LAG_MINUTES","why":"Recovery audit is normally retrospective: someone reviews last year's payables, finds the leakage, and takes a share of whatever comes back. Every pound recovered that way was already out the door, and a share of it is now somebody else's. The same tests, run against invoices before they are paid, keep the money instead of chasing it.","runsPerMonth":720.0,"runsHow":"43,200 min/month / 60 min","scaling":"LINEAR","exponent":1.0,"sessionShape":"MATERIALIZED","intervalSec":3600.0,"measured":false},"team":"Finance & Internal Audit","log":[{"kind":"run","text":"EXECUTE IMMEDIATE  \u00b7  Recovery_Audit_Setup.sql"},{"kind":"ok","text":"39 statements, none failed"},{"kind":"ok","text":"registry exists"},{"kind":"ok","text":"build context"},{"kind":"ok","text":"duplicate candidates view  \u00b7  1"},{"kind":"ok","text":"price variance view  \u00b7  1"},{"kind":"ok","text":"recovery summary view  \u00b7  1"},{"kind":"ok","text":"cost lines  \u00b7  9"},{"kind":"ok","text":"semantic view exists"},{"kind":"ok","text":"dashboard deployed  \u00b7  RECOVERY_AUDIT_APP"},{"kind":"ok","text":"agent created  \u00b7  RECOVERY_AGENT"},{"kind":"cost","text":"0.2506 credits, measured"},{"kind":"done","text":"RECOVERY_AUDIT is standing"},{"kind":"ok","text":"Compact installer packaging and ordered-phase regression checks passed"},{"kind":"run","text":"Current revision has targeted execution checks, not a repeated full app-deployment gauntlet"}],"seed":380,"thumb":"img/f1_recovery_audit_thumb.webp","full":"img/f1_recovery_audit_full.webp","frames":["img/f1_recovery_audit_s1.webp","img/f1_recovery_audit_s2.webp","img/f1_recovery_audit_s3.webp","img/f1_recovery_audit_s4.webp","img/f1_recovery_audit_s5.webp","img/f1_recovery_audit_s6.webp","img/f1_recovery_audit_s7.webp"],"play":"Analytics & BI"},{"key":"hr1_workforce_voice","name":"Voice of the Workforce","group":"AI & agents","fam":"ai","headline":"Engagement-survey free text read at scale, by aspect and by department, with alerts when sentiment drops.","body":"Reads the comment text from your engagement surveys and turns it into something a people team can act on.\n\nEvery comment is scored for sentiment against the aspect it is actually about, not just overall. Management, schedule, pay, career growth, workload and culture are separated, because a department whose overall score is flat can be quietly falling apart on scheduling while it improves on pay, and one number averages that away entirely.\n\nDepartment-level summaries extract the recurring themes in the words employees used, so a leader reads the two things being said repeatedly rather than four hundred comments. An alert watches for a sentiment drop on any aspect and tells you, so a decline is caught in the cycle it appears in.\n\nGovernance is built in rather than added afterwards, because this is the most sensitive text an organisation holds. Names embedded in comment text are stripped automatically before anything is stored or summarised. Employee identifiers are masked from roles outside the people team by policy on the column itself, not by convention. And no group smaller than five is ever rendered, which is what keeps a department view from becoming a way to identify who said what \u2014 the single failure that ends an engagement survey's credibility permanently.\n\nYou also get a natural-language view over the same measures, so you can ask which aspects declined most this cycle without writing the query.\n\nOngoing, sentiment tables refresh on a lag you set and a daily task re-extracts department themes, because the employees who just responded are exactly the ones whose feedback is missing from a one-off extraction.","dist":"Voice_of_the_Workforce_Setup.sql","path":"solutions/hr1_workforce_voice/dist/Voice_of_the_Workforce_Setup.sql","bytes":681209,"schema":"WORKFORCE_VOICE","gate":"WRKV_APPROVE","prefix":"WRKV","steps":{"mode":true,"tier":true,"rate":3.0,"preflight":true,"oneClick":true,"teardown":true},"launchSteps":null,"configuration":"sql_settings","app":"WORKFORCE_VOICE_APP","agent":"WORKFORCE_AGENT","editing":{"profile":"shared_streamlit","one_file_edit_handoff":true,"workspace_preparation_required":false,"source_handoff_live_verified":false,"ui_edit_rollback_verified":true,"snowsight_source_edit_verified":false,"container_verified":false,"sql_edit_verified":false,"full_backend_pipeline_verified":false},"credits":0.561622465,"standing":{"declared":true,"oneTime":false,"kind":"TASK","object":"TASK_REFRESH_THEMES","cadence":"1440 MINUTE (daily)","dial":"THEME_SCHEDULE","why":"The free-text box is where employees say the thing the rating scale cannot capture, and it is the part that goes unread because reading it is genuinely hours of work per cycle. So decisions get made off the scores, and the explanation for the scores sits in a column nobody opened.","runsPerMonth":30.0,"runsHow":"43,200 min/month / 1440 min","scaling":"LINEAR","exponent":1.0,"sessionShape":"MATERIALIZED","intervalSec":86400.0,"measured":false},"team":"HR & People","log":[{"kind":"run","text":"EXECUTE IMMEDIATE  \u00b7  Voice_of_the_Workforce_Setup.sql"},{"kind":"ok","text":"39 statements, none failed"},{"kind":"ok","text":"theme refresh log"},{"kind":"ok","text":"build context"},{"kind":"ok","text":"sentiment dt exists"},{"kind":"ok","text":"sentiment has rows  \u00b7  505"},{"kind":"ok","text":"sentiment not null  \u00b7  0"},{"kind":"ok","text":"comment text redacted  \u00b7  0"},{"kind":"ok","text":"dept themes populated  \u00b7  8"},{"kind":"ok","text":"dashboard deployed  \u00b7  WORKFORCE_VOICE_APP"},{"kind":"ok","text":"agent created  \u00b7  WORKFORCE_AGENT"},{"kind":"cost","text":"0.5616 credits, measured"},{"kind":"done","text":"WORKFORCE_VOICE is standing"},{"kind":"ok","text":"Compact installer packaging and ordered-phase regression checks passed"},{"kind":"run","text":"Current revision has targeted execution checks, not a repeated full app-deployment gauntlet"}],"seed":976,"thumb":"img/hr1_workforce_voice_thumb.webp","full":"img/hr1_workforce_voice_full.webp","frames":["img/hr1_workforce_voice_s1.webp","img/hr1_workforce_voice_s2.webp","img/hr1_workforce_voice_s3.webp","img/hr1_workforce_voice_s4.webp"],"play":"AI & agents"},{"key":"l1_contract_vault","name":"Contract Intelligence Vault","group":"AI & agents","fam":"ai","headline":"Your contract PDFs parsed into a searchable vault, with a renewal calendar that counts back to the notice deadline.","body":"Scans a stage of contract documents, parses them, and extracts the terms that carry dates and money into structured records you can query.\n\nTwo things are then kept current on top of that. A renewal calendar, which is the part that earns its place: it does not just hold the renewal date, it computes the notice deadline by counting the required notice period backwards from it, because the date you actually have to act on is the earlier one and it is the one nobody calculates. And an obligation tracker, joining the commitments found in each document to the terms of the contract they came from.\n\nThe result is a vault you can ask questions of. Which agreements auto-renew in the next quarter, which ones need notice served this month, where are the obligations nobody has a name against. A natural-language view sits over the same records so those are questions rather than queries.\n\nIt is explicit about extraction confidence. Terms read out of a PDF are reported as extracted values, with the document they came from, so a figure can be checked against its source rather than trusted because it appeared in a table. A contract it cannot parse is listed as unparsed rather than quietly omitted, which is the failure mode that matters most here: a document missing from a renewal calendar is indistinguishable from a document with nothing due.\n\nOngoing, a daily task scans for newly arrived contracts, parses and indexes them, and refreshes both the renewal calendar and the obligation tracker \u2014 without it, every contract that arrives after the build is invisible to the vault.","dist":"Contract_Intelligence_Vault_Setup.sql","path":"solutions/l1_contract_vault/dist/Contract_Intelligence_Vault_Setup.sql","bytes":685038,"schema":"CONTRACT_VAULT","gate":"CTRX_APPROVE","prefix":"CTRX","steps":{"mode":true,"tier":true,"rate":3.0,"preflight":true,"oneClick":true,"teardown":true},"launchSteps":null,"configuration":"sql_settings","app":"CONTRACT_VAULT_APP","agent":"","editing":{"profile":"shared_streamlit","one_file_edit_handoff":true,"workspace_preparation_required":false,"source_handoff_live_verified":false,"ui_edit_rollback_verified":true,"snowsight_source_edit_verified":false,"container_verified":false,"sql_edit_verified":false,"full_backend_pipeline_verified":false},"credits":0.442279998,"standing":{"declared":true,"oneTime":false,"kind":"TASK","object":"TASK_CONTRACT_SCAN","cadence":"1440 minutes","dial":"SCAN_INTERVAL_MINUTES","why":"A missed auto-renewal is not a document problem, it is a diary problem: the clause was in the file the whole time, and the date to act on it passed while the file sat in a folder. Anything that only stores contracts fails at exactly the moment a contract matters.","runsPerMonth":30.0,"runsHow":"43,200 min/month / 1440 min","scaling":"LINEAR","exponent":1.0,"sessionShape":"MATERIALIZED","intervalSec":86400.0,"measured":false},"team":"Legal & Privacy","log":[{"kind":"run","text":"EXECUTE IMMEDIATE  \u00b7  Contract_Intelligence_Vault_Setup.sql"},{"kind":"ok","text":"35 statements, none failed"},{"kind":"ok","text":"search service exists"},{"kind":"ok","text":"build context"},{"kind":"ok","text":"contract metadata rows  \u00b7  8"},{"kind":"ok","text":"contract obligations rows  \u00b7  14"},{"kind":"ok","text":"renewal calendar dt  \u00b7  1"},{"kind":"ok","text":"obligation tracker dt  \u00b7  1"},{"kind":"ok","text":"alert renewal exists"},{"kind":"ok","text":"dashboard deployed  \u00b7  CONTRACT_VAULT_APP"},{"kind":"cost","text":"0.4423 credits, measured"},{"kind":"done","text":"CONTRACT_VAULT is standing"},{"kind":"ok","text":"Compact installer packaging and ordered-phase regression checks passed"},{"kind":"run","text":"Current revision has targeted execution checks, not a repeated full app-deployment gauntlet"}],"seed":500,"thumb":"img/l1_contract_vault_thumb.webp","full":"img/l1_contract_vault_full.webp","frames":["img/l1_contract_vault_s1.webp","img/l1_contract_vault_s2.webp","img/l1_contract_vault_s3.webp","img/l1_contract_vault_s4.webp"],"play":"AI & agents"},{"key":"m1_spend_pacing","name":"Cross-Channel Spend Pacing & Anomaly Watch","group":"Analytics & BI","fam":"analytics","headline":"Daily ad spend paced against plan across every channel, with CPM spikes, conversion crashes and platform outages flagged the same day.","body":"Brings spend and performance from every channel onto one plan and keeps them paced against it.\n\nThe pacing view carries spend to date against plan to date, the projected run-rate to period end, and the variance, per channel and in total, so an overspend is visible as a trajectory rather than as a surprise. Projecting the run-rate is what makes it actionable: knowing you are four percent over today matters far less than knowing where that lands on the last day of the month.\n\nThe anomaly watch covers the three failures that cost the most and get noticed the latest. A CPM spike, where the money is going out at a worse rate than yesterday for the same delivery. A conversion crash, where delivery looks healthy and the outcome has collapsed, which is usually a broken tag or landing page rather than a media problem. And a zero-spend platform outage, which is the one that hides in an aggregate view \u2014 total spend looks close to plan because other channels absorbed it, while one channel has been dark all day.\n\nEach anomaly arrives with a written root-cause hypothesis, generated from the surrounding metrics, so the first thing an analyst reads is a proposed explanation to confirm or reject rather than a dashboard of red numbers to interpret. It is a hypothesis and is labelled as one; ranking which of five anomalies deserves the next hour is judgement work, and the arithmetic underneath it stays plain and reproducible.\n\nOngoing, the pacing tables refresh on a lag you set and a daily scan compares today's trajectory to plan and fires an alert on a pacing breach, because a pacing view computed once is a snapshot that rots within hours.","dist":"Spend_Pacing_Setup.sql","path":"solutions/m1_spend_pacing/dist/Spend_Pacing_Setup.sql","bytes":689801,"schema":"SPEND_PACING","gate":"PACE_APPROVE","prefix":"PACE","steps":{"mode":true,"tier":true,"rate":3.0,"preflight":true,"oneClick":true,"teardown":true},"launchSteps":null,"configuration":"sql_settings","app":"SPEND_PACING_APP","agent":"","editing":{"profile":"shared_streamlit","one_file_edit_handoff":true,"workspace_preparation_required":false,"source_handoff_live_verified":false,"ui_edit_rollback_verified":true,"snowsight_source_edit_verified":false,"container_verified":false,"sql_edit_verified":false,"full_backend_pipeline_verified":false},"credits":0.001007186,"standing":{"declared":true,"oneTime":false,"kind":"DYNAMIC_TABLE","object":"DT_SPEND_PACING","cadence":"60 minutes","dial":"TARGET_LAG_MINUTES","why":"Media pacing is usually discovered at month-end, from the invoice. By then the overspend is committed and the underspend is unrecoverable, because a budget that went unspent in a month cannot be spent retroactively. The spend-to-plan ratio is only useful if it recomputes against every new day's actuals.","runsPerMonth":720.0,"runsHow":"43,200 min/month / 60 min","scaling":"LINEAR","exponent":1.0,"sessionShape":"MATERIALIZED","intervalSec":3600.0,"measured":false},"team":"Marketing & Loyalty","log":[{"kind":"run","text":"EXECUTE IMMEDIATE  \u00b7  Spend_Pacing_Setup.sql"},{"kind":"ok","text":"37 statements, none failed"},{"kind":"ok","text":"semantic view exists"},{"kind":"ok","text":"build context"},{"kind":"ok","text":"pacing dt exists"},{"kind":"ok","text":"pacing rows  \u00b7  110"},{"kind":"ok","text":"anomaly view rows  \u00b7  894"},{"kind":"ok","text":"alert overspend exists"},{"kind":"ok","text":"alert underspend exists"},{"kind":"ok","text":"dashboard deployed  \u00b7  SPEND_PACING_APP"},{"kind":"cost","text":"0.0010 credits, measured"},{"kind":"done","text":"SPEND_PACING is standing"},{"kind":"ok","text":"Compact installer packaging and ordered-phase regression checks passed"},{"kind":"run","text":"Current revision has targeted execution checks, not a repeated full app-deployment gauntlet"}],"seed":404,"thumb":"img/m1_spend_pacing_thumb.webp","full":"img/m1_spend_pacing_full.webp","frames":["img/m1_spend_pacing_s1.webp","img/m1_spend_pacing_s2.webp","img/m1_spend_pacing_s3.webp","img/m1_spend_pacing_s4.webp"],"play":"Analytics & BI"},{"key":"sc1_vendor_otif","name":"Vendor OTIF Scorecard & Chargeback Alerts","group":"Analytics & BI","fam":"analytics","headline":"Fill rate, on-time delivery and recoverable chargebacks by vendor, measured from your own purchase orders and receipts.","body":"Discovers the tables holding your purchase orders, receipts and vendor master, including SAP and other ERP column naming, and builds a vendor scorecard plus a chargeback candidate list on top of them.\n\nThe scorecard carries fill rate, on-time percentage, average days late and repeat-lateness count per vendor. The chargeback list compares each vendor against the fill-rate commitment you record for them and estimates what is recoverable, so a conversation starts from a number rather than an impression.\n\nIt is careful about what it will not claim. Fill rate is undefined when there are no receipts, so it reports that rather than printing zero percent, which reads as catastrophic failure when the truth is missing data. The recoverable figure is an estimate from your own commitment terms, not an invoice. If a source table you name turns out to be empty or unreadable, it says which one and builds nothing.\n\nAn alert watches for vendors crossing their commitment and tells you, so the scorecard does not depend on somebody remembering to open it. You also get a natural-language view over the same measures, so you can ask which vendors are worst on late delivery this quarter without writing the query.\n\nOngoing, two tables refresh on a lag you set and an alert evaluates on a schedule, which together come to roughly two credits a month at the default hourly lag.","dist":"Vendor_OTIF_Scorecard_Setup.sql","path":"solutions/sc1_vendor_otif/dist/Vendor_OTIF_Scorecard_Setup.sql","bytes":688044,"schema":"VENDOR_OTIF","gate":"OTIF_APPROVE","prefix":"OTIF","steps":{"mode":true,"tier":true,"rate":3.0,"preflight":true,"oneClick":true,"teardown":true},"launchSteps":null,"configuration":"sql_settings","app":"VENDOR_OTIF_APP","agent":"","editing":{"profile":"shared_streamlit","one_file_edit_handoff":true,"workspace_preparation_required":false,"source_handoff_live_verified":false,"ui_edit_rollback_verified":true,"snowsight_source_edit_verified":false,"container_verified":false,"sql_edit_verified":false,"full_backend_pipeline_verified":false},"credits":0.000204166,"standing":{"declared":true,"oneTime":false,"kind":"DYNAMIC_TABLE","object":"VENDOR_SCORECARD","cadence":"60 minutes","dial":"TARGET_LAG_MINUTES","why":"Your suppliers measure their own delivery performance and report it to you. The version measured from your own purchase orders and receipts is the one you can hold up in a negotiation, and it is usually the one nobody has built \u2014 so shortfalls get absorbed as noise instead of recovered as money.","runsPerMonth":720.0,"runsHow":"43,200 min/month / 60 min","scaling":"LINEAR","exponent":1.0,"sessionShape":"MATERIALIZED","intervalSec":3600.0,"measured":false},"team":"Supply Chain & Planning","log":[{"kind":"run","text":"EXECUTE IMMEDIATE  \u00b7  Vendor_OTIF_Scorecard_Setup.sql"},{"kind":"ok","text":"36 statements, none failed"},{"kind":"ok","text":"alert chronic late exists"},{"kind":"ok","text":"build context"},{"kind":"ok","text":"vendor scorecard rows  \u00b7  15"},{"kind":"ok","text":"chargeback candidates rows  \u00b7  15"},{"kind":"ok","text":"dt refresh mode declared incremental  \u00b7  2"},{"kind" /* ═══ the rails ════════════════════════════════════════════════════════════
   Dealt alternately rather than sliced in half, so the two rails stay the same
   length under any filter and one side never ends up empty. */
function railCard(it, i) {

  // position, because a pair can only converge if both halves share a duration and
  // a phase -- `row` is the position inside this rail (i%2 deals the two rails, so
  // vertical neighbours are i and i+2), and `pair` is the two rows that nudge each
  // other. Character comes from the seed, so sway and tilt are still identical on
  // every build even though timing follows the current ordering.
  const row = Math.floor(i / 2);
  const pair = Math.floor(row / 2);
  b.style.setProperty('--dur', (6.6 + (pair % 5) * 0.55) + 's');
  b.style.setProperty('--del', -((pair * 1.7) % 6.4) + 's');

  // drifting in convoy.
  b.style.setProperty('--dir', row % 2 ? '-1' : '1');
  b.style.setProperty('--ax', (0.8 + (it.seed % 13) / 10) + 'px');
  b.style.setProperty('--rz', (0.18 + (it.seed % 25) / 100) + 'deg');

  g.classList.add('card__g');

  b.appendChild(txt);
  b.appendChild(el('span', 'card__grip'));

  // single-pointer alternative for every dragging movement, so the click above is
  // the real interaction. What the grip, the drift and the rail hint buy is only
  // discovery: drag was otherwise invisible, and an invisible affordance is one
  // nobody uses.
  b.addEventListener('dragstart', e => {
