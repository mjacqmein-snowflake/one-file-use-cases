/* ── the handoff card ───────────────────────────────────────────────────────────
   ONE ADDRESS, SUBSTITUTED AT BUILD TIME FROM THE SAME CONSTANT THAT DRAWS THE
   QR CODE. Not a second literal: see build_catalog.py, where the reasoning for a
   single copy is recorded above QR_URL. The card itself is CSS-gated to 899px and
   below, so this runs on every build and is simply never seen on a projector.

   THE ORDER OF THE SEND CHAIN IS THE WHOLE IMPLEMENTATION, and it is ordered
   around transient activation rather than around preference. Every API here is
   spent from the same one-shot budget the tap opened, so the moment anything is
   awaited the budget is gone and iOS answers the next call with NotAllowedError.
   Hence: the textarea is built and SELECTED first, synchronously, before any API
   is touched -- that is what leaves execCommand viable inside an async rejection
   handler, which is the one path where the gesture really has expired. */
const HANDOFF_URL = 'https://sfc-gh-mjacqmein.github.io/one-file-use-cases/';

function handoff() {
  const box = el('section', 'hand');
  box.setAttribute('aria-label', 'Open this catalog on a computer');

  /* The count comes off the payload, never typed. A hand-written "34 use cases"
     is wrong the first time one is added and nothing about it looks wrong. */
  box.appendChild(el('p', 'hand__t', items.length + ' Snowflake use cases, each '
    + 'one built and measured. There is a lot to read here and it reads better on '
    + 'a computer, so here is the address.'));

  box.appendChild(el('code', 'hand__u', HANDOFF_URL));

  const row = el('div', 'hand__r');
  const say = el('p', 'hand__s');
  /* polite, not assertive: this line confirms a thing the reader just did on
     purpose and must not interrupt what they are reading next. */
  say.setAttribute('role', 'status');
  say.setAttribute('aria-live', 'polite');

  const send = el('button', 'hand__b', 'Send to my laptop');
  send.type = 'button';
  send.addEventListener('click', () => {
    /* The spec permits a user agent to withhold trust from file: even though it
       is nominally a secure context, and both share and clipboard are gated on
       it. If it is withheld, say so and point at the address, which still works
       with no API at all. */
    if (!window.isSecureContext) {
      say.textContent = 'This browser will not let a local page copy for you. '
        + 'The address above can be selected with one tap.';
      return;
    }

    /* FIRST, AND BEFORE ANY API. left:-999999px rather than display:none, which
       iOS Safari refuses to select from; readonly so no keyboard opens; and
       setSelectionRange rather than select(), which iOS ignores. */
    const ta = el('textarea');
    ta.value = HANDOFF_URL;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:absolute;left:-999999px;top:0';
    document.body.appendChild(ta);
    ta.focus();
    ta.setSelectionRange(0, HANDOFF_URL.length);

    const ok = msg => { ta.remove(); say.textContent = msg; };
    /* The only thing still permitted once a promise has settled: the selection
       above already exists, and execCommand does not need a secure context. */
    const stale = () => {
      let done = false;
      try { done = document.execCommand('copy'); } catch (e) { done = false; }
      ok(done ? 'Copied. Paste it into a browser on your laptop.'
              : 'Could not copy. The address above can be selected with one tap.');
    };

    /* Both guards, because desktop Firefox has neither share nor canShare and a
       bare navigator.share(...) there is a TypeError, not a rejection. And {text},
       not {url}: the offline copy of this file has no shareable URL of its own, so
       url would resolve to a local path that means nothing on another device. */
    if (navigator.canShare && navigator.canShare({ text: HANDOFF_URL })) {
      navigator.share({ text: HANDOFF_URL }).then(
        () => ok('Sent.'),
        /* AbortError is returned both when the reader cancelled and when the OS
           offered no share targets at all. The two are indistinguishable, and
           calling a deliberate cancel a failure is the worse mistake. */
        err => (err && err.name === 'AbortError') ? ok('Sent.') : stale()
      );
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(HANDOFF_URL).then(
        () => ok('Copied. Paste it into a browser on your laptop.'),
        stale
      );
      return;
    }
    stale();
  });
  row.appendChild(send);

  /* The one transport that actually arrives on another machine. sms: is
     deliberately absent -- iOS and Android cannot be satisfied by one href
     without sniffing the user agent. */
  const body = 'The One-File Use Cases catalog:\r\n\r\n' + HANDOFF_URL + '\r\n';
  const mail = el('a', 'hand__a', 'Email it to me');
  const href = 'mailto:?subject=' + encodeURIComponent('One-File Use Cases')
    + '&body=' + encodeURIComponent(body);
  /* Chrome is the floor at roughly 2000 characters and truncates silently. This
     payload is about 130, so the guard is not load-bearing today -- it is here so
     that a longer body added later fails loudly rather than arriving cut in half. */
  mail.href = href.length > 1900
    ? 'mailto:?subject=' + encodeURIComponent('One-File Use Cases')
    : href;
  row.appendChild(mail);

  const browse = el('button', 'hand__b hand__b--alt', 'Browse all ' + items.length);
  browse.type = 'button';
  /* The existing list view, not a new one: its grid is already a single column at
     this width, so the phone path needs no separate layout. */
  browse.addEventListener('click', () => {
    show('list');
    $('#list').scrollIntoView({ block: 'start' });
  });
  row.appendChild(browse);

  box.appendChild(row);
  box.appendChild(say);
  const tray = $('#tray');
  tray.parentNode.insertBefore(box, tray);
}
handoff();

/* HOME, and it clears EVERY narrowing rather than only the obvious one.
   A reader who wants the opening questions back has usually arrived there by
   several moves at once -- a situation route, then a category chip, then a search
   term, then a use case on the stage -- and a home button that reset only the stage
   would return them to a front door still filtered down to three use cases, which
   looks like the button half-worked. It also drops the hash: leaving #14_agent_
   deployment in the address bar means a reload undoes the reset. */
$('#t-home').addEventListener('click', () => {
  route = null;
  filters.clear();
  q = '';
  activeKey = null;
  $('#q').value = '';
  $$('.chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
  // A sandboxed frame throws SecurityError on replaceState, and an exception here
  // would abandon the reset half-done -- filters cleared, stage not repainted.
  try {
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  } catch (e) { /* the hash survives; everything else still resets */ }
  show('stage');
  paint();
  emptyStage();
  window.scrollTo({ top: 0, behavior: still() ? 'auto' : 'smooth' });
});
$('#t-motion').addEventListener('click', () => {
  const off = document.body.classList.toggle('nomotion');
  $('#t-motion').textContent = off ? 'Motion off' : 'Motion on';
  $('#t-motion').setAttribute('aria-pressed', off ? 'true' : 'false');
  // AND IT HAS TO STOP WHAT IS ALREADY MOVING. `still()` is read when the
  // walkthrough STARTS, so without this a reader who turns motion off mid-lap
  // keeps watching the screens change -- the one thing they just asked to end.
  // Nothing restarts it on the way back: turning motion on is permission, not
  // an instruction, and repainting the stage under someone is not what they
  // pressed the button for. The arrows are right there.
  if (off) stopPlay();
});

/* Left and right walk the rails, so the whole surface is operable from the
   keyboard without touching a card. */
document.addEventListener('keydown', e => {
  // The overlay is modal, so it eats the keys first: Escape closes it, and the
  // arrows walk its screens rather than swapping the use case underneath it.
  if (lbOpen) {
    if (e.key === 'Escape') { closeLightbox(); e.preventDefault(); return; }
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      stopPlay();
      paintFrame(at + (e.key === 'ArrowRight' ? 1 : -1));
      e.preventDefault();
    }
    return;
  }
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  const got = shown();
  if (!got.length) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    const i = got.findIndex(x => x.key === activeKey);
    const d = e.key === 'ArrowRight' ? 1 : -1;
    promote(got[(i < 0 ? 0 : i + d + got.length) % got.length], { quiet: true });
    e.preventDefault();
  }
});

window.addEventListener('hashchange', fromHash);
function fromHash() {
  const k = decodeURIComponent(location.hash.replace(/^#/, ''));
  const it = items.find(i => i.key === k);
  if (it) { show('stage'); promote(it, { quiet: true }); }
}

chips();
paintSeen();
emptyStage();
paint();
fromHash();

/* ═══ the intro ════════════════════════════════════════════════════════════════
   Under five seconds, once, and it removes itself. The CSS has been in the file
   for a while with nothing to unhide it, which is why it has never played.

   WHAT IT IS ALLOWED TO SAY. Three figures, all read off the same DATA the rest of
   the page renders, none of them retyped here: the count, the audit, and a
   PROJECTED cost computed by calling the page's own runRate(). That last one is
   deliberate. The measured figure -- what our sample-data run happened to burn --
   was cut from the surface because nobody evaluating this is buying our demo, and
   an intro is the worst possible place to reintroduce it: it would be the first
   number a reader ever sees, and it would be about us.

   WHY IT CALLS runRate() RATHER THAN CARRYING ITS OWN ARITHMETIC. A splash screen
   with a hand-copied cost model is a second model, and the moment the panel's
   assumptions change the intro starts telling a different story than the page it
   is introducing. It reads the median across the use cases that can answer, so it
   is a claim about a typical one rather than a total nobody would ever deploy.

   WHEN IT DOES NOT RUN, and each of these is a real case rather than defensive
   padding:
     - `still()`: prefers-reduced-motion, or the motion toggle. WCAG 2.2.2 exempts
       motion under five seconds that does not loop, so this is not required -- but
       a reader who has asked for less motion has asked for this too.
     - `?intro=0`: how the verification tools get the catalog without a splash over
       it. probe.py and responsive.mjs measure geometry, and a fixed overlay for
       the first four seconds would poison every measurement they take.
     - A DEEP LINK. Somebody arriving at #14_agent_deployment was sent to that use
       case by a colleague; standing a title card in front of it makes them wait to
       see the thing they were promised. The intro is for the front door only. */
function intro() {
  const box = $('#intro');
  if (!box) return;
  const noIntro = /[?&]intro=0/.test(location.search);
  if (still() || noIntro || location.hash) return;

  // The mark, cloned from the masthead rather than a second copy of 6KB of path
  // data. `false` on the clone would take the <g> and lose every arm.
  const src = $('.top__lock .mark');
  if (src) {
    const m = src.cloneNode(true);
    m.setAttribute('class', 'intro__mark');
    m.setAttribute('width', '74');
    m.setAttribute('height', '74');
    $('#intro-mark').appendChild(m);
  }

  $('#intro-s').textContent = DATA.subtitle || '';

  // NO COST FIGURE HERE, DELIBERATELY. This used to print the median of runRate()
  // across the shipping use cases as "$820-$4,900, a typical one, per year, at the
  // defaults", and it was removed because it was the repo's WEAKEST number standing in
  // its MOST PROMINENT position.
  //
  // The figure itself was not wrong. It was right about something nobody was asking.
  // "At the defaults" means: only the standing objects THIS FILE declares, refreshing
  // at their declared cadence, on an X-SMALL at 1 credit/hour, 40 users, $2.60/credit.
  // An SE reading a cost on a use-case catalog is sizing a PRODUCTION deployment --
  // bigger warehouse, real data volume, real head-count, and the whole pipeline around
  // the artifact rather than the artifact alone. Those two quantities differ by more
  // than an order of magnitude, and the gap is mostly warehouse size: the same model
  // on a Large is 8x, which lands near the $50k/year an SE would actually expect.
  //
  // A four-second splash has no room to state that distinction, and "at the defaults"
  // does not carry it -- no reader decodes six assumptions from four words. So the
  // number anchored every reader LOW on the first screen they saw, which is worse than
  // showing nothing: quote a customer $820/year and the first real invoice destroys
  // the trust the rest of this catalog spends so much effort earning.
  //
  // The fix was NOT to raise the default until the number looked impressive. That
  // would be picking a figure for its effect and reverse-engineering an assumption to
  // justify it, which is the exact failure this repo exists to avoid. The consumption
  // PANEL still shows all of it, and it has what the intro cannot give: the band, the
  // derivation, the size selector, and the named assumptions. Cost belongs where a
  // reader can argue with it.
  //
  // The two remaining stats are MEASURED FACTS about the repo, not projections.
  // Putting a model beside them lent the model an authority it had not earned.
  //
  // THE SECOND STAT USED TO BE THE CHECK TALLY -- "N checks pass, none fail" -- and it
  // is now the size of a typical file. The tally was measured and true, and it was
  // still the wrong thing to put on the first screen a customer sees: it made the
  // opening claim of the catalog a claim about our test suite. It also could not stay
  // true by construction, since "none fail" is a sentence the intro asserts on behalf
  // of twenty-seven separate live runs, and the moment one of them regresses the splash
  // is lying before the reader has scrolled.
  //
  // The MEDIAN file size carries the actual proposition instead, and it is measured the
  // same way. Median rather than total: the total is 18.9 MB, which reads as weight and
  // invites the wrong question, while "737 KB" next to "one file each" is the whole
  // pitch -- this is a paste, not an install. Median rather than mean because the set
  // spans 244 KB to 939 KB and the mean would describe no actual file in it.
  const med = (a => a.length ? a[a.length >> 1] : 0)(
    items.map(i => i.bytes || 0).sort((x, y) => x - y));
  const stats = [
    [items.length, 'use cases, one file each'],
    [Math.round(med / 1e3) + ' KB', 'the typical file, nothing to install'],
  ];

  const ul = $('#intro-stats');
  stats.forEach(s => {
    const li = el('li');
    const n = el('span', 'intro__n');
    // Integers count. A range does not -- a number rolling up to a dash and a
    // second number is a gimmick reading as a glitch, so it lands whole.
    n.textContent = typeof s[0] === 'number' ? '0' : s[0];
    li.appendChild(n);
    li.appendChild(el('span', 'intro__k', s[1]));
    ul.appendChild(li);
    if (typeof s[0] === 'number') countUp(n, s[0], 1300);
  });

  box.hidden = false;
  document.body.classList.add('introon');

  // ONE teardown, whoever calls it. The CSS fades the card out at 2.9s and takes
  // 0.5s to do it, so 3.4s is the animation ending rather than a number chosen to
  // feel about right. KEEP THESE TWO IN STEP: this timeout and the `introOut`
  // animation-delay in the CSS are the same instant expressed twice, and a change
  // to one alone either removes the card mid-fade or leaves a fully transparent
  // layer sitting over the page. Removing the node matters: left in the document it
  // is a fixed layer over the whole page, and `hidden` alone has been enough to
  // make a surface unclickable before.
  let done = false;
  const end = () => {
    if (done) return;
    done = true;
    clearTimeout(t);
    box.remove();
    document.body.classList.remove('introon');
    document.removeEventListener('keydown', esc, true);
  };
  const esc = e => { if (e.key === 'Escape') { end(); e.preventDefault(); } };
  const t = setTimeout(end, 3400);

  // Three ways out, because a reader who wants to start reading should not have to
  // find the one right pixel: the button, Escape, or anywhere on the card.
  $('#intro-skip').addEventListener('click', e => { e.stopPropagation(); end(); });
  box.addEventListener('click', end);
  document.addEventListener('keydown', esc, true);
}

/* Counts an integer up over `ms`. eased, so it decelerates into the figure rather
   than stopping dead.

   IT LANDS ON THE TRUTH EVEN IF IT NEVER ANIMATES, and that is the whole design of
   this function rather than a nicety. requestAnimationFrame does not fire in a
   background tab and is not driven under a headless virtual clock, both of which
   are real ways this page gets opened -- so a count-up that starts at zero and
   waits for a frame can leave "0 use cases" and "0 checks pass" on screen. Caught
   exactly that way: a headless probe read nums=0|0 at 1.5s.

   So the node is written with the FINAL figure first and the animation is an
   embellishment on top of an already-correct number, and a setTimeout lands it
   regardless. The failure mode is now a figure that appears without counting,
   which costs nothing, instead of a headline that is wrong. */
function countUp(node, to, ms) {
  const land = () => { node.textContent = to.toLocaleString(); };
  land();
  let done = false, t0 = null;
  const tick = now => {
    if (done) return;
    // t0 COMES FROM THE FIRST FRAME, NOT FROM performance.now() AT CALL TIME. Those
    // are nominally the same clock, but the first callback can carry the timestamp of
    // a frame that was already in flight when this was scheduled -- which makes the
    // elapsed time NEGATIVE. Measured: the offline build rendered "-0 use cases" and
    // "-4 checks pass". Taking the origin from the frame itself makes the two
    // readings self-consistent, and the clamp means no arithmetic surprise can put a
    // minus sign in front of a headline figure again.
    if (t0 === null) t0 = now;
    const p = Math.min(1, Math.max(0, (now - t0) / ms));
    const e = 1 - Math.pow(1 - p, 3);
    node.textContent = Math.round(to * e).toLocaleString();
    if (p < 1) requestAnimationFrame(tick);
    else { done = true; land(); }
  };
  requestAnimationFrame(tick);
  // The backstop. Fires after the animation would have finished; if frames were
  // running it is a no-op onto the value already there.
  setTimeout(() => { done = true; land(); }, ms + 120);
}

intro();
</script>
</body>
</html>
