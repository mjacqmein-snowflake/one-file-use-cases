ate":"GENFILL_APPROVE","prefix":"GENFILL","steps":{"mode":true,"tier":true,"rate":3.0,"preflight":true,"oneClick":true,"teardown":true},"launchSteps":null,"configuration":"sql_settings","app":"GENERATIVE_COMPLETION_APP","agent":"","editing":{"profile":"shared_streamlit","one_file_edit_handoff":true,"workspace_preparation_required":false,"source_handoff_live_verified":false,"ui_edit_rollback_verified":true,"snowsight_source_edit_verified":false,"container_verified":false,"sql_edit_verified":false,"full_backend_pipeline_verified":false},"credits":0.20881480300000002,"standing":{"declared":true,"oneTime":false,"kind":"TASK","object":"TASK_ENRICH_NEW_ROWS","cadence":"360 MINUTE (every 6 hours)","dial":"ENRICH_SCHEDULE","why":"A one-shot fill is stale the moment the next row lands, and the rows that land are exactly the ones nobody has looked at. This keeps every configured column complete as data arrives, with the never-generate refusal list and the holdout accuracy figure still standing between the model and anything you act on.","runsPerMonth":120.0,"runsHow":"43,200 min/month / 360 min","scaling":"LINEAR","exponent":1.0,"sessionShape":"MATERIALIZED","intervalSec":21600.0,"measured":false},"team":"Platform & IT","log":[{"kind":"run","text":"EXECUTE IMMEDIATE  \u00b7  Generative_Completion_Setup.sql"},{"kind":"ok","text":"38 statements, none failed"},{"kind":"ok","text":"holdout has accuracy"},{"kind":"ok","text":"build context"},{"kind":"ok","text":"candidates view  \u00b7  3"},{"kind":"ok","text":"enrichment table  \u00b7  1"},{"kind":"ok","text":"enrichment has provenance  \u00b7  1"},{"kind":"ok","text":"enriched view  \u00b7  501"},{"kind":"ok","text":"holdout results  \u00b7  180"},{"kind":"ok","text":"dashboard deployed  \u00b7  GENERATIVE_COMPLETION_APP"},{"kind":"cost","text":"0.2088 credits, measured"},{"kind":"done","text":"GENERATIVE_COMPLETION is standing"},{"kind":"ok","text":"Compact installer packaging and ordered-phase regression checks passed"},{"kind":"run","text":"Current revision has targeted execution checks, not a repeated full app-deployment gauntlet"}],"seed":115,"thumb":"img/03_generative_completion_thumb.webp","full":"img/03_generative_completion_full.webp","frames":["img/03_generative_completion_s1.webp","img/03_generative_completion_s2.webp","img/03_generative_completion_s3.webp","img/03_generative_completion_s4.webp","img/03_generative_completion_s5.webp"],"play":"AI & agents"},{"key":"04_snowpark_migration","name":"Snowpark Migration Assessment","group":"Analytics & BI","fam":"analytics","headline":"Find transformation work running outside Snowflake, rebuild a scoped piece inside it, and measure both sides.","body":"Discovery is metadata-only. It reads query history joined to sessions, so the tool identity in the user and role names is visible rather than just the driver string, plus load history, repeated query shapes, existing Python procedures and tasks, and warehouse spill and queue pressure.\n\nThe central judgement \u2014 already Snowflake-native, a Snowpark candidate, or best left alone \u2014 is made by a model rather than a pattern list, because one connector string can mean a transformation framework, an orchestrator, a notebook or an integration agent, and only the account names distinguish them. Every identifier the model returns is checked against the discovered inventory, anything it does not classify falls back to a deterministic ranking, and the candidates view records which of the two decided each row.\n\nThe comparison has three measured arms and one reported. Measured: the Snowpark rebuild, the same transformation written as one SQL statement, and the unload-plus-full-re-read that an external engine pays before it computes anything. Reported: your own figures, because Snowflake cannot observe what happens inside an external job. Labelling that as reported rather than filling in a number is the point \u2014 the report says which figures were measured and which you supplied.\n\nA parity check sits alongside it, because a comparison between two things that compute different answers is not a comparison. It has to read zero.\n\nOngoing, a daily task keeps the rebuilt transformation on a schedule, since the work it replaces was already running on one.","dist":"Snowpark_Migration_Setup.sql","path":"solutions/04_snowpark_migration/dist/Snowpark_Migration_Setup.sql","bytes":773734,"schema":"SNOWPARK_MIGRATION","gate":"SNOWPARK_APPROVE","prefix":"SNOWPARK","steps":{"mode":true,"tier":true,"rate":3.0,"preflight":true,"oneClick":true,"teardown":true},"launchSteps":null,"configuration":"sql_settings","app":"SNOWPARK_MIGRATION_APP","agent":"ASSESS_WORKLOAD","editing":{"profile":"shared_streamlit","one_file_edit_handoff":true,"workspace_preparation_required":false,"source_handoff_live_verified":false,"ui_edit_rollback_verified":true,"snowsight_source_edit_verified":false,"container_verified":false,"sql_edit_verified":false,"full_backend_pipeline_verified":false},"credits":0.046789127,"standing":{"declared":true,"oneTime":false,"kind":"TASK","object":"TASK_SNOWPARK_TRANSFORM","cadence":"daily at 02:00 UTC","dial":"TRANSFORM_SCHEDULE","why":"The migration is one-time but the transformation it replaces ran on a schedule outside Snowflake, so leaving it unscheduled abandons the migration.","runsPerMonth":30.0,"runsHow":"daily, 30 days/month","scaling":"LINEAR","exponent":1.0,"sessionShape":"MATERIALIZED","intervalSec":86400.0,"measured":false},"team":"Platform & IT","log":[{"kind":"run","text":"EXECUTE IMMEDIATE  \u00b7  Snowpark_Migration_Setup.sql"},{"kind":"ok","text":"35 statements, none failed"},{"kind":"ok","text":"snowpark procs exist"},{"kind":"ok","text":"build context"},{"kind":"ok","text":"workload inventory  \u00b7  3015"},{"kind":"ok","text":"workloads classified  \u00b7  24"},{"kind":"ok","text":"candidates view  \u00b7  24"},{"kind":"ok","text":"every candidate has a decider  \u00b7  0"},{"kind":"ok","text":"adaptation logged  \u00b7  1"},{"kind":"ok","text":"dashboard deployed  \u00b7  SNOWPARK_MIGRATION_APP"},{"kind":"ok","text":"agent created  \u00b7  ASSESS_WORKLOAD"},{"kind":"cost","text":"0.0468 credits, measured"},{"kind":"done","text":"SNOWPARK_MIGRATION is standing"},{"kind":"ok","text":"Compact installer packaging and ordered-phase regression checks passed"},{"kind":"run","text":"Current revision has targeted execution checks, not a repeated full app-deployment gauntlet"}],"seed":762,"thumb":"img/04_snowpark_migration_thumb.webp","full":"img/04_snowpark_migration_full.webp","frames":["img/04_snowpark_migration_s1.webp","img/04_snowpark_migration_s2.webp","img/04_snowpark_migration_s3.webp","img/04_snowpark_migration_s4.webp","img/04_snowpark_migration_s5.webp"],"play":"Analytics & BI"},{"key":"05_ml_migration","name":"ML Migration Assessment","group":"AI & agents","fam":"ai","headline":"Find machine learning running outside Snowflake, rebuild one model inside it, and compare accuracy, latency and cost.","body":"Discovery is metadata-only and looks for the five traces an external ML pipeline leaves in a Snowflake account: model artifacts sitting in stages, functions and procedures whose bodies import an ML library or load an artifact, tables shaped like imported predictions, whatever Snowflake-native ML already exists, and repeated scoring query shapes with their cost.\n\nA model makes the classification rather than a pattern list, because a column called SCORE is very often not a model output. It is a lead score, a satisfaction score, a risk scorecard, a credit score from a CASE expression. A table called CHURN_PROBABILITY genuinely is one. Every identifier is checked against discovery before use, and anything unclassified falls back to a deterministic rule.\n\nThe comparison has two fully measured arms, one half-measured, and one reported. Measured: a model trained and scored inside Snowflake on a holdout, and a weight-of-evidence scorecard fitted in pure SQL on the same split \u2014 the honest counterweight, because it answers whether you need ML here at all. Half-measured: your existing model's own predictions, joined to the same holdout rows and ranked, so its accuracy is a real computation while its cost stays empty. Reported: the latency and cost you supply.\n\nThat third arm is why this is not a strawman. Snowflake can measure how good your existing model is, because you already write its predictions back. It cannot measure what that model cost to produce. Those two facts are split out rather than one of them being quietly filled in.\n\nAccuracy is measured on a holdout. The split is deterministic, training reads only the training side, and an assertion checks that the two sides share no rows, so a leaked metric fails the test rather than flattering the report.\n\nOngoing, a daily task scores new rows, which is the part that actually replaces the external pipeline.","dist":"ML_Migration_Setup.sql","path":"solutions/05_ml_migration/dist/ML_Migration_Setup.sql","bytes":790420,"schema":"ML_MIGRATION","gate":"MLMIG_APPROVE","prefix":"MLMIG","steps":{"mode":true,"tier":true,"rate":3.0,"preflight":true,"oneClick":true,"teardown":true},"launchSteps":null,"configuration":"sql_settings","app":"ML_MIGRATION_APP","agent":"","editing":{"profile":"shared_streamlit","one_file_edit_handoff":true,"workspace_preparation_required":false,"source_handoff_live_verified":false,"ui_edit_rollback_verified":true,"snowsight_source_edit_verified":false,"container_verified":false,"sql_edit_verified":false,"full_backend_pipeline_verified":false},"credits":0.138637127,"standing":{"declared":true,"oneTime":false,"kind":"TASK","object":"TASK_RESCORE","cadence":"daily at 03:00 UTC","dial":"RESCORE_SCHEDULE","why":"A model that scores once is a demo; scoring new rows on a schedule inside the warehouse is the thing that replaces the external pipeline.","runsPerMonth":30.0,"runsHow":"daily, 30 days/month","scaling":"LINEAR","exponent":1.0,"sessionShape":"MATERIALIZED","intervalSec":86400.0,"measured":false},"team":"Platform & IT","log":[{"kind":"run","text":"EXECUTE IMMEDIATE  \u00b7  ML_Migration_Setup.sql"},{"kind":"ok","text":"44 statements, none failed"},{"kind":"ok","text":"classification values are legal"},{"kind":"ok","text":"build context"},{"kind":"ok","text":"ml footprint  \u00b7  21"},{"kind":"ok","text":"footprint has every asset kind  \u00b7  3"},{"kind":"ok","text":"classification rows  \u00b7  21"},{"kind":"ok","text":"candidates view  \u00b7  21"},{"kind":"ok","text":"every asset has a decider  \u00b7  0"},{"kind":"ok","text":"dashboard deployed  \u00b7  ML_MIGRATION_APP"},{"kind":"cost","text":"0.1386 credits, measured"},{"kind":"done","text":"ML_MIGRATION is standing"},{"kind":"ok","text":"Compact installer packaging and ordered-phase regression checks passed"},{"kind":"run","text":"Current revision has targeted execution checks, not a repeated full app-deployment gauntlet"}],"seed":719,"thumb":"img/05_ml_migration_thumb.webp","full":"img/05_ml_migration_full.webp","frames":["img/05_ml_migration_s1.webp","img/05_ml_migration_s2.webp","img/05_ml_migration_s3.webp","img/05_ml_migration_s4.webp","img/05_ml_migration_s5.webp"],"play":"AI & agents"},{"key":"06_iceberg_migration","name":"Iceberg Migration Assessment","group":"Data engineering","fam":"de","headline":"Find which of your tables can move to Iceberg, convert a scoped set, and prove the result matches.","body":"Scans your existing Snowflake tables for Iceberg eligibility and reports what qualifies and what blocks the rest. On approval it converts a set you choose to Snowflake-managed Iceberg tables, then proves parity and reports query performance and cost on both sides. Source tables are never modified, so the comparison is reversible.\n\nThe conversion is a one-time job. Converted tables carry no schedule of their own and refresh stays with whatever already writes them, so there is no ongoing cost to carry.","dist":"Iceberg_Migration.sql","path":"solutions/06_iceberg_migr bp","img/06_iceberg_migration_s4.webp"],"play":"Data engineering"},{"key":"07_semantic_model_from_history","name":"Semantic Model from Query History","group":"Analytics & BI","fam":"analytics","headline":"Derive your metric definitions from what people actually query, then check them against your dashboards.","body":"Run the complete file with a database and warehouse selected. No variables need changing for the initial run. It combines bounded BI query-history evidence with visible metadata, validates proposed source choices, builds the existing React dashboard and returns its direct OPEN_APP_URL.\n\nThe dashboard retains query patterns, cold-versus-cached baselines, tool detection, traffic, metric candidates and the dashboard-versus-Analyst comparison log. An initial semantic view uses observed source columns and a source-row count; it does not invent primary keys, relationships or business metric formulas.\n\nAI inference and warehouse usage are billable. The initial build does not enable production schedules, review overrides or always-on warehouse warming. Missing privileges and incompatible sources are reported explicitly.","dist":"Semantic_Model_From_History_Setup.sql","path":"solutions/07_semantic_model_from_history/dist/Semantic_Model_From_History_Setup.sql","bytes":750256,"schema":"SEMANTIC_MODEL_FROM_HISTORY","gate":"SEMANTIC_MODEL_APPROVE","prefix":"SEMANTIC_MODEL","steps":{"mode":true,"tier":true,"rate":3.0,"preflight":true,"oneClick":true,"teardown":true},"launchSteps":null,"configuration":"sql_settings","app":"SEMANTIC_MODEL_FROM_HISTORY_APP","agent":"","editing":{"profile":"shared_streamlit","one_file_edit_handoff":true,"workspace_preparation_required":false,"source_handoff_live_verified":false,"ui_edit_rollback_verified":true,"snowsight_source_edit_verified":false,"container_verified":false,"sql_edit_verified":false,"full_backend_pipeline_verified":false},"credits":0.009852428,"standing":{"declared":true,"oneTime":false,"kind":"TASK","object":"TASK_ ody":"Discovers the join keys already present in your tables \u2014 postal code, city, country, company name, domain, IP address, date \u2014 measures how well each is populated, maps each key to the enrichment dimensions it unlocks through the Snowflake Marketplace, and recommends real listings, free ones first and paid ones with a justification.\n\nIt installs nothing. Acquiring a listing is an account-level action you take deliberately, so the plan emits the exact steps for each one, clearly marked as manual.\n\nOne known limit: join-key detection works from column naming, so a key stored under an unconventional name will be missed.\n\nOngoing, a dynamic table rejoins the enriched data twice a day, since Marketplace shares update on the provider's cadence rather than yours.","dist":"Marketplace_Enrichment_Setup.sql","path":"solutions/08_marketplace_enrichment/dist/Marketplace_Enrichment_Setup.sql","bytes":727613,"schema":"MARKETPLACE_ENRICHMENT","gate":"ENRICH_APPROVE","prefix":"ENRICH","steps":{"mode":true,"tier":true,"rate":3.0,"preflight":true,"oneClick":true,"teardown":true},"launchSteps":null,"configuration":"sql_settings","app":"MARKETPLACE_ENRICHMENT_APP","agent":"","editing":{"profile":"shared_streamlit","one_file_edit_handoff":true,"workspace_preparation_required":false,"source_handoff_live_verified":false,"ui_edit_rollback_verified":true,"snowsight_source_edit_verified":false,"container_verified":false,"sql_edit_verified":false,"full_backend_pipeline_verified":false},"credits":0.043533556,"standing":{"declared":true,"oneTime":false,"kind":"DYNAMIC_TABLE","object":"DT_ENRICHED_CUSTOMERS","cadence":"720 minutes","dial":"TARGET_LAG_MINUTES","why":"Marketplace shares update on the provider's cadence, and joining fresh third-party data to your own on a schedule is the value of the share. This only holds once the setting names a listing you have actually acquired. Left blank, this table joins nothing, refreshes a copy of the source table twice a day, and should be dropped rather than scheduled \u2014 the build tells you which of the two it did.","runsPerMonth":60.0,"runsHow":"43,200 min/month / 720 min","scaling":"LINEAR","exponent":1.0,"sessionShape":"MATERIALIZED","intervalSec":43200.0,"measured":false},"team":"Marketing & Loyalty","log":[{"kind":"run","text":"EXECUTE IMMEDIATE  \u00b7  Marketplace_Enrichment_Setup.sql"},{"kind":"ok","text":"26 statements, none failed"},{"kind":"ok","text":"build context"},{"kind":"ok","text":"opportunities view  \u00b7  8"},{"kind":"ok","text":"free listings  \u00b7  8"},{"kind":"ok","text":"paid candidates  \u00b7  8"},{"kind":"ok","text":"semantic view exists"},{"kind":"ok","text":"teardown proc exists"},{"kind":"ok","text":"dashboard deployed  \u00b7  MARKETPLACE_ENRICHMENT_APP"},{"kind":"cost","text":"0.0435 credits, measured"},{"kind":"done","text":"MARKETPLACE_ENRICHMENT is standing"},{"kind":"ok","text":"Compact installer packaging and ordered-phase regression checks passed"},{"kind":"run","text":"Current revision has targeted execution checks, not a repeated full app-deployment gauntlet"}],"seed":309,"thumb":"img/08_marketplace_enrichment_thumb.webp","full":"img/08_marketplace_enrichment_full.webp","frames":["img/08_marketplace_enrichment_s1.webp","img/08_marketplace_enrichment_s2.webp","img/08_marketplace_enrichment_s3.webp","img/08_marketplace_enrichment_s4.webp","img/08_marketplace_enrichment_s5.webp"],"play":"Apps & collaboration"},{"key":"09_rmn_cleanroom","name":"Retail Media Measurement \u2014 retailer side","group":"Apps & collaboration","fam":"apps_collab","headline":"Build the half of a clean-room collaboration a retailer owns, with measured numbers and honest labels.","body":"A real clean-room collaboration needs two Snowflake accounts. This runs in one, so it does not pretend to stand up a live clean room.\n\nIt builds the side a retailer genuinely owns and can be held to: the three data assets you have to expose (audience, exposure, transactions), the join key chosen for privacy risk rather than convenience, the privacy controls \u2014 cell suppression, minimum audience size, no row-level egress \u2014 and the three measurement analyses: overlap, reach and frequency, and incremental lift.\n\nIt then runs those analyses against a simulated brand audience so there is a real measured number on screen, and labels every result as a single-account simulation in a column you cannot read the result without seeing. Finally it prints the exact objects and API calls needed to turn it into a genuine two-party collaboration, so you see the path rather than a claim.\n\nThe labelling is not padding. A single-account clean room cannot measure a partner: the run workflow requires at least two parties joined before an analysis will execute at all. A demonstration that implies otherwise ends trust the first time somebody checks.\n\nThis reads table contents, since overlap and lift cannot be computed from metadata. It creates nothing in the clean-room registry, because registering a data offering happens outside the sandbox, so the plan emits those calls for you to run deliberately.\n\nOngoing, a weekly task re-runs the measurement, because campaigns recur weekly and a single lift number is no use to a team that has to report every week.","dist":"RMN_Cleanroom_Setup.sql","path":"solutions/09_rmn_cleanroom/dist/RMN_Cleanroom_Setup.sql","bytes":836364,"schema":"RMN_CLEANROOM","gate":"RMN_APPROVE","prefix":"RMN","steps":{"mode":true,"tier":true,"rate":3.0,"preflight":true,"oneClick":true,"teardown":true},"launchSteps":null,"configuration":"sql_settings","app":"RMN_CLEANROOM_APP","agent":"EXPLAIN_PRIVACY_BLOCK","editing":{"profile":"shared_streamlit","one_file_edit_handoff":true,"workspace_preparation_required":false,"source_handoff_live_verified":false,"ui_edit_rollback_verified":true,"snowsight_source_edit_verified":false,"container_verified":false,"sql_edit_verified":false,"full_backend_pipeline_verified":false},"credits":0.280739351,"standing":{"declared":true,"oneTime":false,"kind":"TASK","object":"TASK_MEASURE_CAMPAIGNS","cadence":"weekly, Monday 06:00 UTC","dial":"MEASURE_SCHEDULE","why":"Campaigns recur weekly, so a single lift number is useless to a retail media team that has to report every week.","runsPerMonth":4.35,"runsHow":"weekly, 4.35 weeks/month","scaling":"LINEAR","exponent":1.0,"sessionShape":"MATERIALIZED","intervalSec":595862.1,"measured":false},"team":"Marketing & Loyalty","log":[{"kind":"run","text":"EXECUTE IMMEDIATE  \u00b7  RMN_Cleanroom_Setup.sql"},{"kind":"ok","text":"50 statements, none failed"},{"kind":"ok","text":"overlap has geo breakdown"},{"kind":"ok","text":"build context"},{"kind":"ok","text":"retailer audience  \u00b7  6000"},{"kind":"ok","text":"retailer exposure  \u00b7  20000"},{"kind":"ok","text":"retailer transactions  \u00b7  2472"},{"kind":"ok","text":"overlap agrees with recount  \u00b7  0"},{"kind":"ok","text":"overlap matched exact  \u00b7  2760"},{"kind":"ok","text":"dashboard deployed  \u00b7  RMN_CLEANROOM_APP"},{"kind":"ok","text":"agent created  \u00b7  EXPLAIN_PRIVACY_BLOCK"},{"kind":"cost","text":"0.2807 credits, measured"},{"kind":"done","text":"RMN_CLEANROOM is standing"},{"kind":"ok","text":"Compact installer packaging and ordered-phase regression checks passed"},{"kind":"run","text":"Current revision has targeted execution checks, not a repeated full app-deployment gauntlet"}],"seed":421,"thumb":"img/09_rmn_cleanroom_thumb.webp","full":"img/09_rmn_cleanroom_full.webp","frames":["img/09_rmn_cleanroom_s1.webp","img/09_rmn_cleanroom_s2.webp","img/09_rmn_cleanroom_s3.webp","img/09_rmn_cleanroom_s4.webp","img/09_rmn_cleanroom_s5.webp","img/09_rmn_cleanroom_s6.webp","img/09_rmn_cleanroom_s7.webp","img/09_rmn_cleanroom_s8.webp","img/09_rmn_cleanroom_s9.webp","img/09_rmn_cleanroom_s10.webp","img/09_rmn_cleanroom_s11.webp","img/09_rmn_cleanroom_s12.webp"],"play":"Apps & collaboration"},{"key":"10_streaming_ingest","name":"Streaming Ingest Assessment","group":"Data engineering","fam":"de","headline":"Find batch loads that should be streaming, stand up the streaming path, and measure the difference.","body":"The most valuable number here is not a credit figure. It is the observed data latency of each existing batch path, which most teams do not know. The gap between consecutive loads into a table is how stale that table is allowed to get, and load history has enough to compute it. A table loaded every 48 minutes has 48-minute-old data at its worst moment, whatever the pipeline diagram claims.\n\nComputing that takes one non-obvious step. Load history holds one row per file, so a single job that stages 280,000 files looks like 280,000 loads a second apart. Files are collapsed into load runs against a gap threshold before any interval is measured. Without that, every batch pipeline in the account reports one-second latency.\n\nThe classification is made by a model, because cadence alone cannot separate the three cases that matter: latency genuinely costs the business something; nobody is waiting, so streaming would add cost rather than value; or thousands of tiny files mean this is a file-sizing problem that streaming would mask and then bill for. The evidence that decides it is often the file name, which is text \u2014 a name carrying a topic, partition and offset says a streaming topic already exists and is being round-tripped through files, and nothing in the driver string, the user name or the cadence says that.\n\nTwo arms are measured and two are not. Measured: real load intervals from your own account, and real event-to-visible lag on the bundled fixture, labelled as fixture data. Not measured: the streaming target, which stays empty rather than guessed, because a SQL file cannot run a client SDK; and your own reported figures. That third arm becomes measured the moment your client connects.\n\nThat is the honest centre of this one. Everything about streaming can be built from SQL except the client. The gap view prints the exact objects, grants and call you need, and the plan says so above the statement list rather than below it.\n\nOngoing, the pipe ingests continuously as files arrive, which is the whole point and the thing a batch-loading team will not stand up on its own.","dist":"Streaming_Ingest_Setup.sql","path":"solutions/10_streaming_ingest/dist/Streaming_Ingest_Setup.sql","bytes":785832,"schema":"STREAMING_INGEST","gate":"STREAM_APPROVE","prefix":"STREAM","steps":{"mode":true,"tier":true,"rate":3.0,"preflight":true,"oneClick":true,"teardown":true},"launchSteps":null,"configuration":"sql_settings","app":"STREAMING_INGEST_APP","agent":"","editing":{"profile":"shared_streamlit","one_file_edit_handoff":true,"workspace_preparation_required":false,"source_handoff_live_verified":false,"ui_edit_rollback_verified":true,"snowsight_source_edit_verified":false,"container_verified":false,"sql_edit_verified":false,"full_backend_pipeline_verified":false},"credits":0.092714885,"standing":{"declared":true,"oneTime":false,"kind":"PIPE","object":"STREAM_PIPE_1","cadence":"continuous, on file arrival","dial":"PIPE_AUTO_INGEST","why":"Continuous low-latency ingestion is the whole point and it is the thing a batch-loading team will not stand up themselves.","runsPerMonth":null,"runsHow":"continuous, driven by arrivals rather than a schedule","scaling":"LINEAR","exponent":1.0,"sessionShape":"MATERIALIZED","intervalSec":null,"measured":false},"team":"Platform & IT","log":[{"kind":"run","text":"EXECUTE IMMEDIATE  \u00b7  Streaming_Ingest_Setup.sql"},{"kind":"ok","text":"40 statements, none failed"},{"kind":"ok","text":"latency never negative"},{"kind":"ok","text":"build context"},{"kind":"ok","text":"load events view  \u00b7  4"},{"kind":"ok","text":"ingest inventory  \u00b7  2"},{"kind":"ok","text":"latency today  \u00b7  2"},{"kind":"ok","text":"latency actually computed  \u00b7  1"},{"kind":"ok","text":"single load tables are null not zero  \u00b7  0"},{"kind":"ok","text":"dashboard deployed  \u00b7  STREAMING_INGEST_APP"},{"kind":"cost","text":"0.0927 credits, measured"},{"kind":"done","text":"STREAMING_INGEST is standing"},{"kind":"ok","text":"Compact installer packaging and ordered-phase regression checks passed"},{"kind":"run","text":"Current revision has targeted execution checks, not a repeated full app-deployment gauntlet"}],"seed":168,"thumb":"img/10_streaming_ingest_thumb.webp","full":"img/10_streaming_ingest_full.webp","frames":["img/10_streaming_ingest_s1.webp","img/10_streaming_ingest_s2.webp","img/10_streaming_ingest_s3.webp","img/10_streaming_ingest_s4.webp","img/10_streaming_ingest_s5.webp"],"play":"Data engineering"},{"key":"11_cost_efficiency","name":"Warehouse Cost Efficiency","group":"Platform, cost & governance","fam":"platform","headline":"Compare warehouse billing, suspend behavior and latency before changing settings.","body":"Faster queries do not necessarily mean a lower warehouse bill. This assessment separates metered compute credits, billed cluster-time and query performance. Gen2 eligibility is a performance-pilot signal, not a savings promise.\n\nCompare the current auto-suspend setting with 30, 60, 120, 300 and 600 seconds. The model merges overlapping activity and includes the 60-second minimum per start plus suspension-poll sensitivity. It does not simulate resume delays or cold-cache slowdowns, and it withholds numeric savings for unsupported histories.\n\nThere is no blanket warehouse rollout. A named pilot requires confirmation, records a baseline and the original setting, and supports guarded undo. Equal complete observation windows report cost and matched-query performance separately, including a faster-but-more-expensive outcome.\n\nThe initial run installs the app and bounded diagnostics; scans can incur charges. Rebuild to refresh suspend scenarios. Production scheduling is separately enabled. This revision passed regression, UI and sandbox apply/undo checks; the full installer deployment gauntlet has not been rerun.","dist":"Cost_Efficiency_Setup.sql","path":"solutions/11_cost_efficiency/dist/Cost_Efficiency_Setup.sql","bytes":718682,"schema":"COST_EFFICIENCY","gate":"COSTEFF_APPROVE","prefix":"COSTEFF","steps":{"mode":true,"tier":true,"rate":3.0,"preflight":true,"oneClick":true,"teardown":true},"launchSteps":null,"configuration":"sql_settings","app":"COSTEFF_APP","agent":"","editing":{"profile":"shared_streamlit","one_file_edit_handoff":true,"workspace_preparation_required":false,"source_handoff_live_verified":false,"ui_edit_rollback_verified":true,"snowsight_source_edit_verified":false,"container_verified":false,"sql_edit_verified":false,"full_backend_pipeline_verified":false},"credits":null,"standing":{"declared":true,"oneTime":false,"kind":"TASK","object":"TASK_COST_WATCH","cadence":"daily at 06:00 UTC","dial":"WATCH_SCHEDULE","why":"Track cost changes separately from latency so a speed improvement is not mistaken for a bill reduction. Refresh suspend diagnostics when workload cadence changes; review application latency and freshness before applying a named pilot.","runsPerMonth":30.0,"runsHow":"daily, 30 days/month","scaling":"FIXED","exponent":0.0,"sessionShape":"MATERIALIZED","intervalSec":86400.0,"measured":false},"team":"Platform & IT","log":[{"kind":"ok","text":"Billing scenarios and named apply/undo paths verified in a sandbox"},{"kind":"ok","text":"Regression, source reproducibility and app render checks passed"},{"kind":"run","text":"Full installer deployment gauntlet not rerun for this revision"},{"kind":"ok","text":"Compact installer packaging and ordered-phase regression checks passed"},{"kind":"run","text":"Current revision has targeted execution checks, not a repeated full app-deployment gauntlet"}],"seed":900,"thumb":"img/11_cost_efficiency_thumb.webp","full":"img/11_cost_efficiency_full.webp","frames":["img/11_cost_efficiency_s1.webp","img/11_cost_efficiency_s2.webp","img/11_cost_efficiency_s3.webp","img/11_cost_efficiency_s4.webp","img/11_cost_efficiency_s5.webp","img/11_cost_efficiency_s6.webp","img/11_cost_efficiency_s7.webp"],"play":"Platform, cost & governance","shotsNote":"Illustrative synthetic fixtures, not customer telemetry. Screens show billing scenarios and a faster-but-more-expensive outcome; they are not evidence of customer savings.","gif":"img/11_cost_efficiency_walkthrough.gif"},{"key":"12_data_quality","name":"Data Quality Monitor","group":"Platform, cost & governance","fam":"platform","headline":"Quality expectations on your tables, with a cost model and a circuit breaker.","body":"Attaches data metric functions to tables you name explicitly. Blank means nothing is attached, deliberately.\n\nIt estimates the per-table credit cost from your own measured write rates, and automatically moves high-write tables off change-triggered evaluation onto a schedule, because change-triggered metrics on a hot table is exactly the configuration that produces a surprising bill.\n\nIt also installs a circuit-breaker procedure your pipelines can call to halt on a quality failure, so a bad load stops instead of propagating.\n\nOngoing, the metrics evaluate hourly. That interval is the cost dial: every monitored table is checked on it, so halving the interval doubles the monthly figure.","dist":"Data_Quality_Setup.sql","path":"solutions/12_data_quality/dist/Data_Quality_Setup.sql","bytes":691815,"schema":"DATA_QUALITY","gate":"DQ_APPROVE","prefix":"DQ","steps":{"mode":true,"tier":true,"rate":3.0,"preflight":true,"oneClick":true,"teardown":true},"launchSteps":null,"configuration":"sql_settings","app":"DATA_QUALITY_APP","agent":"","editing":{"profile":"shared_streamlit","one_file_edit_handoff":true,"workspace_preparation_required":false,"source_handoff_live_verified":false,"ui_edit_rollback_verified":true,"snowsight_source_edit_verified":false,"container_verified":false,"sql_edit_verified":false,"full_backend_pipeline_verified":false},"credits":0.038992218999999995,"standing":{"declared":true,"oneTime":false,"kind" :"Conversational Assistant","group":"AI & agents","fam":"ai","headline":"Chat over your data, scored on a holdout, with the accuracy report as the deliverable.","body":"Run the unchanged file to discover candidate sources and build the React answer-quality workbench. The final result returns OPEN_APP_URL. The app shows evaluation results, expected versus observed answers, question history, and discovery/build diagnostics.\n\nQuestions use observed source columns. Generated evaluation queries must match a fixed read-only contract before execution; unrelated generated SQL is refused. Agreement is measured only over scorable answers, and absent results are not presented as zero accuracy.\n\nThis is a bounded single-table evaluation, not a claim of general conversational accuracy. It does not validate multi-table reasoning, tone, helpfulness or changing ground truth. Source access and model availability are reported explicitly.\n\nNo recurring evaluation schedule is enabled by the initial run; production scheduling remains separate.","dist":"Conversational_Assistant_Setup.sql","path":"solutions/15_conversational_assistant/dist/Conversational_Assistant_Setup.sql","bytes":678311,"schema":"CONVERSATIONAL_ASSISTANT","gate":"CONVO_APPROVE","prefix":"CONVO","steps":{"mode":true,"tier":true,"rate":3.0,"preflight":true,"oneClick":true,"teardown":true},"launchSteps":null,"configuration":"sql_settings","app":"CONVERSATIONAL_ASSISTANT_APP","agent":"","editing":{"profile":"shared_streamlit","one_file_edit_handoff":true,"workspace_preparation_required":false,"source_handoff_live_verified":false,"ui_edit_rollback_verified":false,"snowsight_source_edit_verified":false,"container_verified":false,"sql_edit_verified":true,"full_backend_pipeline_verified":false},"credits":0.200434817,"standing":{"declared":true,"oneTime":false,"kind":"TASK","object":"TASK_REMEASURE_ACCURACY","cadence":"weekly, Sunday 08:00 UTC","dial":"REMEASURE_SCHEDULE","why":"Answer quality moves as the data and the mo nThe serving layer built here is a real interactive table associated with an interactive warehouse. Two consequences worth knowing before you plan around it: a clustering key is mandatory, and the refresh warehouse has to be a standard warehouse, because an interactive warehouse only serves queries against interactive tables and cannot run refreshes.\n\nOngoing, the serving layer refreshes on a ten-minute lag. This is the highest-frequency standing workload in the set, so it is also the one whose monthly figure moves most when you change the dial.","dist":"Interactive_Analytics_Setup.sql","path":"solutions/16_interactive_analytics/dist/Interactive_Analytics_Setup.sql","bytes":735459,"schema":"INTERACTIVE_ANALYTICS","gate":"INTERACT_APPROVE","prefix":"INTERACT","steps":{"mode":true,"tier":true,"rate":3.0,"preflight":true,"oneClick":true,"teardown":true},"launchSteps":null,"configuration":"sql_settings","app":"INTERACT_APP","agent":"","editing":{"profile":"shared_streamlit","one_file_edit_handoff":true,"workspace_preparation_required":false,"source_handoff_live_verified":false,"ui_edit_rollback_verified":true,"snowsight_source_edit_verified":false,"container_verified":false,"sql_edit_verified":false,"full_backend_pipeline_verified":false},"credits":0.04374389,"standing":{"declared":true,"oneTime":false,"kind":"INTERACTIVE_TABLE","object":"IT_DASHBOARD_SERVING","cadence":"10 minutes","dial":"TARGET_LAG_MINUTES","why":"An interactive table plus its warehouse is the serving layer that makes dashboards fast, and standing it up is exactly the hard part teams skip.","runsPerMonth":4320.0,"runsHow":"43,200 min/month / 10 min","scaling":"LINEAR","exponent":1.0,"sessionShape":"MATERIALIZED","intervalSec":600.0,"measured":false},"team":"Platform & IT","log":[{"kind":"run","text":"EXECUTE IMMEDIATE  \u00b7  Interactive_Analytics_Setup.sql"},{"kind":"ok","text":"33 statements, none failed"},{"kind":"ok","text":"cost lines view"},{"kind":"ok","text":"build context view"},{"kind":" h is incremental by reading refresh history and reporting the actual refresh mode per table.\n\nThe proof is the substance, not the pipeline. A dynamic table that silently falls back to full refresh costs money every cycle and looks identical from the outside. The pipeline without the proof is a demonstration.\n\nThis is also the one solution here whose ongoing cost was measured directly rather than projected, which makes it the anchor the other estimates are derived from.\n\nUnlike the Snowpark Migration Assessment, which produces a migrate-or-do-not-migrate decision, this one is the production pipeline.","dist":"Transformation_Pipeline_Setup.sql","path":"solutions/18_transformation_pipeline/dist/Transformation_Pipeline_Setup.sql","bytes":729370,"schema":"TRANSFORMATION_PIPELINE","gate":"XFORM_APPROVE","prefix":"XFORM","steps":{"mode":true,"tier":true,"rate":3.0,"preflight":true,"oneClick":true,"teardown":true},"launchSteps":null,"configuration":"sql_settings","app":"TRANSFORMATION_PIPELINE_APP","agent":"","editing":{"profile":"shared_streamlit","one_file_edit_handoff":true,"workspace_preparation_required":false,"source_handoff_live_verified":false,"ui_edit_rollback_verified":true,"snowsight_source_edit_verified":false,"container_verified":false,"sql_edit_verified":false,"full_backend_pipeline_verified":false},"credits":0.6217447620000001,"standing":{"declared":true,"oneTime":false,"kind":"DYNAMIC_TABLE","object":"DT_DAILY_SUMMARY","cadence":"60 minutes","dial":"TARGET_LAG_MINUTES","why":"Incremental declarative refresh is the hard thing: teams write batch rebuilds because keeping a pipeline incremental by hand is difficult.","runsPerMonth":720.0,"runsHow":"43,200 min/month / 60 min","scaling":"LINEAR","exponent":1.0,"sessionShape":"MATERIALIZED","intervalSec":3600.0,"measured":true},"team":"Platform & IT","log":[{"kind":"run","text":"EXECUTE IMMEDIATE  \u00b7  Transformation_Pipeline_Setup.sql"},{"kind":"ok","text":"28 statements, none failed"},{"kind":"ok","text" ":"Apps & collaboration","fam":"apps_collab","headline":"Work out which of your datasets are fit to publish internally, and what it would take.","body":"Assesses which of your datasets could be published as internal data products through organisational listings, scoring table freshness, documentation, row count and access breadth; existing shares and listings; governance readiness including tagging, masking and certification status; and cross-schema consumption patterns showing who reads what, from where.\n\nIt then produces a catalogue of publishing candidates with a readiness score, and the exact DDL to create a share and an organisational listing for each.\n\nOne honest limit: a real organisational listing needs at least two accounts in the same organisation, and this runs in one. It creates no real shares or listings. Each publish path is emitted as ready-to-execute DDL carrying a simulation label, and the dashboard repeats that on every page.\n\nThis is the publisher side, packaging your data for other business units. Marketplace Enrichment is the consumer side, finding third-party data to bring in.\n\nOngoing, a weekly task re-scores readiness, since documentation and freshness change and a one-off score cannot govern a catalogue anybody keeps using.","dist":"Internal_Marketplace_Setup.sql","path":"solutions/20_internal_marketplace/dist/Internal_Marketplace_Setup.sql","bytes":733022,"schema":"INTERNAL_MARKETPLACE","gate":"INTMKT_APPROVE","prefix":"INTMKT","steps":{"mode":true,"tier":true,"rate":3.0,"preflight":true,"oneClick":true,"teardown":true},"launchSteps":null,"configuration":"sql_settings","app":"INTERNAL_MARKETPLACE_APP","agent":"","editing":{"profile":"shared_streamlit","one_file_edit_handoff":true,"workspace_preparation_required":false,"source_handoff_live_verified":false,"ui_edit_rollback_verified":true,"snowsight_source_edit_verified":false,"container_verified":false,"sql_edit_verified":false,"full_backend_pipeline_verified":false},"credits":0.0641
