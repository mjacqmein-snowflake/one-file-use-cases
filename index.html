<style>
/* ═══ ONE IDEA, CARRIED BY EVERY MOVING THING HERE: A STRUCTURE ASSEMBLES
       ITSELF. That is literally what these files do -- one paste and a schema, a
       pipeline, a dashboard and an agent stand up -- so the motion states the
       proposition instead of decorating it. An earlier draft leaned on an ice
       metaphor that readers did not decode, and an undecoded metaphor is noise
       with a mood.

   WHY LIGHT. Picked from the use scene, not from the category: an SE opens this
   at a desk under office light, usually with Snowsight in the next tab, and
   every dashboard screenshot on the page was captured on a white ground. A dark
   shell around 22 light screenshots makes each one a lightbox and the reader's
   pupils pay for it on every promote.

   CONTRAST is checked against the surface each colour actually sits on: body
   text >= 4.5:1, large display and non-text indicators >= 3:1. The ratios in the
   comments are measured, not aspirational. */
:root{
  color-scheme: light;
  --bg:#F2F5F8;          /* the page */
  --panel:#FFFFFF;       /* raised surfaces */
  --panel2:#F7F9FB;      /* hover / inset */
  --code:#F4F7FA;        /* log and SQL ground */
  --line:#DCE3EA;
  --line2:#C3CFDA;
  --tx:#16202B;          /* 16.5:1 on white */
  --dim:#4B5C6D;         /*  6.8:1 on white */
  --dim2:#5C6E82;        /*  4.7:1 on --bg, the small-text floor */
  /* SNOWFLAKE PALETTE, AND THE REASON IT IS THREE TOKENS RATHER THAN ONE.
     The brand blue is #29B5E8 and it measures 2.37:1 on white. That is below the
     4.5:1 body-text floor AND below the 3:1 non-text floor, so it cannot be the
     accent: painting links and borders with it would have been a recolour that
     failed WCAG on every one of them. It is a LARGE-AREA colour, which is what it
     is good at, so it draws the logo mark and nothing that has to be read.
       --ac    #11567F  Snowflake mid-blue. 7.9:1 on white, 7.2:1 on --bg. Links,
                        headings, focus ring. Replaces #1268C0 and is a better
                        contrast than the colour it replaces, not a worse one.
       --sky   #1590C2  the lightest brand-family blue that clears 3:1 (3.3:1 on
                        --bg), so it is the only one allowed to carry meaning as a
                        non-text indicator: rules, slider tracks, chart fills.
       --brand #29B5E8  the mark itself. Decorative, exempt, and confined to it. */
  --ac:#11567F;          /*  7.9:1 on white, 7.2:1 on --bg */
  --sky:#1590C2;         /*  3.3:1 on --bg -- non-text indicators only */
  --brand:#29B5E8;       /*  the logo mark. Never text, never an indicator. */
  --acq:#E8F6FC;         /* quiet accent ground */
  --wnq:#FCF3E4;         /* quiet warn ground, for the feasibility notice */
  --ok:#0E7345;          /*  5.9:1 */
  --warn:#8A5300;        /*  6.3:1 */
  --bad:#B02A20;         /*  6.6:1 */
  --sel:#BFE7F7;
  /* Body is the platform UI face because this is a tool. The display voice is a
     serif with actual character -- the sandbox forbids web fonts, so it is
     sourced from what ships on the machine rather than from a foundry, and that
     constraint is recorded in docs/catalog/README.md rather than hidden. */
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --fd:"Charter","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  /* Monospace is for CODE, DATA and MEASUREMENT only -- the build log, the SQL,
     and figures that are read off a run (the seen counter, the result count, the
     per-step credit figure, the screen counter). It is not a costume for
     "technical": a reviewer correctly caught it on the rail headings, the category
     tag, the figure labels and the tags, which are labels and now set in the UI
     face with the letterspacing doing the work the mono was pretending to do. */
  --m:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  /* FIVE steps, and every adjacent pair at least a 1.25 ratio apart.
     Ratios: 1.33 · 1.25 · 1.25 · 1.28.

     This started as seven steps -- 11/13/15/19/24/30/38 -- and the two smallest
     gaps were 1.18 and 1.15, which a reader does not experience as hierarchy but
     as inconsistency, with 13px and 15px both in heavy use. The fix was not to
     nudge the numbers: it was to delete a step. 13px is gone, and everything that
     used it became either a 12px label or 16px body text, which forced a decision
     on each element about which of the two it actually was. Secondary text is now
     distinguished by colour and weight rather than by a size nobody could see. */
  --t0:12px; --t2:16px; --t3:20px; --t4:25px; --t5:32px;
  /* Elevation is declared ONCE per element: a border or a shadow, never both.
     A 1px border under a wide soft shadow is the ghost card. */
  --lift:0 1px 2px rgba(22,32,43,.06),0 14px 30px -14px rgba(22,32,43,.18);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);
  color:var(--tx);
  font:var(--t2)/1.55 var(--f);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
img,svg{max-width:100%;height:auto;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--ac);text-underline-offset:.18em;text-decoration-thickness:1px}

/* The surfaces nobody draws still carry the design. Left at their defaults these
   belong to no design system, and they are the cheapest tell that a page was
   assembled rather than built. */
::selection{background:var(--sel);color:#0D1922}
input,textarea{caret-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:4px}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;
  border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#A9B8C6}
/* Every figure on this page is a measurement, and measurements that shift
   sideways as a digit changes are harder to compare down a column. */
.num,.fact dd,.step__c,.count,.seen,.views__n,.tag{
  font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip-path:inset(50%);white-space:nowrap;border:0}

/* ── masthead ──────────────────────────────────────────────────────────── */
/* TIGHT ON PURPOSE. Every line the masthead takes is a line of use case pushed
   under the fold, and the reader came for the use cases. Vertical padding is
   roughly halved from clamp(18px,3vw,30px)/16px; nothing here is removed, it is
   just no longer spaced like a cover page. */
.top{
  display:flex;flex-wrap:wrap;gap:6px 20px;align-items:flex-end;
  padding:clamp(10px,1.4vw,15px) clamp(14px,3vw,28px) 9px;
  border-bottom:1px solid var(--line);
  background:var(--panel);
}
.top>div{min-width:0}
/* The mark sits ON the title line rather than above it, because a logo parked in a
   corner reads as a sticker applied to somebody else's page. Baseline-aligned with
   the wordmark it is next to, which is what makes it read as a lockup. */
.top__lock{display:flex;align-items:center;gap:11px}
.mark{flex:0 0 auto}
.top__t{font:600 clamp(21px,2.6vw,var(--t4))/1.08 var(--fd);letter-spacing:-.015em;margin:0}
.top__s{font-size:var(--t0);color:var(--dim);margin:3px 0 0;max-width:78ch}
.top__r{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seen{font:var(--t0)/1 var(--m);color:var(--dim2);letter-spacing:.06em;
      text-transform:uppercase;white-space:nowrap}
.tog{
  border:1px solid var(--line2);border-radius:999px;padding:6px 14px;
  font-size:var(--t2);color:var(--dim);background:var(--panel);
  transition:background .16s,color .16s,border-color .16s;
}
.tog:hover{border-color:var(--ac);color:var(--tx)}
.tog[aria-pressed="true"]{color:var(--panel);background:var(--ac);
  border-color:var(--ac);font-weight:600}
/* The offline-copy link wears the toggle shape because it sits in the same row and
   any other treatment would read as a fourth kind of control. It is an anchor, so
   the two things buttons get for free -- no underline, and a line-height that keeps
   the pill the same height as its neighbours -- are set here. */
.tog--dl{display:inline-flex;align-items:center;line-height:1.1;text-decoration:none}
/* HOME. The stage replaces its own contents when a use case is promoted, so there
   was no browser Back to press and no way to reach the opening questions again --
   the front door was a one-way door. This is not a toggle, so it does not take the
   .tog pressed treatment: it is an action, and it says where it goes rather than
   drawing a house nobody has to guess at. */
.top__home{
  border:1px solid var(--ac);border-radius:999px;padding:6px 14px;
  font-size:var(--t2);font-weight:600;color:var(--ac);background:var(--panel);
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
  transition:background .16s,color .16s;
}
.top__home:hover{background:var(--acq)}
.top__home svg{flex:0 0 auto}

/* ── filter bar ────────────────────────────────────────────────────────── */
.bar{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding:8px clamp(14px,3vw,28px);border-bottom:1px solid var(--line);
  background:var(--panel2);
}
.chip{
  border:1px solid var(--line2);border-radius:999px;padding:5px 12px;
  font-size:var(--t2);color:var(--dim);background:var(--panel);
  transition:background .16s,color .16s,border-color .16s;
}
.chip:hover{border-color:var(--ac);color:var(--tx)}
.chip[aria-pressed="true"]{background:var(--acq);border-color:var(--ac);
  color:var(--ac);font-weight:600}
.team__btn{
  border:1px solid var(--line2);border-radius:999px;padding:5px 12px;
  font-size:var(--t2);color:var(--dim);background:var(--panel);
  transition:background .16s,color .16s,border-color .16s;cursor:pointer;
}
.team__btn:hover{border-color:var(--ac);color:var(--tx)}
.team__btn--on{background:var(--acq);border-color:var(--ac);
  color:var(--ac);font-weight:600}
.team__n{margin-left:5px;font-size:0.85em;opacity:0.7}
.team__clear{
  border:none;background:none;color:var(--ac);font-size:var(--t2);
  cursor:pointer;text-decoration:underline;padding:5px 8px;
}
.q{
  flex:1 1 170px;min-width:0;max-width:min(320px,100%);background:var(--panel);
  border:1px solid var(--line2);border-radius:7px;padding:6px 11px;
  color:var(--tx);font:var(--t2)/1.4 var(--f);
}
.q::placeholder{color:var(--dim2)}
.count{font:var(--t0)/1 var(--m);color:var(--dim2);letter-spacing:.06em}

/* ── the three-column tray-and-stage ──────────────────────────────────── */
.tray{
  display:grid;
  grid-template-columns:minmax(184px,224px) minmax(0,1fr) minmax(184px,224px);
  gap:clamp(12px,2vw,22px);
  align-items:start;
  padding:clamp(16px,2.4vw,24px) clamp(14px,3vw,28px) 56px;
}
.rail{display:flex;flex-direction:column;gap:8px}
.rail__h{
  font:600 var(--t0)/1 var(--f);color:var(--dim2);letter-spacing:.07em;
  text-transform:uppercase;padding:0 2px 4px;
}

/* A roster row, not a card grid: glyph, name, play. The idle motion is a slow
   three-axis float -- vertical, a little side-to-side, and a slight tilt -- so the
   rail reads as a set of separate objects rather than one ruled column.

   ROWS ARE PAIRED SO THEY NUDGE EACH OTHER. Vertical neighbours in a rail are
   dealt i and i+2 (i%2 splits the two rails), so pairing keys on floor(i/2). Each
   pair shares a duration and phase and gets opposite --dir, so one travels down
   while the other travels up and they converge on the same beat. At 52% they reach
   closest approach and both take a small recoil on a fast-out curve, which is what
   reads as contact. They do not actually overlap: the gap is 8px and combined
   travel is 5.2px, closing it to 2.8px. That is deliberate. Amplitude stays near
   the original 2px because the constraint that set it still holds -- motion must
   not move a hit target out from under a finger, and WCAG 2.2.2 sits behind any
   infinite animation. A recoil reads as a bump at an amplitude where a real
   collision would not.

   THE TRADE-OFF, NAMED. Duration and phase are derived from grid POSITION, not
   from the seed, because two rows can only converge if they share a timeline.
   So a row's timing now changes when a filter reorders the rail. Per-row character
   is preserved in the axes that do not need to agree: --ax and --rz are still
   seeded from the key, so each row keeps its own sway and tilt on every build.

   Transform only, never layout. Every stop carries the same function list
   (translate3d, scale, rotate) so the interpolation stays smooth rather than
   falling back to matrix decomposition.

   WHY will-change IS HERE. The float travels about 5px over seven seconds, well
   under a pixel per 100ms. Without a compositor layer the row lands on whole-pixel
   boundaries and the motion reads as slow stepping rather than as drift -- what
   looks like a low framerate is pixel snapping. translate3d already hints at
   promotion; will-change makes it explicit, and keeps the rails moving smoothly
   while the build log is streaming on the main thread. */
.card{
  position:relative;display:grid;grid-template-columns:26px minmax(0,1fr);
  gap:9px;align-items:center;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:8px 22px 8px 9px;
  cursor:grab;
  transition:border-color .18s,background .18s;
  --dir:1; --ax:1.4px; --rz:.3deg;
  animation:drift var(--dur,7s) ease-in-out var(--del,0s) infinite;
  will-change:transform;
}
@keyframes drift{
  0%,100%{transform:translate3d(calc(var(--ax) * -1),calc(var(--dir) * -2.6px),0)
                    scale(1) rotate(calc(var(--dir) * var(--rz) * -1))}
  14%{transform:translate3d(calc(var(--ax) * .55),calc(var(--dir) * -1.3px),0)
               scale(1) rotate(calc(var(--dir) * var(--rz) * -.45))}
  31%{transform:translate3d(var(--ax),calc(var(--dir) * .5px),0)
               scale(1) rotate(calc(var(--dir) * var(--rz) * .3))}
  /* Closing on the partner: ease IN so the approach gathers a little pace. */
  45%{transform:translate3d(calc(var(--ax) * .4),calc(var(--dir) * 2.2px),0)
               scale(1) rotate(calc(var(--dir) * var(--rz)));
      animation-timing-function:cubic-bezier(.34,.05,.6,.2)}
  /* Contact. The scale dip is 3 thousandths -- felt, not seen. */
  52%{transform:translate3d(0,calc(var(--dir) * 2.6px),0)
               scale(.997) rotate(calc(var(--dir) * var(--rz) * .82));
      animation-timing-function:cubic-bezier(.16,1,.3,1)}
  /* Recoil, on a fast-out curve. This is the stop that sells the bump. */
  60%{transform:translate3d(calc(var(--ax) * -.3),calc(var(--dir) * 1.5px),0)
               scale(1) rotate(calc(var(--dir) * var(--rz) * .2))}
  74%{transform:translate3d(calc(var(--ax) * -.85),calc(var(--dir) * .1px),0)
               scale(1) rotate(calc(var(--dir) * var(--rz) * -.3))}
  88%{transform:translate3d(calc(var(--ax) * -1),calc(var(--dir) * -1.8px),0)
               scale(1) rotate(calc(var(--dir) * var(--rz) * -.8))}
}
.card:hover{background:var(--panel2);border-color:var(--line2)}
/* Under the pointer the row holds still. A card that keeps drifting while you are
   reaching for it reads as evasive, and the drift has done its job by then. */
.card:hover,.card:focus-visible{animation-play-state:paused}
.card:active{cursor:grabbing}
/* Mid-drag the ghost under the pointer is the subject, so the row in the rail
   steps back rather than competing with it. */
.card.dragging{animation:none;transform:none;opacity:.42;cursor:grabbing}

/* THE GRIP. Drag works here and nothing announced it. The rows already drift and
   tilt, which reads as "loose object" -- this names the gesture that implies, with
   the six-dot glyph every desktop user reads as a handle. Drawn with zero-blur
   box-shadow dots rather than an image so it stays crisp at 6x14 at any ratio, and
   visible AT REST at 42%: an affordance that appears only on hover cannot be found
   by anyone who has not already guessed it is there. Not a hit target -- the whole
   row is, and click remains the primary path per WCAG 2.5.7. */
.card__grip{
  position:absolute;right:9px;top:50%;width:2px;height:2px;border-radius:50%;
  background:var(--dim2);opacity:.42;
  transform:translateY(-6px);
  box-shadow:0 5px var(--dim2),0 10px var(--dim2),
             4px 0 var(--dim2),4px 5px var(--dim2),4px 10px var(--dim2);
  transition:opacity .18s;pointer-events:none;
}
.card:hover .card__grip{opacity:.85}
.card[aria-current="true"] .card__grip{opacity:0}

/* The hint, once, over the first rail. Click is named FIRST because it is the
   reliable path and the single-pointer alternative; drag is the enhancement. */
.rail__hint{
  display:flex;align-items:flex-start;gap:7px;
  font-size:var(--t0);line-height:1.35;color:var(--dim2);
  padding:0 2px 8px;
}
.rail__hint b{color:var(--dim);font-weight:600}
/* The same glyph at the same size as the grip on the rows, so the sentence and the
   thing it describes read as one instruction. Aligned to the first line rather than
   the block: the hint wraps in a 224px rail, and a centred glyph then floats
   between two lines pointing at nothing. */
.rail__hint i{
  flex:0 0 auto;width:6px;height:12px;position:relative;top:2px;
  background:
    radial-gradient(circle 1px at 1px 1px,  var(--dim2) 99%,transparent 0),
    radial-gradient(circle 1px at 1px 6px,  var(--dim2) 99%,transparent 0),
    radial-gradient(circle 1px at 1px 11px, var(--dim2) 99%,transparent 0),
    radial-gradient(circle 1px at 5px 1px,  var(--dim2) 99%,transparent 0),
    radial-gradient(circle 1px at 5px 6px,  var(--dim2) 99%,transparent 0),
    radial-gradient(circle 1px at 5px 11px, var(--dim2) 99%,transparent 0);
}
/* The promoted row. No coloured edge stripe: an accent ground plus an accent
   border says "this one" without a 3px rule masquerading as a component. */
.card[aria-current="true"]{
  border-color:var(--ac);background:var(--acq);animation:none;transform:none;
}
.card[aria-current="true"] .card__n{color:var(--ac)}
.card__g{width:26px;height:26px}
/* Both lines clamp, so eleven rows fit one screen without a scroller and every
   row is the same height -- a rail of 2-, 3- and 1-line rows reads as a ragged
   list rather than a set of equivalent choices. */
.card__n{font-size:var(--t2);font-weight:600;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card__p{font-size:var(--t0);color:var(--dim2);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card__d{
  position:absolute;top:10px;right:9px;width:6px;height:6px;border-radius:50%;
  background:var(--ok);
}
/* The invite: three bounded pulses on the first row, then it stops for good.
   Long enough to teach that a row is the thing you press, short enough that
   WCAG 2.2.2 never applies -- there is nothing to pause because it is over. */
/* The invite pulses the border and ground the row ALREADY has, rather than adding
   a spreading box-shadow ring. The ring was a second elevation system on an element
   that declares a border, and it read as a halo rather than as "press this". */
.card--invite{animation:drift var(--dur,7s) ease-in-out var(--del,0s) infinite,
                        invite 1s ease-out 3}
@keyframes invite{
  0%,100%{border-color:var(--line);background:var(--panel)}
  45%{border-color:var(--ac);background:var(--acq)}
}
.rail.over .card{opacity:.55}

/* ── the stage ─────────────────────────────────────────────────────────── */
.stage{
  min-width:0;background:var(--panel);border-radius:16px;box-shadow:var(--lift);
  padding:clamp(18px,2.4vw,28px);
  min-height:660px;
}
.stage.drop{outline:2px solid var(--ac);outline-offset:-2px}
.empty{padding:clamp(14px,2.4vw,24px) 8px clamp(24px,5vw,44px);text-align:center}
.empty__h{font:600 var(--t4)/1.16 var(--fd);margin:0 0 9px;letter-spacing:-.014em}
.empty__p{color:var(--dim);font-size:var(--t2);margin:0 auto 13px;max-width:66ch}
/* The situation router. Left-aligned sentences, because they ARE sentences and
   centring them would make them read as slogans. */
.sit{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));
  gap:9px;margin:0 0 11px;
}
.sit__q{
  /* text-align is set HERE, not inherited from .sit: a button carries
     text-align:center from the UA stylesheet, which beats inheritance, so the
     sentences were centring themselves and reading as slogans. */
  display:block;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--line2);
  border-radius:12px;padding:11px 13px;
  transition:border-color .16s,background .16s;
}
.sit__q:hover{border-color:var(--ac);background:var(--acq)}
.sit__q[aria-pressed="true"]{border-color:var(--ac);background:var(--acq)}
.sit__t{display:block;font-size:var(--t2);font-weight:600;line-height:1.32}
.sit__q[aria-pressed="true"] .sit__t{color:var(--ac)}
.sit__n{display:block;font-size:var(--t0);color:var(--dim2);margin-top:3px}
.sit__x{font-size:var(--t2);color:var(--ac);margin:0 0 22px;text-decoration:underline;
  text-underline-offset:.18em}
/* The reveal for the situations past the fold. Deliberately quieter than .go and
   than a situation button: it is a way to see more of the same list, not a step
   forward, and styling it as a primary action would compete with the captures
   directly beneath it for the one click this screen is trying to earn. */
.sit__more{
  border:1px solid var(--line2);border-radius:999px;background:var(--panel);
  color:var(--dim);font-size:var(--t2);padding:6px 15px;margin:0 0 13px;
  cursor:pointer;transition:border-color .16s,color .16s;
}
.sit__more:hover{border-color:var(--ac);color:var(--ac)}
/* The wall of real captures. Each tile is a button that promotes its own use case,
   so the opening image is the product rather than a picture of it. */
/* Three across, so six tiles fill two even rows. At minmax(210px) the wall packed
   four into the first row and left two orphans beside a hole, which reads as a
   layout that ran out rather than as a set.
   NO auto-fit MINIMUM WIDTH, BECAUSE THE STAGE WIDTH IS NOT PREDICTABLE. auto-fit
   resolves against the stage column, not the viewport, and the stage is whatever is
   left between the two rails -- so minmax(272px) gave two columns at 1440 and
   minmax(250px) still gave two at 1280. Two columns means wider tiles, wider means
   taller, and the first row of captures fell below the fold on the smaller screen:
   0 of 6 visible at 1280x713.
   repeat(3,1fr) is deterministic instead. Six tiles are always two even rows, the
   wall is always as short as it can be, and the tiles shrink rather than the row
   count growing. Below 900px the rails collapse and 3 across would be too small to
   read, so that case drops to 2 -- matching the breakpoint the tray already uses. */
.wall{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:12px;margin:0 0 26px;text-align:left;
}
@media (max-width:900px){ .wall{grid-template-columns:repeat(2,1fr)} }
@media (max-width:640px){ .wall{grid-template-columns:1fr} }
.wall__t{
  display:block;width:100%;background:var(--panel2);border:1px solid var(--line);
  border-radius:12px;overflow:hidden;transition:border-color .18s,transform .18s;
}
.wall__t:hover{border-color:var(--ac);transform:translateY(-2px)}
.wall__t img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top}
.wall__c{
  display:flex;gap:7px;align-items:center;padding:8px 10px;
  border-top:1px solid var(--line);background:var(--panel);
  font-size:var(--t0);font-weight:600;line-height:1.3;
}
.wall__g{flex:0 0 auto;width:16px;height:16px}
.go{
  background:var(--ac);color:var(--panel);
  border-radius:9px;padding:10px 20px;font-size:var(--t2);font-weight:600;
  transition:filter .16s;
}
.go:hover{filter:brightness(1.1)}

/* The stage head: glyph plate, name, and the group as a companion tag on the
   same line. NOT a kicker above the heading -- a label stacked over a title is
   a habit, and the title carries its own weight. */
.hd{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px;
    display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 14px}
.hd__g{width:clamp(40px,5vw,52px);height:clamp(40px,5vw,52px);grid-row:1/3}
.hd__r{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.hd__n{font:600 clamp(20px,2.6vw,var(--t4))/1.12 var(--fd);letter-spacing:-.018em;
       margin:0}
/* The next use case, in the title row. margin-left:auto is what puts it at the far
   end; align-self keeps it off the title's baseline, which a two-line control
   should not sit on. Deliberately quiet -- it is a way onward, not the subject. */
.nextc{
  margin-left:auto;align-self:center;display:flex;align-items:center;gap:9px;
  background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  padding:5px 10px;cursor:pointer;text-align:left;max-width:min(46ch,42vw);
  transition:border-color .16s;
}
.nextc:hover{border-color:var(--ac)}
.nextc__g{width:22px;height:22px;flex:0 0 auto}
.nextc__x{min-width:0}
.nextc__k{font:600 var(--t0)/1 var(--f);color:var(--ac);letter-spacing:.02em}
.nextc__n{font-size:var(--t0);font-weight:600;color:var(--tx);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nextc__c{font:var(--t0)/1 var(--m);color:var(--dim2);white-space:nowrap;flex:0 0 auto}
.hd__c{font:600 var(--t0)/1 var(--f);color:var(--ac);background:var(--acq);
  border-radius:999px;padding:5px 10px;letter-spacing:.05em;white-space:nowrap}
.hd__p{color:var(--dim);font-size:var(--t0);margin:4px 0 0;max-width:78ch;
  grid-column:2}
/* The action row: the file is the deliverable, so the link to it is a primary
   control at the top rather than a footnote at the bottom. */
.hd__a{grid-column:2;display:flex;flex-wrap:wrap;gap:7px 12px;align-items:center;
  margin:8px 0 0}
.go--link{display:inline-block;text-decoration:none;font-size:var(--t2);
  padding:8px 16px}
.hd__c2{
  font:var(--t0)/1 var(--m);color:var(--dim);background:var(--code);
  border:1px solid var(--line);border-radius:7px;padding:7px 9px;
  overflow-wrap:anywhere;
}

/* The script snippet. Capped height on the <pre> so the settings block reads as
   a preview and never becomes the page -- the copy control is what carries the
   whole file, so the block on screen only has to show its shape. */
.sql{grid-column:2;margin:16px 0 0;border:1px solid var(--line);border-radius:9px;
  background:var(--code);overflow:hidden}
.sql__bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;
  justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--line)}
.sql__name{font:var(--t0)/1 var(--m);color:var(--dim);overflow-wrap:anywhere}
.sql__copy{
  font:600 var(--t2)/1 var(--f);color:var(--tx);
  background:var(--panel);border:1px solid var(--line2);border-radius:7px;
  padding:8px 14px;cursor:pointer;white-space:nowrap;
}
.sql__copy:hover:not(:disabled){border-color:var(--ac);color:var(--ac)}
.sql__copy:disabled{color:var(--dim);border-color:var(--line);cursor:default}
.sql__pre{
  margin:0;padding:11px 12px;max-height:232px;overflow:auto;
  font:var(--t0)/1.5 var(--m);color:var(--tx);
}
.sql__foot{
  padding:9px 12px;border-top:1px solid var(--line);
  font:var(--t0)/1.45 var(--f);color:var(--dim);
}

/* The next use case, as the last thing on the stage. The whole surface exists so
   that somebody reads all twenty-two, and before this the only route off a use case
   was the back button. */
.next{
  display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:14px;
  align-items:center;width:100%;text-align:left;
  background:var(--acq);border:1px solid var(--ac);border-radius:12px;
  padding:14px 16px;transition:filter .16s;
}
.next:hover{filter:brightness(.98)}
.next__g{width:34px;height:34px}
.next__k{font-size:var(--t0);font-weight:600;color:var(--ac);letter-spacing:.03em}
.next__n{font-size:var(--t3);font-weight:600;line-height:1.2;margin-top:2px;
  letter-spacing:-.012em}
.next__p{font-size:var(--t2);color:var(--dim);margin-top:3px;max-width:66ch}
.next__c{font:var(--t0)/1 var(--m);color:var(--dim2);white-space:nowrap}

.act+.act{margin-top:30px}
/* More space above a heading than below it. */
.act__h{margin:0 0 12px}
.act__t{font-size:var(--t3);font-weight:600;margin:0;letter-spacing:-.012em}
.act__s{font-size:var(--t2);color:var(--dim2);margin:2px 0 0}

/* Act 1. The log streams a line at a time. That IS the authored motion moment on
   this page: the file's own recorded output arriving in order, at a speed where each
   line is legible as it lands.

   THERE USED TO BE A COLUMN OF BARS BESIDE IT -- one bar per log line, stacking
   upward, on the argument that it made the motion a picture of the real process. Two
   independent reviewers killed it in the same round: a design reviewer called the
   74px column "cryptic -- same-width bars with unlabelled colour encoding duplicate
   what the log already says", and a senior SE said the pills "answer builder
   questions, not user questions" and should be cut entirely. Both are right. Every
   channel the bars carried -- how many lines, and what kind each was -- was already
   in the log, in words, with a coloured sigil. It was a second encoding of one fact,
   which is decoration wearing the costume of a chart. The log now runs full width. */
.log{
  background:var(--code);border:1px solid var(--line);border-radius:10px;
  padding:12px 13px;font:var(--t2)/1.7 var(--m);
}
.log__l{display:flex;gap:8px;color:var(--dim)}
/* Long identifiers have no spaces to break at, so without this they push the panel
   wider than the screen. `overflow:hidden` used to hide that, which also hid it from
   the harness -- the clipping concealed its own symptom. */
.log__l>span:last-child{min-width:0;overflow-wrap:anywhere}
.log__i{color:var(--dim2);flex:0 0 auto}
.log__l--run{color:var(--tx)}
.log__l--run .log__i{color:var(--ac)}
.log__l--ok .log__i{color:var(--ok)}
.log__l--cost{color:var(--warn)}
.log__l--cost .log__i{color:var(--warn)}
.log__l--done{color:var(--ok);font-weight:600}

/* ── the payoff row ───────────────────────────────────────────────────────
   The dashboard gets the FULL width of the stage, and the figures sit in a short
   band underneath it.

   THIS WAS WRONG TWICE. First the capture ran at its natural height, about 900px,
   and pushed the figures and the ship ladder a screen and a half down; capping the
   image fixed that by shrinking the one thing a reader came for. Then the figures
   moved into a column beside it -- which put them on screen, and took 350px of
   WIDTH off the dashboard. Width was the binding constraint all along: a 16:10
   capture in a 575px column renders 440px tall and never reaches an 880px ceiling,
   so the cap was doing nothing while the column did the damage.

   So: full width, natural height, and the figures compressed into a five-across
   band that costs about 90px instead of a column that costs 350. The ladder is now
   one short scroll under the image rather than a screen and a half. */
.pay{display:grid;gap:clamp(14px,1.8vw,20px)}
.mat{
  position:relative;border:1px solid var(--line);border-radius:12px;
  overflow:hidden;background:var(--panel2);
}
/* `contain`, so the whole dashboard is visible and never crops. The ceiling is a
   viewport share rather than a pixel count, so a tall monitor spends its height on
   the image instead of leaving it stranded. */
.mat img{width:100%;max-height:min(84vh,980px);object-fit:contain;object-position:top}
/* PREV AND NEXT, ON THE IMAGE. This used to be three text buttons in the row
   BELOW the capture -- Previous screen, Next screen, and a third that started and
   stopped the walkthrough. Three controls for one sequence, none of them near the
   thing they moved, and the third one existed only to stop motion the reader had
   started. They are plates on the left and right edge of the capture now, where a
   reader already looks for them, and clicking either one is ALSO what stops the
   autoplay. That is what let the third button go: "let me look at this one" and
   "stop moving" are the same gesture, so asking for them separately asked twice.
   Full-strength plate, no opacity fade -- a control that has to be hovered before
   it is visible is a control most readers never find, and fading it would also
   dilute the chevron's contrast against whichever dashboard is behind it. */
.mat__nav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:40px;height:56px;padding:0;display:grid;place-items:center;
  border:1px solid var(--line2);border-radius:10px;
  background:var(--panel);color:var(--ac);cursor:pointer;
  box-shadow:0 2px 9px rgba(22,32,43,.17);
  transition:background-color .16s ease,border-color .16s ease;
}
.mat__nav:hover{background:var(--acq);border-color:var(--sky)}
.mat__nav--p{left:10px}
.mat__nav--n{right:10px}
.mat__nav svg{width:17px;height:17px;fill:none;stroke:currentColor;
  stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.mat__none{padding:34px 16px;text-align:center;color:var(--dim2);font-size:var(--t2)}
.views{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:11px}
.views__n{font:var(--t0)/1 var(--m);color:var(--dim2);letter-spacing:.05em}
/* Pushed to the end of the row, and given back the affordance it lost: this used to
   be an <a>, which came with a colour and an underline for free, and a <button> does
   not. See openLightbox for why it had to stop being an anchor. */
.views__f{font-size:var(--t2);margin-left:auto;padding:0;
  color:var(--ac);text-decoration:underline;text-underline-offset:.18em;
  text-decoration-thickness:1px}
.views__f:hover{text-decoration-thickness:2px}

/* ── full size, in an overlay ───────────────────────────────────────────────
   Fills the viewport and scrolls the image inside itself, because a 1440px capture
   on a 1200px screen must be pannable rather than shrunk -- shrinking it is what the
   stage already does and is the thing the reader pressed the button to escape. */
.lb{
  position:fixed;inset:0;z-index:60;
  display:flex;flex-direction:column;
  background:rgba(11,20,28,.93);
}
.lb[hidden]{display:none}
body.lbon{overflow:hidden}
/* Same reason as `lbon`: the intro is a fixed full-viewport layer, so scrolling
   behind it moves a page the reader cannot see and lands them somewhere they did
   not choose when the card clears. */
body.introon{overflow:hidden}
.lb__bar{
  display:flex;gap:16px;align-items:center;flex:0 0 auto;
  padding:12px clamp(14px,3vw,24px);
  border-bottom:1px solid rgba(255,255,255,.16);
}
/* On the dark overlay these are measured against #0B141C, not against --bg. */
.lb__cap{font-size:var(--t2);color:#DCE7F0;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb__x{
  margin-left:auto;flex:0 0 auto;
  border:1px solid rgba(255,255,255,.42);border-radius:999px;padding:6px 16px;
  font-size:var(--t2);font-weight:600;color:#FFFFFF;background:transparent;
  transition:background .16s;
}
.lb__x:hover{background:rgba(255,255,255,.14)}
.lb__x:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.lb__scroll{flex:1 1 auto;overflow:auto;padding:clamp(10px,2vw,22px);
  display:flex;align-items:flex-start;justify-content:center}
/* max-width:none defeats the global `img{max-width:100%}`, which would otherwise
   fit the image to the overlay and undo the entire point of this view. */
.lb__scroll img{max-width:none;width:auto;height:auto;
  border-radius:6px;background:var(--panel)}
@media (max-width:900px){
  /* Below the capture width there is no full size to show, so the image fits and
     the overlay becomes a distraction-free read rather than a broken pan. */
  .lb__scroll img{max-width:100%}
}

/* ── the run-rate panel ─────────────────────────────────────────────────────
   Two inputs above one figure above its own derivation. The derivation is not
   collapsed behind a disclosure: an SE who cannot see how the number was built will
   not repeat it to a customer, so the arithmetic is the panel rather than a footnote
   under it. */
.rr__ins{display:grid;gap:16px 26px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  margin-bottom:20px}
.rr__ih{display:flex;gap:12px;align-items:baseline;margin-bottom:7px}
.rr__lab{font-size:var(--t2);color:var(--dim)}
.rr__val{margin-left:auto;font:600 var(--t3)/1 var(--m);color:var(--tx);
  font-variant-numeric:tabular-nums}
/* The track is styled on both engines because an unstyled range input is the
   cheapest tell that a control was dropped in rather than designed. --sky is the one
   brand blue that clears 3:1, which a slider thumb has to. */
.rr__r{-webkit-appearance:none;appearance:none;width:100%;height:22px;
  background:transparent;display:block;margin:0}
.rr__r::-webkit-slider-runnable-track{height:6px;border-radius:3px;
  background:var(--line2)}
.rr__r::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:20px;height:20px;border-radius:50%;margin-top:-7px;
  background:var(--sky);border:2px solid var(--panel);
  box-shadow:0 1px 3px rgba(22,32,43,.32)}
.rr__r::-moz-range-track{height:6px;border-radius:3px;background:var(--line2)}
.rr__r::-moz-range-thumb{width:18px;height:18px;border-radius:50%;
  background:var(--sky);border:2px solid var(--panel);
  box-shadow:0 1px 3px rgba(22,32,43,.32)}
.rr__r:focus-visible{outline:2px solid var(--ac);outline-offset:3px;border-radius:4px}

.rr__big{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.rr__n{font:600 var(--t5)/1.05 var(--fd);letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;color:var(--tx)}
.rr__u{font-size:var(--t2);color:var(--dim)}
.rr__usd{font-size:var(--t2);color:var(--dim);margin:6px 0 0}
.rr__none{font-size:var(--t2);color:var(--dim);margin:0;max-width:78ch}
/* The feasibility notice. It sits ABOVE the headline figure because it changes what
   that figure means, and it is a full tinted panel rather than a left-rule callout
   for the same reason the assumptions block is: a single-sided border is the
   accent-tab tell the design detector flags. */
.rr__warn{font-size:var(--t2);color:var(--tx);margin:0 0 18px;max-width:82ch;
  background:var(--wnq);border:1px solid #DCBE8C;border-radius:8px;padding:12px 15px}
.rr__warn strong{color:var(--warn);display:block;margin-bottom:3px}
/* A two-column definition list, so the term and its arithmetic read across rather
   than the reader having to hold a label in mind down a stack. */
.rr__d{display:grid;grid-template-columns:minmax(9rem,auto) 1fr;gap:9px 20px;
  margin:20px 0 0;padding-top:16px;border-top:1px solid var(--line)}
.rr__d dt{font-size:var(--t0);color:var(--dim2);letter-spacing:.05em;
  text-transform:uppercase;padding-top:3px}
.rr__d dd{margin:0;font-size:var(--t2);color:var(--tx)}
/* A tinted ground rather than a left rule. A single-sided border is the accent-tab
   tell the design detector flags, and the assumptions block does not need a bar to
   be found -- it needs to not read as body copy. */
.rr__as{font-size:var(--t2);color:var(--dim);margin:18px 0 0;max-width:82ch;
  background:var(--acq);border:1px solid var(--line);border-radius:8px;
  padding:12px 15px}
@media (max-width:640px){
  .rr__d{grid-template-columns:1fr;gap:2px 0}
  .rr__d dd{margin-bottom:11px}
}

.btn{
  border:1px solid var(--line2);background:var(--panel);border-radius:8px;
  padding:7px 14px;font-size:var(--t2);color:var(--tx);
  transition:border-color .16s,background .16s;
}
.btn:hover{border-color:var(--ac);background:var(--panel2)}
.btn:disabled{opacity:.45;cursor:default}
.btn--go{border-color:var(--ac);background:var(--ac);color:var(--panel);font-weight:600}
.btn--go:hover{filter:brightness(1.1);background:var(--ac)}

/* The measured figures, five across in one band. The dividers are a 1px GAP over
   a line-coloured ground rather than per-cell borders: that stays exact when the
   band wraps to a second row, which per-cell borders do not. It reads as one
   instrument panel, not as a row of cards standing in for structure. */
.facts{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:1px;
  margin:0;background:var(--line);
  border:1px solid var(--line);border-radius:12px;overflow:hidden;
}
.fact{padding:11px 14px;background:var(--panel)}
.fact dt{font:600 var(--t0)/1 var(--f);color:var(--dim2);letter-spacing:.06em;
  text-transform:uppercase}
.fact dd{margin:5px 0 0;font-size:var(--t2);font-weight:600}
.fact dd em{display:block;font:var(--t0)/1.45 var(--f);font-style:normal;
            font-weight:400;color:var(--dim2);margin-top:3px}
.fact dd .ok{color:var(--ok)}.fact dd .warn{color:var(--warn)}.fact dd .bad{color:var(--bad)}

/* ── the ladder ────────────────────────────────────────────────────────── */
.ladder{display:grid;gap:9px}
.step{border:1px solid var(--line);border-radius:12px;background:var(--panel);
  overflow:hidden}
.step__b{
  display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;
  padding:13px 15px;transition:background .16s;
}
.step__b:hover{background:var(--panel2)}
.step__n{
  flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);
  font:var(--t0)/21px var(--m);text-align:center;color:var(--dim);
}
.step__x{min-width:0;flex:1 1 auto}
.step__t{font-size:var(--t2);font-weight:600}
.step__d{font-size:var(--t2);color:var(--dim);margin-top:2px;max-width:72ch}
.step__c{font:var(--t0)/1 var(--m);color:var(--dim2);flex:0 0 auto}
.step[data-open="true"]{border-color:var(--ac)}
.step[data-open="true"] .step__n{border-color:var(--ac);color:var(--ac);
  background:var(--acq)}
.step__body{display:none;border-top:1px solid var(--line);padding:13px 15px;
  background:var(--panel2)}
.step[data-open="true"] .step__body{display:block}
.sql{
  background:var(--code);border:1px solid var(--line);border-radius:8px;
  padding:11px 12px;margin:0;font:var(--t2)/1.7 var(--m);color:var(--dim);
  overflow-x:auto;white-space:pre;
}
.sql b{color:var(--ac);font-weight:600}
.sql i{color:var(--dim2);font-style:normal}
.step__note{font-size:var(--t2);color:var(--dim);margin:10px 0 0;max-width:74ch}
.step--off{opacity:.62}
.step--off .step__b{cursor:default}

.editing__facts{margin:0;display:grid;gap:14px}
.editing__facts dt{font-size:var(--t2);font-weight:600;line-height:1.4}
.editing__facts dd{margin:4px 0 0;color:var(--dim);font-size:var(--t2);line-height:1.55;max-width:74ch}
.editing__prompt{margin:16px 0;padding:0;font-size:var(--t2);line-height:1.6;overflow-wrap:anywhere;max-width:74ch}
.editing__details{border-top:1px solid var(--line);padding-top:12px;margin-top:16px}
.editing__details summary{cursor:pointer;font-size:var(--t2);font-weight:600;line-height:1.4}
.editing__details p{font-size:var(--t2);line-height:1.55;color:var(--dim);max-width:74ch;margin:10px 0 0}

/* ── the list ──────────────────────────────────────────────────────────── */
.list{display:none;padding:clamp(16px,2.4vw,24px) clamp(14px,3vw,28px) 60px}
.list.open{display:block}
.gname{
  font:600 var(--t3)/1.2 var(--fd);color:var(--tx);letter-spacing:-.01em;
  margin:30px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);
}
.gname:first-child{margin-top:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:14px}
.lcard{
  display:block;width:100%;text-align:left;background:var(--panel);
  border-radius:14px;box-shadow:var(--lift);overflow:hidden;
  transition:transform .18s,box-shadow .18s;
}
.lcard:hover{transform:translateY(-2px);
  box-shadow:0 2px 4px rgba(22,32,43,.07),0 20px 38px -16px rgba(22,32,43,.24)}
/* Elevation is the shadow, and only the shadow. The screenshot panel used to carry
   a border-bottom underneath that shadow, which is the ghost card: two elevation
   systems on one element, each undermining the other. The image's own edge against
   the caption ground separates them. */
.lcard__s{aspect-ratio:16/10;background:var(--panel2);overflow:hidden}
.lcard__s img{width:100%;height:100%;object-fit:cover}
.lcard__b{padding:11px 13px 13px;display:grid;grid-template-columns:24px minmax(0,1fr);
  gap:4px 10px}
.lcard__g{width:24px;height:24px;grid-row:1/3}
.lcard__n{font-size:var(--t2);font-weight:600;line-height:1.35}
.lcard__p{font-size:var(--t0);color:var(--dim2)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;grid-column:1/3}
.tag{
  font:var(--t0)/1 var(--f);border:1px solid var(--line2);border-radius:5px;
  padding:4px 7px;color:var(--dim);
}
.tag.ok{color:var(--ok);border-color:#9BCFB4}
.tag.warn{color:var(--warn);border-color:#DCBE8C}
.tag.bad{color:var(--bad);border-color:#DFA9A4}
.empty2{color:var(--dim2);font-size:var(--t2)}

/* ── the take-away code ───────────────────────────────────────────────── */
/* PERMANENT, IN BOTH VIEWS, AND THAT IS THE WHOLE FEATURE. This surface gets
   driven live on a projector, and the moment a room decides it wants the link is
   not a moment the presenter can spend leaving the catalog to go and find a slide
   that carries it. So the address is on screen for the entire session, in the one
   corner neither view puts anything in, and it does not scroll away.

   PLAIN CARD, ON PURPOSE. No accent stripe down one edge, no coloured glow, no
   pulse. Every one of those would make the eye come back to it repeatedly during
   a walkthrough, which is the opposite of what a thing you glance at once and
   scan is for -- and the code itself has to be read by a phone camera across a
   room, so nothing may compete with it or tint the white it needs. */
.qr{
  position:fixed;right:16px;bottom:16px;z-index:40;
  display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:11px 11px 9px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  box-shadow:var(--lift);
}
/* THE WHITE FIELD AROUND THE SYMBOL IS NOT PADDING, IT IS THE QUIET ZONE. A QR
   without two clear modules on every side does not resolve, because a reader
   finds the symbol by its edge. It comes from the PNG's own border, and the
   card's white ground continues it -- which is also why this card cannot be
   tinted, inset or given a surface of its own.

   123px against a 246px PNG is an exact 2x, so the modules stay on whole device
   pixels on a retina panel instead of landing half on each. */
.qr__img{width:123px;height:123px}
.qr__cap{
  font:var(--t0)/1.2 var(--m);color:var(--dim);
  letter-spacing:.04em;text-transform:uppercase;
}
/* THE CORNER HAS TO BE EMPTIED, AND BOTTOM PADDING DOES NOT EMPTY IT. First attempt
   reserved 184px at the bottom of both scroll containers, which is the obvious move
   and is wrong: the right-hand rail is seventeen cards long and therefore taller
   than the viewport at every scroll position, so a fixed corner lands on a rail card
   the whole way down and only the very last one is cleared. Rendering it caught
   three BUTTON.card under the card at scroll 0.

   So the reservation is a GUTTER rather than a footer -- a strip down the right that
   no content is laid into. It costs the stage about 10% of its width at 1600px, and
   that is the actual price of a permanently visible code on a page that is otherwise
   dense to both edges. The alternative was pointer-events:none, which would stop the
   card intercepting clicks while still hiding a control underneath it, and a control
   you cannot see is not fixed by being clickable. */
@media (min-width:1100px){
  .tray,.list{padding-right:calc(clamp(14px,3vw,28px) + 163px)}
}
/* BELOW THAT, IT IS REMOVED RATHER THAN SHRUNK. The gutter is 163px, which is a
   tenth of a projector and a third of a phone, and a code on a screen somebody else
   is holding is not one anybody scans. Narrow gets the page back instead. */
/* A 1024x768 projector is exactly the case that needs the code on screen, and
   viewport width cannot tell a projector from a phone. So keep it down to 900px,
   shrunk and unlabelled, and only give the page back below that. */
@media (max-width:1099px) and (min-width:900px){
  /* Two things measured the hard way. Keep 123px: the source PNG is 246px, so a
     non-integer downscale blurs the module edges and 96px would not scan. And do
     NOT reduce the card padding -- it is the quiet zone, and at 7px the code
     stopped decoding even though it looked fine. Only the caption comes off. */
  .qr{right:10px;bottom:10px}
  .qr__cap{display:none}
}
@media (max-width:899px){ .qr{display:none} }

/* ── the handoff card ─────────────────────────────────────────────────────────
   THE CODE AND THIS CARD ARE THE SAME CONTROL SEEN FROM TWO DISTANCES, so they
   share one edge and swap at it: 899px hides the code, 899px shows this. Both
   queries are written at that number rather than one at 900 and one at 899,
   because a 1024x768 projector lays out at exactly 900 and the failure at that
   width is not cosmetic -- it would show a room a scannable code beside a card
   telling the viewer to go and find a laptop.

   WHAT IT IS FOR. A phone that got here by scanning is holding the one device
   the code cannot help it leave. So the address is printed as selectable text,
   which is the floor that needs no API and no permission, and the button on top
   of it is an offer rather than the only route.

   The tone is carried by the border on all four sides and by a tinted inner
   surface for the address, not by a stripe down one edge. */
.hand{display:none}
@media (max-width:899px){
  .hand{
    display:block;margin:0 clamp(14px,3vw,28px) 14px;
    background:var(--panel);border:1px solid var(--line2);border-radius:12px;
    padding:14px 15px 15px;
  }
  .hand__t{margin:0 0 10px;font:var(--t2)/1.45 var(--f);color:var(--tx)}
  /* user-select:all so one tap takes the whole address rather than one word of
     it. word-break, because a phone is narrower than this URL. */
  .hand__u{
    display:block;margin:0 0 12px;padding:9px 10px;
    background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    font:12px/1.45 var(--m);color:var(--dim);word-break:break-all;
    -webkit-user-select:all;user-select:all;
  }
  .hand__r{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
  .hand__b{
    min-height:44px;display:inline-flex;align-items:center;justify-content:center;
    padding:0 16px;border-radius:999px;font-size:var(--t2);font-weight:600;
    border:1px solid var(--ac);background:var(--ac);color:var(--panel);
    cursor:pointer;
  }
  .hand__b--alt{background:var(--panel);color:var(--ac)}
  .hand__a{
    min-height:44px;display:inline-flex;align-items:center;
    font-size:var(--t2);color:var(--ac);
  }
  /* 12px, not 10: this line is the only confirmation that the button did
     anything, so it is functional text and takes the copy floor. */
  .hand__s{margin:10px 0 0;font:12px/1.45 var(--f);color:var(--dim2)}
  .hand__s:empty{display:none}
}
/* Printing is not what this is for, but it must not make a mess of it. Fixed
   elements repeat on every sheet in several engines; this one becomes an ordinary
   block at the end of the document instead. */
@media print{
  .qr{position:static;display:flex;margin:18px auto 0;box-shadow:none;break-inside:avoid}
  .tray,.list{padding-right:clamp(14px,3vw,28px)}
}

/* ── narrow ───────────────────────────────────────────────────────────── */
@media (max-width:900px){
  .tray{grid-template-columns:1fr;gap:14px}
  /* Each rail becomes a horizontal strip, and the two of them stack above the
     stage. They cost about 140px together rather than the two full-height vertical
     columns that would have pushed the stage off the bottom of the screen. */
  .rail{
    flex-direction:row;overflow-x:auto;gap:9px;padding-bottom:4px;
    scroll-snap-type:x proximity;
    /* Without this, overscrolling the strip chains outward and iOS reads it as the
       edge-swipe back gesture -- so reaching the end of the rail navigates away
       from the page. */
    overscroll-behavior-x:contain;
  }
  /* BOTH RAILS, NOT ONE. paintRails() deals items alternately between rail-a and
     rail-b, so hiding rail-b here -- which is what this block used to do -- made
     every odd-indexed use case unreachable from the strip. Half the catalog. The
     fix is ordering, not JS: the tray is a single column at this width, and DOM
     order is rail-a, stage, rail-b, so `order` puts the second strip directly
     under the first and pushes the stage below both. Re-dealing the cards in JS
     would have destroyed and re-appended nodes, dropping the promoted card's
     identity and its dragstart/dragend bindings, and would have fired on any
     mid-demo display-scaling change on the projector. */
  .rail--a{order:1}
  .rail--b{order:2}
  /* order:3 puts the stage below both strips. min-height:auto because the 660px
     floor reserved a screenful of dead space under the strip on an 844px phone. */
  .stage{order:3;min-height:auto}
  .rail__h{display:none}
  /* Neither the grip nor the hint survives here. There is no drag on a touch rail
     -- the horizontal swipe is already spoken for by the scroller -- so an
     affordance for it would advertise a gesture that does not exist. */
  .rail__hint{display:none}
  .card__grip{display:none}
  /* -webkit-user-drag and touch-action are here because draggable=true is set on
     every card unconditionally in JS. Neither dragstart nor dragend can fire from
     touch, so the attribute buys nothing at this width -- but an Android Chrome
     long-press can still start a native drag, and that drag swallows the tap that
     is the only way to promote a card. */
  .card{flex:0 0 194px;animation:none;transform:none;will-change:auto;
        cursor:pointer;scroll-snap-align:start;
        -webkit-user-drag:none;touch-action:manipulation}
  /* The invite pulse advertises "drag me onto the stage". Touch has no drag path,
     so at this width the animation promises a gesture that does not exist. */
  .card--invite{animation:none}

  /* ── tap targets ──────────────────────────────────────────────────────
     Every control on this page except the rail cards was under 44px tall at
     touch -- the worst, .team__clear, was about 24px. These raise the box
     without touching the type size or the horizontal padding, so nothing
     reflows on the projector path. inline-flex rather than a taller padding
     because several of these are pill buttons whose radius is 999px and would
     otherwise stop reading as pills. */
  .chip,.tog,.top__home,.team__btn,.team__clear,.intro__x,.lb__x{
    min-height:44px;display:inline-flex;align-items:center;justify-content:center;
  }
  /* An input already centres its own text, so it only needs the height. 16px is
     retained upstream and must stay -- anything smaller triggers iOS focus zoom. */
  .q{min-height:44px}
  /* THE NAV PLATES COME OFF THE CAPTURE. At 40px wide they were both under the
     44px floor and, sitting at left:10px and right:10px, together covered about
     22% of a 362px-wide phone capture -- obscuring the dashboard the reader came
     to look at. .mat has overflow:hidden, so they cannot move outside it; instead
     the container grows a band underneath the image and they sit in that. */
  .mat{padding-bottom:52px}
  .mat__nav{width:44px;height:44px;top:auto;bottom:4px;transform:none}
  .mat img{max-height:none}
}
/* ── the intro ────────────────────────────────────────────────────────────────
   A 3.4-SECOND TITLE CARD, AND IT EARNS THE TIME BY SAYING SOMETHING. A splash
   screen that only shows a logo is a tax on every open. This one carries the three
   numbers an SE actually wants before they start reading -- how many use cases,
   whether they are audited, what standing all of them up cost -- so the intro is
   the fastest path to those facts rather than an obstacle in front of them. All
   three are read from the payload at runtime, so the card cannot drift from the
   catalog the way a hand-typed "20+ use cases" would.

   THE TIMING BUDGET, SO THE NEXT CHANGE IS NOT A GUESS. The last thing to finish
   animating in is the third statement line, at 1.58s delay + 0.45s duration =
   2.03s; the counters finish earlier, at 1.3s. The fade then starts at 2.9s and
   takes 0.5s, so the card holds fully-formed for ~0.87s before it begins to leave
   and is gone at 3.4s. Shortening further means cutting into that hold, and below
   roughly 0.5s of hold the three numbers stop being readable -- which would make
   the card decoration, which is the one thing it must not be.

   THE MOTION IS THE PROPOSITION, WHICH IS THE SAME RULE THE REST OF THIS FILE
   FOLLOWS. The mark is six arms around a centre; they fly in from their own
   directions and the centre lands last. That is a structure assembling itself,
   which is literally what these files do. It is not a spin, a bounce or a shine.

   WCAG 2.2.2 IS SATISFIED BY CONSTRUCTION, NOT BY A CONTROL. The exemption is for
   motion under five seconds that does not loop; this runs 3.4s once and removes
   itself from the DOM. The Skip button is there for impatience, not for compliance,
   and `prefers-reduced-motion` skips the whole thing via the block below.

   THE GROUND IS --bg, NOT WHITE AND NOT A GRADIENT. Fading from the page's own
   background to the page means the card dissolves into the catalog instead of
   lifting off it like a curtain, and there is no flash between the two. */
.intro{
  position:fixed; inset:0; z-index:120; background:var(--bg);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:0; padding:24px; text-align:center;
  animation:introOut .5s ease-in 2.9s both;
}
.intro[hidden]{display:none}
.intro__mark{display:block; margin:0 0 18px; overflow:visible}
/* Each arm from its own direction. Six declarations rather than one shared keyframe
   because "assembles" means the pieces converge -- a single fade-and-scale on the
   whole mark would be the logo appearing, which is the thing being avoided. */
.intro__mark>g>path{animation:armIn .42s cubic-bezier(.2,.8,.25,1) both}
.intro__mark>g>path:nth-child(1){--dx: 13px; --dy: 13px; animation-delay:.00s}
.intro__mark>g>path:nth-child(2){--dx:-16px; --dy:  0px; animation-delay:.08s}
.intro__mark>g>path:nth-child(3){--dx: -9px; --dy:-13px; animation-delay:.16s}
.intro__mark>g>path:nth-child(5){--dx:  9px; --dy:-13px; animation-delay:.24s}
.intro__mark>g>path:nth-child(6){--dx:-13px; --dy: 13px; animation-delay:.32s}
.intro__mark>g>path:nth-child(7){--dx: 16px; --dy:  0px; animation-delay:.40s}
/* The centre is path 4 in source order and it lands last, after the arms have
   arrived -- the keystone, not one more petal. */
.intro__mark>g>path:nth-child(4){animation:coreIn .34s cubic-bezier(.2,.9,.2,1) .52s both}
.intro__t{
  margin:0; font-size:clamp(26px,5.2vw,44px); font-weight:650; letter-spacing:-.02em;
  color:var(--tx); animation:riseIn .5s ease-out .82s both;
}
.intro__s{
  /* var(--t2), NOT clamp(13px,...): 13px is deleted from this scale on purpose
     (see the token block), and a clamp floor smuggles it back in at narrow
     viewports -- which is exactly what re-tripped flat-type-hierarchy after the
     intro screen was added. This is body copy, so it is the body step. */
  margin:10px 0 0; max-width:34em; font-size:var(--t2); line-height:1.5;
  color:var(--dim); animation:riseIn .5s ease-out 1.02s both;
}
.intro__st{
  list-style:none; margin:26px 0 0; padding:0;
  display:flex; flex-wrap:wrap; gap:14px 34px; justify-content:center;
}
.intro__st li{animation:riseIn .45s ease-out both}
.intro__st li:nth-child(1){animation-delay:1.30s}
.intro__st li:nth-child(2){animation-delay:1.44s}
.intro__st li:nth-child(3){animation-delay:1.58s}
.intro__n{
  display:block; font-variant-numeric:tabular-nums; font-size:clamp(22px,3.4vw,32px);
  font-weight:650; letter-spacing:-.01em; color:var(--ac); line-height:1.1;
}
/* 12px, not 10. The floor for functional text on this page is 11px and these are
   the labels that say what the numbers above them are. */
.intro__k{display:block; margin-top:5px; font-size:12px; color:var(--dim2)}
.intro__x{
  position:absolute; right:18px; bottom:18px;
  font:inherit; font-size:var(--t0); color:var(--dim); background:var(--panel);
  border:1px solid var(--line2); border-radius:8px; padding:7px 13px; cursor:pointer;
  animation:riseIn .4s ease-out 1.7s both;
}
.intro__x:hover{color:var(--tx); border-color:var(--dim2)}
@keyframes armIn{
  from{opacity:0; transform:translate(var(--dx),var(--dy))}
  to{opacity:1; transform:translate(0,0)}
}
@keyframes coreIn{from{opacity:0; transform:scale(.4)}to{opacity:1; transform:scale(1)}}
@keyframes riseIn{from{opacity:0; transform:translateY(9px)}to{opacity:1; transform:translateY(0)}}
@keyframes introOut{from{opacity:1}to{opacity:0; visibility:hidden}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
body.nomotion *{animation:none!important;transition:none!important}
</style>
</head>
<body>

<!-- The intro. Empty on purpose: the mark is CLONED from the masthead lockup below
     rather than pasted twice, because that path data is 6KB and a second copy is
     6KB in both outputs plus a second place for the logo to go stale. `hidden`
     until the script decides the intro should run at all, so a reader with
     JavaScript off sees the catalog and not a blank card. -->
<div class="intro" id="intro" hidden role="group" aria-label="One-File Use Cases">
  <div id="intro-mark"></div>
  <p class="intro__t" id="intro-t">One-File Use Cases</p>
  <p class="intro__s" id="intro-s"></p>
  <ul class="intro__st" id="intro-stats"></ul>
  <button class="intro__x" type="button" id="intro-skip">Skip intro</button>
</div>

<header class="top">

<script>
const DATA = {"repo":{},"program":"One-File Use Cases","subtitle":"One SQL file per use case. Pick a database and warehouse, run the file unchanged, then open the app link returned in the final result.","offline":false,"audience":"client","footnotes":{"buildBasis":"Build cost is the measured credits of standing a solution up over its bundled sample data, one run, on an X-Small warehouse. It is not what running it against your data will cost.","costBasis":"Ongoing figures are projections, not quotes. One solution in this set had its standing cost measured directly; the rest are derived from that measurement, scaled by each solution's declared refresh cadence and by how its work grows with data volume. The range shown is deliberately wide \u2014 the projection halved to tripled \u2014 because a transferred measurement does not deserve a precise-looking number. Your own figures will differ with warehouse size, data volume, and how you set each file's dials.","gate":"Run the complete installer with its shipped defaults. Supported initial builds discover sources and create the existing application, then return OPEN_APP_URL. Production schedules, review overrides and always-on warehouse warming remain separately controlled. Account privileges and platform prerequisites still apply."},"headings":{"ask":"Which of these sounds like you?","pick":"Pick the sentence closest to your situation."},"editing":{"title":"Edit with CoCo in Snowsight","intro":"Keep the one-file install. Describe the change you want in Snowsight CoCo, then review the proposed code before applying it.","preparation":"The rebuilt installers include readable source and create an editable workspace when privileges permit. Open EDIT_SOURCE_URL in the final result; SOURCE_STATUS reports whether that handoff succeeded. No separate source upload or listing is required.","workflow":"Open the source link, ask CoCo for a change, review the diff, build a versioned release and approve deployment. Keep the prior release for rollback. Do not rerun the full installer for a small edit.","deployment":"CoCo source editing and cloud builds have been tested. Publishing and restarting were performed separately during verification; automatic end-to-end deployment by CoCo alone is not yet verified.","scope":"Editing tests used sample or fixture data. They do not establish that every backend pipeline, permission, dependency, or change will work in your account.","uiVerified":"This interface passed a deployed baseline, edited-release, and rollback check with fixture data.","sourceVerified":"This use case also has a real Snowsight CoCo source-editing proof.","containerVerified":"Its customer-owned container source path ran against bounded sample data.","sqlVerified":"Its SQL reporting edit was executed against sample data.","unverified":"No matching live editing result is recorded for this use case.","profiles":{"shared_streamlit":{"quick":"Change titles, section labels and order, or add a chart, table, or metric backed by an approved view. Navigation changes apply where the app has a sidebar.","deeper":"The source workspace contains Python, frontend code and build tools. CoCo can change layout, styling and interactions; source changes need a successful build and approved deployment.","prompt":"Inspect this installed app and its editable workspace. Add a metric from an approved view, preserve its existing warnings and controls, and show me the diff and rollback before deployment."},"shared_container":{"quick":"Change the Streamlit presentation and view-backed panels, or adjust authorized customer and segment rules through their SQL interface.","deeper":"Python and frontend changes use the prepared Streamlit source. Container-code changes use a customer-owned source deployment, not direct edits to a protected installed Native App. New dependencies can require an image rebuild.","prompt":"Identify whether I am editing the Streamlit dashboard or the container app. Inspect its prepared SQL or source, make the requested change without rebuilding data, and show me the diff and rollback before deployment."},"bespoke_streamlit":{"quick":"CoCo can edit the approved SQL and reporting views. This dashboard has its own frontend and does not use the shared title-and-panel configuration.","deeper":"With its Python and frontend source prepared in your workspace, CoCo can change the dashboard and rebuild it without replacing the data pipeline.","prompt":"Inspect this dashboard's prepared Python and frontend source. Make the requested interface change, preserve its scope and data warnings, and build a candidate release with a rollback."},"container":{"quick":"Edit creative and offer copy through customer-owned SQL. Copy reads through on the next page load; changing targeting rules also requires refreshing the selected decisions.","deeper":"A prepared customer-owned source deployment allows Python, page markup, and API-route changes without rebuilding the dependency image. A protected Native App is not directly editable; new dependencies may require a new image.","prompt":"Inspect the content views and prepared customer-owned source for this app. Change the requested copy or behavior, keep consent decisions intact, and show me a candidate release and rollback without reinstalling the app."},"sql_only":{"quick":"This use case creates SQL objects rather than a Streamlit app. CoCo can edit its queries, reporting views, and authorized procedures.","deeper":"Changes to prompts, models, or answer-generation logic need a new holdout evaluation before you rely on the revised answers.","prompt":"Inspect this solution's SQL and log schema. Add a reporting metric in a separate view using approved data. Show me the SQL before running it; do not rerun setup or model evaluation."}}},"items":[{"key":"00_observability","name":"Snowflake-Native Data Observability","group":"Platform, cost & governance","fam":"platform","headline":"Freshness and volume monitoring on your own tables, inside Snowflake.","body":"Attaches freshness and row-count metrics to your tables and evaluates them on a schedule you set, so staleness and volume anomalies surface without anyone watching for them. Discovery reads a 14-day window by default and prints what it would monitor before anything is created.\n\nYou can name the tables explicitly or let it select the top tables by importance across the account. Worth knowing: blank and '*' both take the automatic path, so name your tables if you want the scope held to a set you chose. It can also create alerts, a bundled dashboard over the results, and delivery through a notification integration you already have.\n\nThe evaluation interval is the cost dial. Every monitored table is checked on that interval, so halving it doubles the monthly figure. Below the production tier the schedule is set, reported live, then suspended again before the run ends, so an exploratory build cannot walk away leaving a recurring serverless charge on your tables.","dist":"Observability_Setup.sql","path":"solutions/00_observability/dist/Observability_Setup.sql","bytes":1462375,"schema":"OBSERVABILITY_MONITOR","gate":"MONITOR_APPROVE","prefix":"MONITOR","steps":{"mode":true,"tier":true,"rate":null,"preflight":true,"oneClick":true,"teardown":true},"launchSteps":null,"configuration":"sql_settings","app":"OBSERVABILITY_MONITOR","agent":"","editing":{"profile":"bespoke_streamlit","one_file_edit_handoff":true,"workspace_preparation_required":false,"source_handoff_live_verified":false,"ui_edit_rollback_verified":true,"snowsight_source_edit_verified":false,"container_verified":false,"sql_edit_verified":false,"full_backend_pipeline_verified":false},"credits":null,"standing":{"declared":true,"oneTime":false,"kind":"DMF","object":"","cadence":"every 60 minutes","dial":"DMF_SCHEDULE","why":"Nobody attaches freshness and volume metrics to their own tables by hand and then keeps watching them, which is why this kind of monitoring is usually a separate system.","runsPerMonth":720.0,"runsHow":"43,200 min/month / 60 min","scaling":"FIXED","exponent":0.0,"sessionShape":"MATERIALIZED","intervalSec":3600.0,"measured":false},"team":"Platform & IT","log":[{"kind":"run","text":"EXECUTE IMMEDIATE  \u00b7  Observability_Setup.sql"},{"kind":"ok","text":"views created"},{"kind":"ok","text":"coverage view answers"},{"kind":"ok","text":"streamlit deployed"},{"kind":"ok","text":"teardown proc exists"},{"kind":"ok","text":"dmf registry exists"},{"kind":"ok","text":"run rate registered"},{"kind":"ok","text":"run rate is positive"},{"kind":"ok","text":"dashboard deployed  \u00b7  OBSERVABILITY_MONITOR"},{"kind":"done","text":"OBSERVABILITY_MONITOR is standing"},{"kind":"ok","text":"Compact installer packaging and ordered-phase regression checks passed"},{"kind":"run","text":"Current revision has targeted execution checks, not a repeated full app-deployment gauntlet"}],"seed":634,"thumb":"img/00_observability_thumb.webp","full":"img/00_observability_full.webp","frames":["img/00_observability_s1.webp","img/00_observability_s2.webp","img/00_observability_s3.webp","img/00_observability_s4.webp","img/00_observability_s5.webp","img/00_observability_s6.webp","img/00_observability_s7.webp","img/00_observability_s8.webp","img/00_observability_s9.webp","img/00_observability_s10.webp","img/00_observability_s11.webp","img/00_observability_s12.webp"],"play":"Platform, cost & governance"},{"key":"01_customer_360","name":"Customer 360 on Snowflake","group":"Analytics & BI","fam":"analytics","headline":"Build a single customer profile, with segments and a semantic view over it.","body":"Run the SQL unchanged with a database and warehouse selected. Bounded AI-assisted discovery identifies observed customer, order, event and subscription sources, validates their required columns, and creates the Customer 360 app. The final result returns OPEN_APP_URL and an editable-source link. No application package, listing or source upload is required.\n\nThe app combines customer profiles, segments, exact server-side audience counts, saved audiences, customer browsing and overlap analysis. Missing or incompatible sources leave the actual app available with discovery questions, rather than fabricated metrics. Metadata validation is not proof of data quality; review the model's questions and the profile coverage before relying on results.\n\nThe initial profile refresh is suspended after construction. Recurring refreshes and production actions remain separately authorized.","dist":"Customer_360_Setup.sql","path":"solutions/01_customer_360/dist/Customer_360_Setup.sql","bytes":843820,"schema":"CUSTOMER_360","gate":"C360_APPROVE","prefix":"C360","steps":{"mode":true,"tier":true,"rate":3.0,"preflight":true,"oneClick":true,"teardown":true},"launchSteps":null,"configuration":"sql_settings","app":"CUSTOMER_360_APP","agent":"","editing":{"profile":"shared_streamlit","one_file_edit_handoff":true,"workspace_preparation_required":false,"source_handoff_live_verified":false,"ui_edit_rollback_verified":true,"snowsight_source_edit_verified":true,"container_verified":true,"sql_edit_verified":false,"full_backend_pipeline_verified":false},"credits":0.38498711799999996,"standing":{"declared":true,"oneTime":false,"kind":"DYNAMIC_TABLE","object":"DT_CUSTOMER_PROFILE","cadence":"60 minutes","dial":"TARGET_LAG_MINUTES","why":"A profile and its segments must move as orders and events land, and recomputing a 360 by hand on a schedule is what nobody sustains.","runsPerMonth":720.0,"runsHow":"43,200 min/month / 60 min","scaling":"LINEAR","exponent":1.0,"sessionShape":"MATERIALIZED","intervalSec":3600.0,"measured":false},"team":"Marketing & Loyalty","log":[{"kind":"run","text":"EXECUTE IMMEDIATE  \u00b7  Customer_360_Setup.sql"},{"kind":"ok","text":"46 statements, none failed"},{"kind":"ok","text":"freshness view"},{"kind":"ok","text":"build context"},{"kind":"ok","text":"identity map rows  \u00b7  801"},{"kind":"ok","text":"profiles built  \u00b7  801"},{"kind":"ok","text":"segments seeded  \u00b7  4"},{"kind":"ok","text":"segment membership  \u00b7  355"},{"kind":"ok","text":"coverage view  \u00b7  6"},{"kind":"ok","text":"dashboard deployed  \u00b7  CUSTOMER_360_APP"},{"kind":"cost","text":"0.3850 credits, measured"},{"kind":"done","text":"CUSTOMER_360 is standing"},{"kind":"ok","text":"Compact installer packaging and ordered-phase regression checks passed"},{"kind":"run","text":"Current revision has targeted execution checks, not a repeated full app-deployment gauntlet"}],"seed":356,"thumb":"img/01_customer_360_thumb.webp","full":"img/01_customer_360_full.webp","frames":["img/01_customer_360_s1.webp","img/01_customer_360_s2.webp","img/01_customer_360_s3.webp","img/01_customer_360_s4.webp","img/01_customer_360_s5.webp","img/01_customer_360_s6.webp","img/01_customer_360_s7.webp","img/01_customer_360_s8.webp","img/01_customer_360_s9.webp","img/01_customer_360_s10.webp"],"play":"Analytics & BI"},{"key":"02_identity_resolution","name":"Identity Resolution on Snowflake","group":"Analytics & BI","fam":"analytics","headline":"Resolve identities across source systems, and measure the result against the IDs you already have.","body":"Resolves customer identities across source systems using both deterministic and probabilistic matching, then measures how far it agrees with whatever resolved identity you use today.\n\nThe measurement is the point. A match graph nobody can grade is a science project; a match graph scored against the IDs your business already runs on is a decision you can make.\n\nThis reads your business data, since identities cannot be resolved from metadata alone, and says so in the plan output before anything is created.\n\nOne thing to know before you plan the cost: matching work grows faster than linearly with row count, so the projection moves sharply with volume. It is the one solution here whose ongoing figure is genuinely sensitive to how much data you point it at.\n\nOngoing, a task re-derives the clusters every two hours, because an identity graph starts decaying the moment new records arrive.","dist":"Identity_Resolution_Setup.sql","path":"solutions/02_identity_resolution/dist/Identity_Resolution_Setup.sql","bytes":753299,"schema":"IDENTITY_RESOLUTION","gate":"IDR_APPROVE","prefix":"IDR","steps":{"mode":true,"tier":true,"rate":3.0,"preflight":true,"oneClick":true,"teardown":true},"launchSteps":null,"configuration":"sql_settings","app":"IDENTITY_RESOLUTION_APP","agent":"","editing":{"profile":"shared_streamlit","one_file_edit_handoff":true,"workspace_preparation_required":false,"source_handoff_live_verified":false,"ui_edit_rollback_verified":true,"snowsight_source_edit_verified":false,"container_verified":false,"sql_edit_verified":false,"full_backend_pipeline_verified":false},"credits":0.11273344099999999,"standing":{"declared":true,"oneTime":false,"kind":"TASK","object":"TASK_IDENTITY_RESOLVE","cadence":"120 minutes","dial":"RESOLVE_INTERVAL_MINUTES","why":"An identity graph decays the moment new records arrive: until something re-derives the clusters, every record added since the last run has no resolved ID and is invisible to the golden record. Re-resolving on a schedule is the part teams usually buy a separate product for.","runsPerMonth":360.0,"runsHow":"43,200 min/month / 120 min","scaling":"QUADRATIC","exponent":1.98,"sessionShape":"MATERIALIZED","intervalSec":7200.0,"measured":false},"team":"Marketing & Loyalty","log":[{"kind":"run","text":"EXECUTE IMMEDIATE  \u00b7  Identity_Resolution_Setup.sql"},{"kind":"ok","text":"40 statements, none failed"},{"kind":"ok","text":"disagreements view"},{"kind":"ok","text":"build context"},{"kind":"ok","text":"normalized records  \u00b7  500"},{"kind":"ok","text":"match pairs exist  \u00b7  2330"},{"kind":"ok","text":"clusters populated  \u00b7  500"},{"kind":"ok","text":"golden record  \u00b7  196"},{"kind":"ok","text":"bakeoff view  \u00b7  7"},{"kind":"ok","text":"dashboard deployed  \u00b7  IDENTITY_RESOLUTION_APP"}
