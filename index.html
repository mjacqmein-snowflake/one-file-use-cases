    if (picked.length < 6 && i.thumb && picked.indexOf(i) < 0) picked.push(i);
  });
  picked.slice(0, 6).forEach(it => {
    const b = el('button', 'wall__t');
    b.type = 'button';
    b.setAttribute('aria-label', it.name);
    const im = el('img');
    im.src = it.thumb;
    im.alt = '';
    b.appendChild(im);
    const cap = el('span', 'wall__c');
    const gl = glyph(it, 16);
    gl.classList.add('wall__g');
    cap.appendChild(gl);
    cap.appendChild(el('span', null, it.name));
    b.appendChild(cap);
    b.addEventListener('click', () => promote(it));
    wall.appendChild(b);
  });
  if (wall.childNodes.length) w.appendChild(wall);

  const go = el('button', 'go', 'Start with the first one');
  go.type = 'button';
  go.addEventListener('click', () => {
    const got = shown();
    const next = got.find(i => !seen.has(i.key)) || got[0];
    if (next) promote(next);
  });
  w.appendChild(go);
  s.appendChild(w);
}

// ── The script, in the page ────────────────────────────────────────────────
// A snippet and a copy control, NOT the whole file on screen. The head of every
// dist script IS its settings block -- the gate first, then the dials -- so the
// first 16 lines are the most useful 16 lines, and a reader can see the shape of
// what they are about to take without scrolling past 19MB of it.
//
// ALL 27 SCRIPTS ARE ONE LZMA STREAM, sliced by byte offset. See the build for
// why: gzip is the only codec DecompressionStream offers, its window is 32KB,
// and the scripts repeat each other at 750KB distances, so gzip gets 19.3MB to
// 6.6MB while one LZMA stream gets it to 2.11MB. That 4.5MB is the difference
// between clearing a 10MB mail gateway and not.
/* no script stream in this build */

// Decoded once, then held. Kicked off on idle rather than on click: the decode
// measures 466ms for the whole stream, which is unnoticeable in the background
// and would be a visible stall if it happened under the cursor.
let sqlAll = null, sqlJob = null;
function decodeAll() {
  if (sqlAll) return Promise.resolve(sqlAll);
  if (sqlJob) return sqlJob;
  sqlJob = new Promise((resolve, reject) => {
    try {
      const b64 = DATA.sqlStream || '';
      if (!b64) { resolve(null); return; }
      const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
      let ip = 0;
      // Preallocate from the index rather than pushing onto an array: the
      // decoder emits a byte at a time, and a 19-million-element JS array
      // costs an order of magnitude more memory than the buffer it describes.
      let need = 0;
      for (const k in (DATA.sqlIndex || {})) {
        const e = DATA.sqlIndex[k]; need = Math.max(need, e[0] + e[1]);
      }
      const out = new Uint8Array(need);
      let op = 0;
      LZMA.decompressFile(
        { readByte: () => (ip < bin.length ? bin[ip++] : -1) },
        { writeByte: b => { out[op++] = b; } });
      sqlAll = out;
      resolve(out);
    } catch (e) { reject(e); }
  });
  return sqlJob;
}
if (DATA.sqlStream) {
  const warm = () => { decodeAll().catch(() => {}); };
  if (typeof requestIdleCallback === 'function') requestIdleCallback(warm, { timeout: 4000 });
  else setTimeout(warm, 1200);
}

async function sqlText(key) {
  const e = (DATA.sqlIndex || {})[key];
  if (!e) return null;
  const all = await decodeAll();
  if (!all) return null;
  // Slice bytes, then decode: the cut points are file boundaries, so no
  // multi-byte character is ever split.
  const carried = new TextDecoder('utf-8').decode(all.subarray(e[0], e[0] + e[1]));
  if (DATA.sqlTransport !== 'expanded-zlib-v1') return carried;
  function restoreInstaller(parts) {
    if (typeof parts === 'string') return parts;
    return parts.map(part => {
      if (typeof part === 'string') return part;
      const compressed = pako.deflate(new TextEncoder().encode(restoreInstaller(part.zlib)), {level: 9});
      let binary = '';
      for (let offset = 0; offset < compressed.length; offset += 16384) {
        binary += String.fromCharCode(...compressed.subarray(offset, offset + 16384));
      }
      return btoa(binary);
    }).join('');
  }
  const restored = restoreInstaller(JSON.parse(carried));
  const expected = DATA.sqlDownloads?.[key]?.sha256;
  if (expected && globalThis.crypto?.subtle) {
    const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(restored));
    const actual = Array.from(new Uint8Array(digest), value => value.toString(16).padStart(2, '0')).join('');
    if (actual !== expected) throw new Error('Installer checksum mismatch');
  }
  return restored;
}

/* NAME COLLISION, AND WHY THIS IS NOT CALLED sqlBlock. There is already a
   `sqlBlock(lines)` further down that renders an array of SQL lines with keyword
   highlighting for the ship ladder. This is a different thing: the script
   PREVIEW panel -- a filename bar, a copy control and the head of the file.
   Both were briefly called sqlBlock, and because a later function declaration
   silently replaces an earlier one, the ladder's array version won and this
   function's only call site handed an item OBJECT to something that does
   `lines.forEach`. That threw inside promote(), so every promoted use case
   rendered a BLANK STAGE in both index.html and offline.html while the card
   still highlighted and the seen-counter still incremented -- a failure that
   looked like a layout bug and was a shadowed function. */
function scriptPreview(it) {
  const head = (DATA.sqlHead || {})[it.key];
  if (!head) return null;
  const carried = !!(DATA.sqlIndex || {})[it.key] && !!DATA.sqlStream;
  const download = (DATA.sqlDownloads || {})[it.key];

  const wrap = el('div', 'sql');
  const bar = el('div', 'sql__bar');
  bar.appendChild(el('span', 'sql__name', it.dist));
  const btn = el('button', 'sql__copy', carried ? 'Copy whole script' : download ? 'Download SQL' : 'Unavailable');
  btn.type = 'button';
  bar.appendChild(btn);

  const pre = el('pre', 'sql__pre');
  pre.appendChild(el('code', null, head));

  // Declared before the handler that rewrites it, so the failure path can
  // replace this text rather than referencing something not yet assigned.
  const foot = el('div', 'sql__foot',
    'Run unchanged. The opening contains prerequisites and optional configuration. '
    + (carried
        ? 'Copy takes the whole file, all ' + kb(it.bytes) + ' of it.'
        : 'Download takes the current installer, all ' + kb(it.bytes) + ' of it.'));

  wrap.appendChild(bar);
  wrap.appendChild(pre);
  wrap.appendChild(foot);

  // The hosted build carries no payload -- it sits beside the repository and
  // already offers a link to the file -- so the control is inert there rather
  // than advertising a copy that cannot happen.
  if (!carried) {
    btn.disabled = !download;
    if (download) btn.addEventListener('click', () => {
      const link = el('a'); link.href = download.url; link.download = it.dist;
      document.body.appendChild(link); link.click(); link.remove();
    });
    return wrap;
  }

  const footWas = foot.textContent;
  btn.addEventListener('click', async () => {
    const was = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Copying\u2026';
    let text = null;
    try {
      text = await sqlText(it.key);
      if (!text) throw new Error('no text');
      await navigator.clipboard.writeText(text);
      btn.textContent = 'Copied ' + kb(it.bytes);
      setTimeout(() => { btn.textContent = was; btn.disabled = false; }, 2600);
    } catch (e) {
      // THE LIKELY FAILURE IS NOT THE DECODE, IT IS THE CLIPBOARD. This page is
      // meant to be opened out of a zip, so it runs on file:// where
      // navigator.clipboard is frequently refused. Apologising there would leave
      // the reader with no way to get the script at all, so when the text
      // decoded, put ALL of it on screen and select it: a manual Cmd/Ctrl-C then
      // works, which is the entire point of the control.
      if (text) {
        pre.textContent = text;
        pre.style.maxHeight = '420px';
        pre.setAttribute('tabindex', '-1');
        const r = document.createRange();
        r.selectNodeContents(pre);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(r);
        pre.focus();
        btn.textContent = 'Selected \u2014 press \u2318/Ctrl-C';
        foot.textContent = 'The clipboard is blocked here, which is normal for a page '
          + 'opened from disk. The whole script is selected above \u2014 copy it with '
          + 'the keyboard.';
      } else {
        btn.textContent = 'Could not unpack';
        foot.textContent = 'The script could not be unpacked in this browser. '
          + 'Opening this page in a current Chrome, Safari or Firefox will fix it.';
      }
      setTimeout(() => {
        btn.textContent = was; btn.disabled = false; foot.textContent = footWas;
      }, 9000);
    }
  });
  return wrap;
}

function promote(it, opts) {
  const o = opts || {};
  clearActs();
  activeKey = it.key;
  seen.add(it.key);
  paintSeen();
  if (location.hash !== '#' + it.key) history.replaceState(null, '', '#' + it.key);
  document.querySelectorAll('.card').forEach(c => {
    c.setAttribute('aria-current', c.dataset.key === it.key ? 'true' : 'false');
    c.classList.remove('card--invite');
    if (c.dataset.key === it.key && !c.querySelector('.card__d')) {
      c.appendChild(el('div', 'card__d'));
    }
  });

  // promote() does not repaint the rails, so the hint has to be retired here as
  // well as in paintRails.
  $('#rail-hint').hidden = true;

  const s = $('#stage');
  s.textContent = '';

  const hd = el('div', 'hd');
  const hg = glyph(it, 52);
  hg.classList.add('hd__g');
  hd.appendChild(hg);
  // The group sits BESIDE the name, not above it. A small label stacked over a
  // title is a habit rather than a decision, and the title carries its own weight.
  const row = el('div', 'hd__r');
  row.appendChild(el('h2', 'hd__n', it.name));
  row.appendChild(el('span', 'hd__c', it.group));
  // The next use case rides here, pushed to the far end of the title row by its
  // own margin-left:auto, so it is in the same glance as the title.
  const nx = nextChip(it);
  if (nx) row.appendChild(nx);
  hd.appendChild(row);
  if (it.headline) hd.appendChild(el('p', 'hd__p', it.headline));
  // THE ACTION, AT THE TOP, NOT BURIED. A reviewer's blocker was that nothing on
  // the stage was the obvious "take this file" control -- everything above the fold
  // was about looking. The file itself is the deliverable, so the link to it sits
  // with the title, and the paste-ready line sits next to it.

  const act = el('div', 'hd__a');
  const repo = (DATA.repo && DATA.repo.https) || '';
  if (repo) {
    const open = el('a', 'go go--link', 'Open the file');
    open.href = repo + '/blob/main/' + it.path;
    open.target = '_blank';
    open.rel = 'noopener';
    act.appendChild(open);
  }
  const paste = el('code', 'hd__c2', (it.configuration === 'json' || it.catalogueProfile === 'synthetic_workspace')
    ? 'Run the complete file in a SQL worksheet'
    : 'EXECUTE IMMEDIATE FROM \'' + it.dist + '\'');
  act.appendChild(paste);
  act.appendChild(el('span', 'views__n', kb(it.bytes) + ', one file'));
  hd.appendChild(act);
  s.appendChild(hd);

  // READING ORDER, and it is deliberate. The screens come first because they
  // are what a reader is here to see, and they used to sit below both the
  // build log and the copy control. Then how to take the file, then how it
  // builds, then what it costs to run, then what it cost to make, then how
  // to ship it. nextUp is no longer last -- it rides in the title row.
  s.appendChild(actPayoff(it));
  s.appendChild(scriptAct(it));
  s.appendChild(actEditing(it));
  s.appendChild(actBuild(it));
  s.appendChild(actRunRate(it));
  s.appendChild(actFacts(it));
  s.appendChild(actLadder(it));

  if (!o.quiet) s.scrollIntoView({ block: 'nearest', behavior: still() ? 'auto' : 'smooth' });
  // After the acts are in the document, because it fills a host by id.
  paintRunRate(it);
  runBuild(it);
  // The walkthrough starts itself. It has to happen HERE rather than inside
  // actPayoff, because the section it drives is not in the document until the
  // appends above have run, and paintFrame resolves #shot by id.
  startPlay();
}

/* ── the way out is into the next one ────────────────────────────────────────
   THE POINT OF THE WHOLE SURFACE IS THAT SOMEONE READS ALL TWENTY-SEVEN. Until this
   existed, every path off a use case led out of the page: you finished the ladder
   and the next move was the browser's back button. A reviewer put it exactly --
   "would not explore laterally", with no nudge at the bottom of the payoff.

   IT USED TO BE THE LAST THING ON THE STAGE, a full-width card under the ladder,
   on the reasoning that you offer the next one after the current one is finished.
   That reasoning assumed the reader reaches the bottom. Moved into the title row
   as a compact control: it is now visible in the same glance as the title, without
   costing a section of its own, and the reader does not have to finish to see that
   there is a next one. Selection is unchanged -- prefer something unseen.

   Split in two so the pick can be reused: pickNext() chooses, nextChip() renders. */
function pickNext(it) {
  const pool = shown();
  if (pool.length < 2) return null;
  const here = pool.findIndex(x => x.key === it.key);
  // Walk forward from where we are and take the first unseen one; fall back to the
  // literal next, so the control is never dead once everything has been seen.
  let pick = null;
  for (let i = 1; i <= pool.length && !pick; i++) {
    const c = pool[(here + i + pool.length) % pool.length];
    if (c.key !== it.key && !seen.has(c.key)) pick = c;
  }
  if (!pick) pick = pool[(here + 1) % pool.length];
  return (!pick || pick.key === it.key) ? null : pick;
}

function nextChip(it) {
  const pick = pickNext(it);
  if (!pick) return null;
  const b = el('button', 'nextc');
  b.type = 'button';
  b.title = 'Open ' + pick.name;
  const gl = glyph(pick, 22);
  gl.classList.add('nextc__g');
  b.appendChild(gl);
  const x = el('div', 'nextc__x');
  // The headline is dropped here on purpose. In the title row this control has to
  // stay one line tall, and the name plus "not seen" is the whole decision.
  x.appendChild(el('div', 'nextc__k',
    seen.has(pick.key) ? 'Next' : 'Next, not seen'));
  x.appendChild(el('div', 'nextc__n', pick.name));
  b.appendChild(x);
  b.appendChild(el('span', 'nextc__c', (seen.size) + '/' + items.length));
  b.addEventListener('click', () => promote(pick));
  return b;
}

function actHead(title, sub) {
  const h = el('div', 'act__h');
  h.appendChild(el('h3', 'act__t', title));
  if (sub) h.appendChild(el('p', 'act__s', sub));
  return h;
}

/* ── act one ───────────────────────────────────────────────────────────── */
function actBuild(it) {
  const a = el('section', 'act');
  a.appendChild(actHead(it.configuration === 'json' ? 'What was verified' : 'It builds itself',
    it.configuration === 'json' ? 'Summary of bounded synthetic checks, not a customer accuracy assessment.'
      : 'Every line below was recorded by this repository running this file.'));
  const log = el('div', 'log');
  log.id = 'log';
  log.setAttribute('role', 'log');
  a.appendChild(log);
  const row = el('div', 'views');
  const rp = el('button', 'btn', it.configuration === 'json' ? 'Replay the summary' : 'Replay the build');
  rp.type = 'button';
  rp.id = 'replay';
  // The label states the outcome. The previous version of this surface said
  // "Run", which readers took to mean it would execute something against their
  // account -- a generic verb on a control whose only effect is an animation is
  // a false promise in both directions.
  rp.addEventListener('click', () => runBuild(it));
  row.appendChild(rp);
  row.appendChild(el('span', 'views__n', it.dist + '  ·  ' + kb(it.bytes)));
  a.appendChild(row);
  return a;
}

function runBuild(it) {
  logTimers.forEach(clearTimeout); logTimers = [];
  const log = $('#log'), rp = $('#replay');
  if (!log) return;
  log.textContent = '';
  const lines = it.log || [];
  const flat = still();
  // Reserve the full height before the first line lands. Otherwise the panel
  // grows a row at a time and shoves the dashboard, the facts and the ladder down
  // the page seventeen times while the reader is trying to read them.
  const rowH = 22.1;
  log.style.minHeight = Math.round(lines.length * rowH + 22) + 'px';
  // ~120ms a line. Fast enough that twenty lines land in about two seconds, slow
  // enough that each one is legible as it arrives -- the apprehension principle
  // is the constraint here, not the clock.
  const step = flat ? 0 : 120;
  if (rp) rp.disabled = !flat;

  lines.forEach((ln, i) => {
    const emit = () => {
      const row = el('div', 'log__l log__l--' + ln.kind);
      row.appendChild(el('span', 'log__i',
        ln.kind === 'run' ? '>' : ln.kind === 'cost' ? '$' : ln.kind === 'done' ? '=' : '+'));
      row.appendChild(el('span', null, ln.text));
      log.appendChild(row);
    };
    flat ? emit() : logTimers.push(setTimeout(emit, i * step));
  });

  const done = () => { if (rp) rp.disabled = false; };
  flat ? done() : logTimers.push(setTimeout(done, lines.length * step + 120));
}

/* A prev/next plate that lives ON the capture. `dir` is -1 or 1.
   Clicking one moves a screen AND stops the walkthrough, which is the whole
   interaction contract: the reader took hold of the sequence, so it stops moving
   under them. A hand-drawn chevron rather than a unicode arrow glyph, because an
   arrow character renders at the mercy of whatever font the platform picks and
   these two have to be optically identical mirror images of each other. */
function navPlate(dir) {
  const b = el('button', 'mat__nav mat__nav--' + (dir < 0 ? 'p' : 'n'));
  b.type = 'button';
  b.setAttribute('aria-label', dir < 0 ? 'Previous screen' : 'Next screen');
  const s = document.createElementNS(SVGNS, 'svg');
  s.setAttribute('viewBox', '0 0 24 24');
  s.setAttribute('aria-hidden', 'true');
  const p = document.createElementNS(SVGNS, 'path');
  p.setAttribute('d', dir < 0 ? 'M15 5 L8 12 L15 19' : 'M9 5 L16 12 L9 19');
  s.appendChild(p);
  b.appendChild(s);
  b.addEventListener('click', () => { stopPlay(); paintFrame(at + dir); });
  return b;
}

/* ── the payoff: the dashboard, and the figures beside it ────────────────────
   These were two stacked sections. At full stage width a 1440x1100 capture renders
   about 900px tall, so the figures and the ship ladder sat a screen and a half
   under a single image and most readers never reached them. Capping the image
   bought reachability by shrinking the one thing a reader came for, which was the
   wrong trade -- so the compact column moved BESIDE the image instead. The
   dashboard is now larger than it was before the cap and the numbers are on
   screen with it. */
function actPayoff(it) {
  const a = el('section', 'act');
  frames = [it.full, ...(it.frames || [])].filter(Boolean);
  a.appendChild(actHead('What it puts in front of a customer',
    it.shotsNote ? it.shotsNote
                 : frames.length > 1 ? frames.length + ' screens, captured from a real build'
                                     : 'captured from a real build'));
  const pay = el('div', 'pay');

  const left = el('div');
  const mat = el('div', 'mat');
  if (frames.length) {
    const im = el('img');
    im.id = 'shot';
    im.src = frames[0];
    im.alt = 'The dashboard ' + it.name + ' deploys';
    mat.appendChild(im);
    if (frames.length > 1) mat.appendChild(navPlate(-1));
    if (frames.length > 1) mat.appendChild(navPlate(1));
  } else {
    mat.appendChild(el('div', 'mat__none',
      'No dashboard. This one reports into tables' + (it.agent ? ' and an agent' : '') + '.'));
  }
  left.appendChild(mat);

  const row = el('div', 'views');
  if (frames.length > 1) {
    const n = el('span', 'views__n');
    n.id = 'viewn';
    // Stated at render, not on first click. It used to be filled in by paintFrame,
    // so the reader was told "screen 1 of 6" only AFTER pressing Next -- which is
    // the moment they no longer need to be told there are six.
    n.textContent = 'screen 1 of ' + frames.length;
    row.appendChild(n);
    at = 0;
  }
  if (frames.length) {
    // The capture is 1440 wide and the stage is not. Anyone who wants to read an
    // axis label gets it at its actual size -- in an overlay ON THIS PAGE.
    //
    // EARNED THE HARD WAY. This was an <a href> pointing at the image, which works
    // hosted and is broken everywhere else, because offline the href is a
    // data:image/jpeg URI. Chrome has blocked top-level navigation to data: URIs
    // since 2017 and the Snowflake report sandbox strips data: hrefs outright, so
    // two of the three delivery channels this catalog is built for had a link that
    // silently did nothing. An overlay needs no navigation, no blob: URL and no new
    // tab, so it is the only version that works in all three.
    const full = el('button', 'views__f', 'Open this screen at full size');
    full.type = 'button';
    full.id = 'fullsize';
    full.addEventListener('click', () => { stopPlay(); openLightbox(it); });
    row.appendChild(full);
  }
  if (row.childNodes.length) left.appendChild(row);
  if (it.gif) {
    const recording = el('div', 'views');
    const play = el('button', 'views__f', 'Play recorded walkthrough');
    let recordingPlaying = false;
    play.type = 'button';
    play.addEventListener('click', () => {
      stopPlay();
      recordingPlaying = !recordingPlaying;
      const image = $('#shot');
      if (image) image.src = recordingPlaying ? it.gif : (frames[at] || it.full);
      play.textContent = recordingPlaying ? 'Stop recording' : 'Play recorded walkthrough';
      play.setAttribute('aria-pressed', String(recordingPlaying));
    });
    const save = el('button', 'views__f', 'Download GIF');
    save.type = 'button';
    save.addEventListener('click', () => {
      const anchor = el('a'); anchor.href = it.gif; anchor.download = it.key + '_walkthrough.gif';
      document.body.appendChild(anchor); anchor.click(); anchor.remove();
    });
    recording.appendChild(play); recording.appendChild(save); left.appendChild(recording);
  }
  // THE NOTE FIRES ON THE ACTUAL SHORTFALL, NOT ON `offline`. It used to key off
  // `DATA.offline && frames.length < 2`, which was correct only while the offline
  // build never carried frames. It does now, and that condition would have kept
  // telling a reader looking at a five-screen walkthrough that "this single-file
  // copy carries one screen per use case" -- a file describing itself wrongly, which
  // is worse than saying nothing. Compare what is on screen with what exists.
  const missing = (it.screensHosted || frames.length) - frames.length;
  if (missing > 0) {
    left.appendChild(el('p', 'step__note',
      'This single-file copy carries ' + frames.length
        + (frames.length === 1 ? ' screen' : ' screens') + ' for this use case so it '
        + 'survives a mail gateway. The hosted catalog carries ' + missing + ' more.'));
  }
  pay.appendChild(left);
  a.appendChild(pay);
  return a;
}

/* The facts column, now its own act.
   It used to be the right-hand column of the payoff section, which meant the
   screens could not move to the top of the stage without taking a table of
   figures with them. Reading order on the stage is now: what it looks like,
   how to take it, how it builds, what it costs to run, what it cost to make,
   how to ship it. */
function scriptAct(it) {
  const inner = scriptPreview(it);
  if (!inner) return el('span');
  const a = el('section', 'act');
  a.appendChild(actHead('Take the file',
    'The settings block, and the whole script on your clipboard.'));
  a.appendChild(inner);
  return a;
}

function actFacts(it) {
  const a = el('section', 'act');
  a.appendChild(factsCol(it));
  return a;
}

/* ── full size, in an overlay ────────────────────────────────────────────────
   Built once and reused, because building it per open leaks a node per click, and
   torn down to a hidden state rather than removed so the listeners survive. */
let lbOpen = false, lbReturn = null;

function lightbox() {
  let b = $('#lb');
  if (b) return b;
  b = el('div', 'lb');
  b.id = 'lb';
  b.setAttribute('role', 'dialog');
  b.setAttribute('aria-modal', 'true');
  b.setAttribute('aria-label', 'The dashboard at full size');
  b.hidden = true;
  const bar = el('div', 'lb__bar');
  const cap = el('span', 'lb__cap');
  cap.id = 'lbcap';
  const x = el('button', 'lb__x', 'Close');
  x.type = 'button';
  x.addEventListener('click', closeLightbox);
  bar.appendChild(cap);
  bar.appendChild(x);
  const scroll = el('div', 'lb__scroll');
  const im = el('img');
  im.id = 'lbimg';
  im.alt = '';
  scroll.appendChild(im);
  b.appendChild(bar);
  b.appendChild(scroll);
  // Clicking the backdrop closes; clicking the image does not, or studying a
  // dashboard becomes a game of not touching it.
  b.addEventListener('click', e => { if (e.target === b || e.target === scroll) closeLightbox(); });
  document.body.appendChild(b);
  return b;
}

function openLightbox(it) {
  const b = lightbox();
  const src = frames[at] || it.full || it.thumb;
  if (!src) return;
  $('#lbimg').src = src;
  $('#lbimg').alt = 'The dashboard ' + it.name + ' deploys, at full size';
  $('#lbcap').textContent = it.name
    + (frames.length > 1 ? '  \u00b7  screen ' + (at + 1) + ' of ' + frames.length : '');
  b.hidden = false;
  document.body.classList.add('lbon');
  lbOpen = true;
  lbReturn = $('#fullsize');
  $('.lb__x').focus();
}

function closeLightbox() {
  const b = $('#lb');
  if (!b) return;
  b.hidden = true;
  document.body.classList.remove('lbon');
  lbOpen = false;
  // Focus goes back where it came from. Dropping it on <body> would send a keyboard
  // reader to the top of the document to walk back down.
  if (lbReturn && document.contains(lbReturn)) lbReturn.focus();
  lbReturn = null;
}

/* ── playing the screens ─────────────────────────────────────────────────────
   AUTOPLAY, ON BY DEFAULT, ONE LAP. It used to wait behind a "Play all screens"
   button, and a button is the wrong instrument for this: six captures sitting
   still do not announce themselves as a walkthrough, so the reader has to already
   suspect there is a sequence before they will press the thing that reveals it.
   Starting on its own tells them. Stopping after ONE lap is what keeps that
   honest -- it is a demonstration that runs once, not a loop competing with the
   figures beside it for the rest of the visit.

   WCAG 2.2.2 (Pause, Stop, Hide, Level A) applies because this moves for longer
   than five seconds, and it is satisfied by mechanism rather than by a control
   labelled Stop: either arrow halts it, which is the gesture a reader reaches for
   anyway the moment they want to dwell on a screen. `still()` covers the rest --
   prefers-reduced-motion, or the motion toggle -- and in that state nothing
   starts at all and the arrows are the only way through, which is correct.
   2.6s a screen: fast enough to read as a sequence, slow enough to take a
   dashboard in. */
let playing = false, playTimer = null;

function startPlay() {
  if (frames.length < 2 || still()) return;
  playing = true;
  let left = frames.length - 1;
  playTimer = setInterval(() => {
    paintFrame(at + 1);
    if (--left <= 0) stopPlay();
  }, 2600);
}

function stopPlay() {
  playing = false;
  if (playTimer) { clearInterval(playTimer); playTimer = null; }
}

/* Called by the arrows, by the autoplay tick, and by nothing else. The comment
   that used to sit here said "nothing on this page begins moving on its own",
   which stopped being true the moment the walkthrough started itself -- see
   startPlay for what replaced the consent that sentence was describing. */
function paintFrame(i) {
  if (!frames.length) return;
  at = (i + frames.length) % frames.length;
  const im = $('#shot');
  if (im) im.src = frames[at];
  // The overlay tracks the stage while it is open, so Play advances both rather
  // than leaving the full-size view showing the screen before last.
  if (lbOpen) {
    const li = $('#lbimg');
    if (li) li.src = frames[at];
    const lc = $('#lbcap');
    if (lc && frames.length > 1) {
      lc.textContent = lc.textContent.replace(/screen \d+ of \d+/,
        'screen ' + (at + 1) + ' of ' + frames.length);
    }
  }
  const n = $('#viewn');
  if (n) n.textContent = 'screen ' + (at + 1) + ' of ' + frames.length;
}

/* What it cost and whether it holds up. A definition list reading DOWN a narrow
   column, which is what a column of figures wants -- and it is not a grid of
   same-size cards standing in for structure. */
function factsCol(it) {
  if (it.catalogueProfile === 'synthetic_workspace') {
    const section = el('div');
    section.appendChild(actHead('A working sample workspace', 'Real agent questions and durable charts over fictional retail data.'));
    section.appendChild(el('p', 'step__note', it.body));
    section.appendChild(el('p', 'step__note', 'One SQL file: ' + kb(it.bytes) + '. Release ' + it.release + '.'));
    section.appendChild(el('p', 'step__note', 'Creates a new database and two isolated roles. Uses your existing approved warehouse, compute pool and package integration.'));
    return section;
  }
  const box = el('div');
  box.appendChild(actHead('What it cost, and whether it holds up',
    'Measured, not estimated. A blank is a blank.'));
  const dl = el('dl', 'facts');
  const f = (k, val, sub, cls) => {
    const w = el('div', 'fact');
    w.appendChild(el('dt', null, k));
    const dd = el('dd');
    dd.appendChild(el('span', cls || null, val));
    if (sub) dd.appendChild(el('em', null, sub));
    w.appendChild(dd);
    dl.appendChild(w);
  };
  const st = it.steps || {};
  // NO COST NUMBER HERE ANY MORE, AND THAT IS THE POINT. This column used to open
  // with "Credits to build": the measured cost of standing the solution up over
  // sample data, in credits and in dollars at the rate the file declares. It was
  // the most defensible number on the page -- the only measured one -- and it was
  // still the wrong number to lead with, because nobody evaluating this is buying
  // our sample-data run. They are buying the thing that runs every day afterwards.
  // A reader who meets 0.6446 credits first anchors on it, and every ongoing figure
  // below then reads as a surprise rather than as the answer.
  //
  // So the only cost a reader meets is the projection, and it lives on the one panel
  // that carries the sliders that move it. Two cost numbers on one page, where only
  // the lower panel repaints when the warehouse dial changes, would also have gone
  // stale on the first drag -- the measured figure is fixed at X-Small and would sit
  // there contradicting a projection the reader had just moved to a Medium.
  //
  // The measured figure is not deleted from the page. It survives one tier down, on
  // the POC rung of the ladder, where it answers a question that is actually about
  // the reader: what their own verification run will cost them. That is evidence of
  // method, not a headline.
  // THE "AUDIT" / "TESTED" ROW USED TO OPEN THIS COLUMN AND IT NO LONGER EXISTS.
  // See the note where verdict() used to live: a test result is our progress report,
  // and leading the fact list with one framed the whole panel as a status update on
  // us rather than a description of the use case. The row below it -- what the file
  // does before it creates anything -- was always the better opener, because it
  // answers the first question every reviewer actually asked.
  if (!CLIENT) f('Furthest tier run', it.tier ? it.tier.toLowerCase() : 'not recorded');
  f('One file', kb(it.bytes), it.dist);
  // The two things every reviewer asked before they were willing to run one:
  // what privileges does it need, and what does it leave behind.
  if (st.preflight) {
    f('Before it creates anything', 'it checks your privileges',
      'and prints the exact GRANT statements if any are missing');
  }
  if (it.configuration === 'json') {
    f('Everything lands in', 'a new schema you choose', 'Remove it with action: TEARDOWN in the same file. Child installations have independent teardown.');
  } else {
    f('Everything lands in', it.schema,
      st.teardown ? 'one schema, removed by TEARDOWN()' : 'one schema');
  }
  box.appendChild(dl);
  if (it.body) box.appendChild(el('p', 'step__note', it.body));
  return box;
}

/* ── the ladder ────────────────────────────────────────────────────────── */
const CODE_KEY = /(SET|EXECUTE IMMEDIATE|FROM)/g;

function sqlBlock(lines) {
  const pre = el('pre', 'sql');
  lines.forEach((l, i) => {
    if (i) pre.appendChild(document.createTextNode('\n'));
    if (l.startsWith('--')) { pre.appendChild(el('i', null, l)); return; }
    // Keyword highlighting by split, never innerHTML.
    l.split(CODE_KEY).forEach(part => {
      if (!part) return;
      part.match(CODE_KEY) && part.match(CODE_KEY)[0] === part
        ? pre.appendChild(el('b', null, part))
        : pre.appendChild(document.createTextNode(part));
    });
  });
  return pre;
}

/* ── what it costs to KEEP running ───────────────────────────────────────────
   THE ONLY COST NUMBER THE READER MEETS, which is a change from how this page used
   to work. The facts column above carried `credits` -- measured_credits, what it
   cost to stand the solution up once over sample data -- and that figure got there
   first and set the reader's expectations. It was answering a question nobody
   evaluating this has: what our demo run burned. The question they do have is what
   the customer pays every month once it is live, and that is this panel. The measured
   figure now appears only on the POC rung of the ladder, where it is the cost of the
   reader's own verification run.

   WHAT IS READ AND WHAT IS ASSUMED, because the distinction is the whole value:

     READ    the cadence. harness/manifest.Standing makes every shipping solution
             declare what it leaves running and how often, and 19 of 21 declare a
             recurring unit. So "how many times a month" is a fact about the object.
     READ    the credit rate, from the solution's own SET <P>_COST_PER_CREDIT.
     READ    the workload SHAPE -- whether volume scales this object's runtime
             linearly, quadratically, or not at all -- from Standing.scaling, and what
             an interactive session touches from Standing.session_shape. Both are
             classified from the solution's own SQL, not inferred here.
     MEASURED  the durations, twice. A dynamic-table incremental aggregate at
             590,753 rows, and a blocked self-join across seven volumes to 8M rows.
             Solutions transfer whichever curve matches their declared shape.
     EXACT   the warehouse-size multiplier. Snowflake doubles credits-per-hour with
             each size step, so this is arithmetic rather than an estimate -- and it
             is the largest lever on the panel.
     ASSUMED the account's volume and head-count, which the reader sets, and the
             session profile: 3 sessions a person a day, and a 10-hour working day.

   WHAT WAS WRONG BEFORE, since the shape of the fix is only legible against it. One
   linear curve was transferred to every solution, including a self-join that is
   quadratic -- understating it 4x at the default volume and 40x at 250M rows, while a
   demo-scale anchor sat inside the region where a straight line fits. And query
   traffic was people x sessions x 90 seconds, billed per person without bound, which
   made an unmeasured slider worth 85-98% of the headline figure. Both are now
   mechanical: the curve matches the query shape, and traffic is warehouse UPTIME,
   which saturates because a warehouse cannot be up longer than the day.

   SO IT SHOWS A BAND, NOT A NUMBER. Two measured durations transferred across five
   object kinds cannot support two decimal places, and a range an SE can defend in
   the room beats a point estimate they cannot. The multipliers are stated. */
const CN = DATA.consumption || {};
let acctRows = CN.defaultRowsPerDay || 25000000;
let acctUsers = CN.defaultUsers != null ? CN.defaultUsers : 40;
// Index into CN.sizes. Starts at 0 = X-Small, which is the size BOTH anchors were
// measured on -- so the panel opens showing figures that rest on a measurement, and
// every step the reader takes away from it is an exact doubling they chose.
let whIdx = 0;

const SIZES = CN.sizes || [{ label: 'X-Small', cph: 1 }];
const cphNow = () => (SIZES[whIdx] || SIZES[0]).cph;

// A log slider, because the accounts this has to cover span four orders of magnitude
// and a linear track would spend nine tenths of its travel above anything real.
const ROW_STOPS = [100000, 250000, 500000, 1000000, 2500000, 5000000, 10000000,
                   25000000, 50000000, 100000000, 250000000, 500000000, 1000000000];
const USER_STOPS = [2, 5, 10, 20, 40, 75, 150, 300, 600, 1200];
const SIZE_STOPS = SIZES.map((_, i) => i);

const fmtRows = n => n >= 1e9 ? (n / 1e9).toFixed(n % 1e9 ? 1 : 0) + 'B'
  : n >= 1e6 ? (n / 1e6).toFixed(n % 1e6 ? 1 : 0) + 'M'
  : n >= 1e3 ? Math.round(n / 1e3) + 'K' : String(n);
const fmtCr = n => n >= 1000 ? Math.round(n).toLocaleString()
  : n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2);
// Durations an SE reads out loud. 604 seconds is a number you have to convert in
// your head before you know whether it fits in a two-hour window; 10.1 min is not.
const fmtDur = s => s < 90 ? s.toFixed(1) + 's'
  : s < 5400 ? (s / 60).toFixed(1) + ' min' : (s / 3600).toFixed(1) + ' h';

/* How long ONE run takes at the reader's volume, on the curve this solution's shape
   was measured on. Returns the seconds plus everything needed to show the working,
   because the shape is a judgement about the solution's SQL and a reader has to be
   able to see which curve was used and disagree with it. */
function secPerRun(st) {
  const exp = st.exponent != null ? st.exponent : 1;

  // FIXED work is over metadata -- a list of tables, a handful of rollup rows, query
  // history. Ten times the data does not make it run ten times longer, so the volume
  // slider must not touch it. Scaling it linearly was inflating twenty-odd of these
  // figures by whatever the slider happened to say.
  if (st.scaling === 'FIXED') {
    return { sec: CN.anchorSec, scale: 1, shape: 'FIXED', exp: 0 };
  }

  // QUADRATIC uses its OWN measurement rather than the linear anchor times an
  // exponent. Two different query shapes were measured separately and blending them
  // would throw away the only thing that makes either defensible.
  if (st.scaling === 'QUADRATIC') {
    const ratio = acctRows / (CN.qAnchorRows || 8000000);
    const raw = (CN.qAnchorSec || 63.24) * Math.pow(ratio, exp);
    const floor = CN.qFloorSec || 0.4;
    return {
      sec: Math.max(floor, raw), scale: ratio, shape: 'QUADRATIC', exp: exp,
      floored: raw < floor,
    };
  }

  // LINEAR, with a floor. A refresh has a fixed cost that does not shrink with the
  // delta, so below demo scale the anchor duration IS the duration -- a customer with
  // a tenth of the demo's rows does not get a tenth of a refresh.
  const scale = Math.max(1, acctRows / (CN.anchorRows || 590753));
  return { sec: (CN.anchorSec || 3.672) * scale, scale: scale, shape: 'LINEAR', exp: 1 };
}

/* What the people using it cost, as WAREHOUSE UPTIME rather than as a sum of session
   lengths. See the consumption block in the generator for why the previous term --
   people x sessions x 90s, billed per person and unbounded -- was wrong twice over.

   The curve here is linear while sessions are sparse enough to let the warehouse
   suspend between them, and FLAT once they are not: a warehouse cannot be up for
   more than the working day, so past a certain head-count more people cost nothing
   extra. That saturation is the part the old model had no way to express. */
function usageOf(st) {
  if (st.sessionShape !== 'MATERIALIZED' && st.sessionShape !== 'SCAN') return null;
  const sessions = acctUsers * (CN.sessionsPerUserPerDay || 3);

  // What the session's own queries execute for. A MATERIALIZED surface reads
  // pre-built summaries, so this stays small however big the account gets. A SCAN
  // surface goes at raw volume and grows with it.
  let q = CN.sessionQuerySec || 2;
  if (st.sessionShape === 'SCAN') q *= Math.max(1, acctRows / (CN.anchorRows || 590753));

  // Snowflake bills a minimum of 60 seconds per warehouse resume, so a two-second
  // dashboard read costs a minute. For a materialized surface that minimum IS the
  // cost, which is why this term stops being about query time at all.
  const perSession = Math.max(CN.autoSuspendSec || 60, q);
  const dayCap = CN.businessSecPerDay || 36000;
  const raw = sessions * perSession;
  const sec = Math.min(dayCap, raw);
  return {
    sec: sec, sessions: sessions, querySec: q, perSession: perSession,
    saturated: raw > dayCap, dayCap: dayCap,
    credits: sec * (CN.businessDaysPerMonth || 22) / 3600 * cphNow(),
  };
}

/* The model. Returns nulls rather than zeros where the repo cannot answer, so the
   panel can decline instead of printing a confident 0.00. */
function runRate(it) {
  const st = it.standing || {};
  const rate = (it.steps && it.steps.rate) || CN.defaultRate || 2.60;
  const cph = cphNow();
  const out = {
    rate: rate, cph: cph, size: (SIZES[whIdx] || SIZES[0]).label,
    standing: null, usage: null, dur: null,
  };

  if (!st.declared) return out;
  if (st.oneTime) { out.oneTime = true; out.reason = st.reason; return out; }

  const d = secPerRun(st);
  out.dur = d;

  if (st.runsPerMonth) {
    out.runs = st.runsPerMonth;
    // FEASIBILITY, checked before the arithmetic rather than after. A run that takes
    // longer than the gap between runs cannot keep up: Snowflake will skip the
    // overlapping firings, the object falls behind, and the honest answer is that
    // this cadence does not work at this volume. Multiplying the overrun into a tidy
    // monthly figure would print a number that quietly assumes a schedule the
    // warehouse is not meeting -- which at 250M rows was 155 credits/month for a
    // task needing 17 hours per two-hour window.
    if (st.intervalSec && d.sec > st.intervalSec) {
      // Priced as the warehouse never going idle, because that is what actually
      // happens: back-to-back runs. This is a CEILING and is labelled as one.
      out.standing = 720 * cph;
      out.infeasible = {
        sec: d.sec, interval: st.intervalSec, over: d.sec / st.intervalSec,
        // The smallest cadence that does fit, rounded up to a whole minute, so the
        // reader leaves with the dial setting rather than just the bad news.
        needMin: Math.ceil(d.sec / 60),
      };
    } else {
      out.standing = st.runsPerMonth * d.sec * cph / 3600;
    }
  } else {
    // A PIPE on file arrival and a storage POLICY evaluated by Snowflake recur with
    // no schedule to divide by, so there is no runs-per-month to multiply. Saying
    // that is correct; inventing a frequency would be the manufactured number
    // harness/manifest.Standing exists to forbid.
    out.noSchedule = st.runsHow;
  }

  out.usage = usageOf(st);
  // Which term the reader is actually looking at. Printed on the surface, because the
  // failure this whole model was rebuilt around was an invented term silently
  // deciding 98% of a headline figure while looking like arithmetic.
  const tot = (out.standing || 0) + (out.usage ? out.usage.credits : 0);
  out.usageShare = tot > 0 && out.usage ? out.usage.credits / tot : 0;
  return out;
}

function actRunRate(it) {
  if (it.catalogueProfile === 'synthetic_workspace') {
    const section = el('section', 'act'); section.id = 'act-rr';
    section.appendChild(actHead('Usage and cost', 'No fixed-price or zero-cost claim.'));
    section.appendChild(el('p', 'step__note', 'The app uses a container runtime, a query warehouse, hybrid-table storage and Cortex inference. Usage depends on session activity, selected compute and questions. No scheduled refresh is installed. Existing warehouse and pool settings are not changed. Review and stop unneeded demo compute using your account policies.'));
    return section;
  }
  const a = el('section', 'act');
  a.id = 'act-rr';
  a.appendChild(actHead('What it costs to keep running',
    'The number to take to a budget conversation: what this costs every month once it '
    + 'is live, at your volume and on your warehouse. Move the dials \u2014 the '
    + 'warehouse size is the biggest lever on the page.'));

  // The inputs. They live on the panel rather than in the filter bar because they are
  // read WITH the number they change: a slider in the masthead would be a control
  // whose effect is three screens away. And each is omitted where it moves nothing --
  // two solutions legitimately install nothing recurring, a FIXED-shape object does
  // not care about row volume, and a solution with no dashboard has no head-count. A
  // slider that changes nothing is worse than no slider, because it invites the reader
  // to believe a relationship that is not there. That belief is the whole defect this
  // model was rebuilt to remove.
  const st = it.standing || {};
  if (st.declared && !st.oneTime) {
    const ins = el('div', 'rr__ins');
    const volumeMatters = st.scaling !== 'FIXED' || st.sessionShape === 'SCAN';
    if (volumeMatters) {
      ins.appendChild(slider('rr-rows', 'Rows landing per day, across the account',
        ROW_STOPS, acctRows, fmtRows, v => { acctRows = v; paintRunRate(it); }));
    }
    if (st.sessionShape === 'MATERIALIZED' || st.sessionShape === 'SCAN') {
      ins.appendChild(slider('rr-users', 'People using it',
        USER_STOPS, acctUsers, String, v => { acctUsers = v; paintRunRate(it); }));
    }
    // The biggest lever, and the one that used to be invisible. Both anchors were
    // measured on an X-Small; a customer sizing this on a Medium pays four times
    // everything on this panel, which is more than either other slider can do.
    ins.appendChild(slider('rr-size', 'Warehouse it runs on',
      SIZE_STOPS, whIdx, i => SIZES[i].label,
      v => { whIdx = v; paintRunRate(it); }));
    a.appendChild(ins);
  }

  const out = el('div', 'rr__out');
  out.id = 'rr-out';
  a.appendChild(out);
  return a;
}

/* One slider. Indexes into a stop list rather than taking a raw number, so every
   position is a round figure an SE would actually say out loud. */
function slider(id, label, stops, value, fmt, onChange) {
  const w = el('div', 'rr__in');
  const lab = el('label', 'rr__lab', label);
  lab.setAttribute('for', id);
  const val = el('span', 'rr__val', fmt(value));
  const r = el('input', 'rr__r');
  r.type = 'range';
  r.id = id;
  r.min = '0';
  r.max = String(stops.length - 1);
  r.step = '1';
  let idx = stops.indexOf(value);
  r.value = String(idx < 0 ? Math.floor(stops.length / 2) : idx);
  // Screen readers get the figure, not the index. Announcing "7 of 12" would be
  // reading out the implementation.
  const say = v => {
    r.setAttribute('aria-valuetext', fmt(v) + ' ' + label.toLowerCase());
    val.textContent = fmt(v);
  };
  say(value);
  r.addEventListener('input', () => {
    const v = stops[Number(r.value)];
    say(v);
    onChange(v);
  });
  const head = el('div', 'rr__ih');
  head.appendChild(lab);
  head.appendChild(val);
  w.appendChild(head);
  w.appendChild(r);
  return w;
}

function paintRunRate(it) {
  const host = $('#rr-out');
  if (!host) return;
  host.textContent = '';
  const r = runRate(it);

  if (!(it.standing || {}).declared) {
    host.appendChild(el('p', 'rr__none',
      'This solution does not declare what it leaves running, so there is nothing '
      + 'here to project from.'));
    return;
  }
  if (r.oneTime) {
    host.appendChild(el('p', 'rr__none',
      'Nothing recurs. ' + (r.reason || '') + ' It costs storage, plus whatever '
      + 'compute the people querying it use.'));
    return;
  }
  const st = it.standing;

  // THE FEASIBILITY GATE, ahead of the headline rather than buried in the derivation.
  // A cadence the warehouse cannot meet is not a more expensive configuration, it is a
  // broken one, and a reader who takes a monthly figure away from this panel without
  // knowing that has been misled by arithmetic that was internally consistent.
  if (r.infeasible) {
    const w = el('div', 'rr__warn');
    w.appendChild(el('strong', null, 'This cadence cannot keep up at this volume.'));
    w.appendChild(el('span', null,
      ' One run needs about ' + fmtDur(r.infeasible.sec) + ' at '
      + fmtRows(acctRows) + ' rows/day, but ' + st.cadence + ' asks for one every '
      + fmtDur(r.infeasible.interval) + ' \u2014 ' + r.infeasible.over.toFixed(1)
      + '\u00d7 too long. Runs overlap, get skipped, and the object falls behind. '
      + 'The figure below is therefore a CEILING: the warehouse running continuously, '
      + 'which is what back-to-back runs amount to. To make the schedule real, set '
      + it.prefix + '_' + (st.dial || 'CADENCE') + ' to at least '
      + r.infeasible.needMin.toLocaleString() + ' minutes, or give it a bigger '
      + 'warehouse, or block the join harder.'));
    host.appendChild(w);
  }

  // The band. Halved and tripled around the projection, which is the honest width
  // for a transferred measurement -- not a confidence interval, and labelled as a
  // range rather than dressed up as one.
  const usageCr = r.usage ? r.usage.credits : 0;
  const yr = ((r.standing || 0) + usageCr) * 12;
  const lo = yr / 2, hi = yr * 3;
  const big = el('div', 'rr__big');
  big.appendChild(el('span', 'rr__n', fmtCr(lo) + '\u2013' + fmtCr(hi)));
  big.appendChild(el('span', 'rr__u', 'credits a year'));
  host.appendChild(big);
  // NO CURRENCY IN ANY BUILD, INTERNAL INCLUDED. A per-credit rate on a page that
  // gets forwarded is a pricing statement, and the real rate is contractual and
  // theirs, not ours to assert -- two of these files also declare their own rate, so
  // the figure was not even consistent across the set. The credit band stays, because
  // credits are the unit the customer can check against their own account. What
  // replaces the dollar line is the provenance the dollar line was crowding out:
  // which of these numbers was measured, and which was transferred from something
  // that was. This was gated on CLIENT and the internal build still printed dollars;
  // the currency variant is now deleted rather than branched around, so there is no
  // audience in which a dollar figure can reappear here.
  //
  // THE PROVENANCE SENTENCE IS BAKED FOR THE INTERNAL BUILD. FOOT is {} there by
  // design -- build_catalog only ships footnotes to the client payload -- so reading
  // FOOT.costBasis alone left this line as a bare "On X-Small at 1 credit/hour." and
  // dropped the one thing the dollar line was carrying: that the band is transferred,
  // not measured. An SE needs that more than a customer does, since they are the one
  // who has to defend it.
  host.appendChild(el('p', 'rr__usd',
    'On ' + r.size + ' at ' + r.cph + ' credit' + (r.cph === 1 ? '' : 's')
    + '/hour. ' + (FOOT.costBasis
      || 'A projection, not a quote: one solution in this set had its standing cost '
       + 'measured directly and the rest are derived from that measurement, scaled by '
       + 'each file\u2019s declared cadence and by how its work grows with volume. '
       + 'The band is the projection halved to tripled, because a transferred '
       + 'measurement does not support a precise-looking number.')));

  // The derivation, line by line, because a number an SE cannot take apart is a
  // number they cannot defend when the customer's architect pushes on it.
  const dl = el('dl', 'rr__d');
  const line = (k, v) => {
    dl.appendChild(el('dt', null, k));
    dl.appendChild(el('dd', null, v));
  };
  line('Leaves running', st.kind.replace(/_/g, ' ').toLowerCase()
    + (st.object ? ' \u00b7 ' + st.object : ''));
  line('Cadence it ships with', st.cadence + (st.dial ? '  \u00b7  dial it with '
    + it.prefix + '_' + st.dial : ''));

  if (r.noSchedule) {
    line('Scheduled work', r.noSchedule + ', so no per-month figure is projected '
      + 'for the refresh itself.');
  } else if (r.infeasible) {
    line('Scheduled work', fmtCr(r.standing * 12) + ' credits/yr \u00b7 a CEILING, '
      + 'not a schedule: 720 warehouse-hours a month at ' + r.cph + ' credit'
      + (r.cph === 1 ? '' : 's') + '/hour, because runs of ' + fmtDur(r.infeasible.sec)
      + ' every ' + fmtDur(r.infeasible.interval) + ' means it never idles.');
  } else {
    line('Scheduled work', fmtCr(r.standing * 12) + ' credits/yr \u00b7 '
      + st.runsPerMonth.toLocaleString() + ' runs/month (' + st.runsHow + '), at '
      + fmtDur(r.dur.sec) + ' a run on ' + r.size
      + (st.intervalSec ? ' \u2014 inside the ' + fmtDur(st.intervalSec)
          + ' between runs, so the schedule holds' : ''));
  }

  // HOW VOLUME SCALES IT, which is the line that used to be wrong. The shape is named
  // and so is the curve behind it, because this is a classification of the solution's
  // SQL and a reader who disagrees should be able to see exactly what they disagree
  // with rather than having to infer it from a multiplier.
  if (r.noSchedule) {
    line('Volume scaling', 'not applied \u2014 there is no scheduled run here to scale. '
      + fmtRows(acctRows) + ' rows/day drives this object directly, and what that '
      + 'costs depends on the file sizes it ingests, which this repo has not measured.');
  } else if (r.dur.shape === 'FIXED') {
    line('Volume scaling', 'none, and that is a finding rather than a floor. This '
      + 'object works over METADATA \u2014 a list of tables, query history, a bounded '
      + 'rollup \u2014 so ten times the data does not make it run ten times longer. '
      + 'The volume slider is withheld here because it would imply a relationship '
      + 'that does not exist.');
  } else if (r.dur.shape === 'QUADRATIC') {
    // Stated as rows-multiple THEN time-multiple, because the gap between those two
    // numbers IS the finding. Expressing it against the floor instead produced a
    // meaningless four-figure multiplier that told the reader nothing.
    const rx = r.dur.scale, tx = Math.pow(rx, r.dur.exp);
    line('Volume scaling', 'QUADRATIC, exponent ' + r.dur.exp + ' \u2014 '
      + (rx >= 1 ? rx.toFixed(1) + '\u00d7 the rows the curve was measured at, which '
          + 'is ' + (tx >= 10 ? tx.toFixed(0) : tx.toFixed(1)) + '\u00d7 the time'
        : 'below the volume the curve was measured at')
      + '. This resolves identities with a blocked self-join, so candidate pairs grow '
      + 'as the square of the rows in a block and the runtime follows. Measured '
      + 'directly at seven volumes up to ' + fmtRows(CN.qAnchorRows) + ', where one '
      + 'run took ' + CN.qAnchorSec + 's on an X-Small. A linear model fits the first '
      + 'four doublings and then understates this by 4\u00d7 at 25M rows and 40\u00d7 '
      + 'at 250M' + (r.dur.floored ? ', and below the smallest point measured the fit '
      + 'is floored at that measurement rather than extrapolated down' : '') + '.');
  } else {
    line('Volume scaling', r.dur.scale <= 1
      ? 'none \u2014 ' + fmtRows(acctRows) + ' rows/day is at or below the demo volume '
        + 'the duration was measured over, and a refresh has a floor'
      : '\u00d7' + r.dur.scale.toFixed(1) + ' \u2014 LINEAR, which is the right shape '
        + 'for a scan or an incremental aggregate: ' + fmtRows(acctRows) + ' rows/day '
        + 'against the ' + fmtRows(CN.anchorRows) + ' rows the duration was measured '
        + 'over.');
  }

  // THE PEOPLE TERM, rebuilt as warehouse uptime. The saturation is stated when it
  // bites, because "adding people stops costing more" is exactly the sort of thing an
  // SE gets asked and could not previously answer from this panel.
  if (!r.usage) {
    line('People querying it', 'none modelled \u2014 this solution ships no dashboard '
      + 'and no agent, so there is no interactive surface to put sessions against.');
  } else {
    const u = r.usage;
    line('People querying it', fmtCr(u.credits * 12) + ' credits/yr \u00b7 '
      + u.sessions.toLocaleString() + ' sessions a day ('
      + acctUsers + ' people \u00d7 ' + CN.sessionsPerUserPerDay + '), each holding '
      + 'the warehouse ' + fmtDur(u.perSession)
      + (u.perSession <= (CN.autoSuspendSec || 60)
          ? ' \u2014 which is Snowflake\u2019s 60-second minimum per resume, not query '
            + 'time. A ' + st.sessionShape.toLowerCase() + ' surface reads pre-built '
            + 'output in about ' + u.querySec.toFixed(0) + 's, so the resume minimum '
            + 'IS the cost.'
          : ' \u2014 a SCAN surface, so its queries go at raw volume and grow with it.')
      + ' Billed as warehouse UPTIME over a '
      + ((CN.businessSecPerDay || 36000) / 3600).toFixed(0) + '-hour day, '
      + CN.businessDaysPerMonth + ' days a month, because these people share one '
      + 'warehouse rather than each resuming their own.'
      + (u.saturated ? ' SATURATED: at this head-count the warehouse never suspends '
          + 'during the working day, so it is capped at that day and more people cost '
          + 'nothing further.' : ''));
    // The share, printed plainly. An unmeasured term deciding most of the answer is
    // the failure this model was rebuilt around, so where it still dominates the
    // reader is told rather than left to work it out from two numbers.
    if (r.usageShare >= 0.6) {
      line('Which term dominates', 'the people, at '
        + Math.round(r.usageShare * 100) + '% of the figure. That is real here \u2014 a '
        + st.scaling.toLowerCase() + ' ' + st.kind.replace(/_/g, ' ').toLowerCase()
        + ' is cheap to run and the dashboard is what costs \u2014 but it means the '
        + 'head-count slider, not the volume slider, is the one to argue about.');
    } else if (r.usageShare > 0) {
      line('Which term dominates', 'the scheduled work, at '
        + Math.round((1 - r.usageShare) * 100) + '% of the figure. The head-count '
        + 'slider moves the rest.');
    }
  }
  host.appendChild(dl);

  // The sizing-band paragraph that used to sit here is gone. It ran to eight
  // sentences of provenance -- which solution the curve was measured on, the
  // exponent its doubling ratios converged on -- in front of a reader who
  // wanted the number. PROJECTED is already on the figure itself, and the
  // method note under the head still says measured, not estimated.
}

function actEditing(it) {
  if (it.catalogueProfile === 'synthetic_workspace') {
    const section = el('section', 'act'); section.id = 'act-editing';
    section.appendChild(actHead('Keep the source in your account', 'Review changes before publishing them.'));
    section.appendChild(el('p', 'step__note', 'The installer stages readable Python, JavaScript, styles and configuration and attempts to create an editable source workspace. The app and files remain in your account. Use source-only updates for app edits; rerunning the installer preserves an existing app rather than upgrading it.'));
    section.appendChild(el('p', 'step__note', 'Source discovery supports reviewed single-source customer aggregates through restricted caller rights. Customer charts are session-local; persistent synthetic work is unchanged. Distinct-user production policy validation remains required. No external messaging is enabled.'));
    const upgrade = el('a', 'step__note', 'Download the source-only upgrade');
    upgrade.href = DATA.offline ? 'https://sfc-gh-mjacqmein.github.io/one-file-use-cases/' + it.upgradePath : it.upgradePath; upgrade.download = ''; section.appendChild(upgrade);
    return section;
  }
  const copy = DATA.editing || {};
  const state = it.editing || {};
  const profile = (copy.profiles || {})[state.profile];
  const section = el('section', 'act');
  section.id = 'act-editing';
  section.dataset.profile = state.profile || 'unknown';
  section.appendChild(actHead(copy.title || 'Edit with CoCo in Snowsight', copy.intro || ''));
  if (!profile) {
    section.appendChild(el('p', 'step__note', copy.unverified || 'Editing guidance is not available.'));
    return section;
  }
  const facts = el('dl', 'editing__facts');
  [['SQL changes', profile.quick], ['Code changes', profile.deeper]].forEach(([label, text]) => {
    const row = el('div');
    row.appendChild(el('dt', null, label));
    row.appendChild(el('dd', null, text));
    facts.appendChild(row);
  });
  section.appendChild(facts);
  const display = DATA.display || {};
  const displayKind = state.profile === 'sql_only' ? 'sql_only' : state.profile === 'container' ? 'container' : 'streamlit';
  if (display[displayKind] && it.configuration !== 'json') section.appendChild(el('p', 'step__note', display[displayKind]));
  section.appendChild(el('p', 'step__note', copy.preparation));
  const details = el('details', 'editing__details');
  details.appendChild(el('summary', null, 'Prompt and verification'));
  details.appendChild(el('blockquote', 'editing__prompt', profile.prompt));
  details.appendChild(el('p', null, copy.workflow));
  const evidence = [];
  if (state.ui_edit_rollback_verified) evidence.push(copy.uiVerified);
  if (state.snowsight_source_edit_verified) evidence.push(copy.sourceVerified);
  if (state.container_verified) evidence.push(copy.containerVerified);
  if (state.sql_edit_verified) evidence.push(copy.sqlVerified);
  details.appendChild(el('p', null, evidence.length ? evidence.join(' ') : copy.unverified));
  details.appendChild(el('p', null, copy.deployment));
  details.appendChild(el('p', null, copy.scope));
  section.appendChild(details);
  return section;
}

function actLadder(it) {
  if (it.catalogueProfile === 'synthetic_workspace') {
    const section = el('section', 'act'); section.id = 'act-ladder';
    section.appendChild(actHead('Install, then connect a source', 'Initial installation is enabled; customer access is reviewed separately.'));
    it.launchSteps.forEach((step, index) => {
      const details = el('details', 'editing__details');
      details.appendChild(el('summary', null, String(index + 1) + '. ' + step.title));
      details.appendChild(el('p', 'step__note', step.description));
      details.appendChild(sqlBlock(step.code));
      details.appendChild(el('p', 'step__note', step.note));
      section.appendChild(details);
    });
    return section;
  }
  if (it.steps?.oneClick) {
    const section = el('section', 'act'); section.id = 'act-ladder';
    section.appendChild(actHead('Run once, then open the app', 'Select an installation role, destination database and warehouse. Run the complete SQL file unchanged.'));
    section.appendChild(el('p', 'step__note', 'The initial run discovers supported sources and builds this use case\'s application. The final result places STATUS, OPEN_APP_URL and NEXT_ACTION first. Click OPEN_APP_URL.'));
    section.appendChild(el('p', 'step__note', it.key === '07_semantic_model_from_history'
      ? 'The semantic-view edition uses validated source metadata to create an initial semantic view alongside its existing query-history dashboard. Keys, relationships and business metric formulas are not guessed.'
      : 'Source choices are validated before use. Existing explicit choices are preserved. Missing access or incompatible sources are reported, not disguised as successful results.'));
    section.appendChild(el('p', 'step__note', 'AI inference and warehouse work incur usage charges. Production schedules, external grants and always-on warehouse warming remain disabled. Missing access is reported rather than disguised as sample data. Start with Small compute; Medium is optional for heavier work. Business-source discovery can search across visible databases independently of the installation destination, with skipped scopes and limits reported.'));
    return section;
  }
  if (it.launchSteps) {
    const section = el('section', 'act'); section.id = 'act-ladder';
    section.appendChild(actHead('From assessment to a bounded launch', 'Edit the JSON configuration at the top of the file. Each approval has a specific scope.'));
    const ladder = el('div', 'ladder');
    it.launchSteps.forEach((step, index) => {
      const wrapper = el('div', 'step'); wrapper.dataset.open = 'false';
      const button = el('button', 'step__b'); button.type = 'button'; button.setAttribute('aria-expanded', 'false');
      button.appendChild(el('span', 'step__n', String(index + 1)));
      const title = el('div', 'step__x'); title.appendChild(el('div', 'step__t', step.title)); title.appendChild(el('div', 'step__d', step.description)); button.appendChild(title);
      const body = el('div', 'step__body'); const code = el('pre', 'step__note'); code.textContent = step.code.join('\n'); body.appendChild(code); body.appendChild(el('p', 'step__note', step.note));
      button.addEventListener('click', () => { const open = wrapper.dataset.open !== 'true'; wrapper.dataset.open = String(open); button.setAttribute('aria-expanded', String(open)); });
      wrapper.appendChild(button); wrapper.appendChild(body); ladder.appendChild(wrapper);
    });
    section.appendChild(ladder); return section;
  }
  const p = it.prefix;
  const has = it.steps || {};
  const a = el('section', 'act');
  // Identified, so the screenshot harness can target it by name. Selecting acts by
  // POSITION is what made the two ladder shots photograph the run-rate panel instead
  // for as long as both existed -- they reported steps=0 the whole time and nobody
  // read the count, because the PNG underneath looked like a real panel.
  a.id = 'act-ladder';
  a.appendChild(actHead('Three steps to ship it',
    'Each step is one setting in the file. Nothing is created until the gate is open.'));
  const box = el('div', 'ladder');
  // When a solution declares neither setting, three greyed rows read as a broken
  // page rather than as an honest gap -- a reviewer called this state "reads
  // broken". One line says which it is, before the reader has to infer it.
  if (!has.mode && !has.tier) {
    a.appendChild(el('p', 'step__note',
      'This one was hand-assembled before the three-tier settings existed, so it '
      + 'has a single mode and no ladder. It still runs from one file, and it '
      + 'still creates nothing until its gate is opened.'));
  }

  const STEPS = [
    {
      on: has.mode,
      t: 'Test data',
      d: 'Seeds representative data instead of reading the account, so it demos '
       + 'anywhere. The dashboard says SAMPLE on every page.',
      c: 'no cost',
      sql: ["SET " + p + "_MODE = 'SAMPLE';",
            "SET " + p + "_APPROVE = TRUE;",
            "-- then EXECUTE IMMEDIATE the file."],
      note: 'Never present SAMPLE numbers as the customer\u2019s own.',
      off: 'This one predates the sample-data setting. It reads the account it runs in.',
    },
    {
      on: has.tier,
      t: 'POC',
      d: 'Builds on a warehouse this file creates, under a resource monitor, so the '
       + 'credits it burns are isolated and can be read back from metering afterwards.',
      // THE ONE PLACE THE MEASURED FIGURE SURVIVES, relabelled so it cannot be read
      // as what the solution costs. On this rung it answers the reader's own question
      // -- what does it cost me to prove this in my account -- rather than reporting
      // what our sample-data run happened to burn. Same number, different question,
      // and it is the question a POC rung exists to answer.
      c: it.credits != null ? it.credits.toFixed(4) + ' cr per POC run' : 'measurable',
      sql: ["SET " + p + "_DEPLOY_TIER = 'LIMITED';",
            "SET " + p + "_CREDIT_CAP  = 5;",
            "SET " + p + "_APPROVE     = TRUE;"],
      note: 'LIMITED is the measurement instrument. Warehouse metering has no '
          + 'query-tag column, so a dedicated warehouse is the only way to attribute '
          + 'credits to one run \u2014 which is why this is the tier that produces a real number.',
      off: 'This one predates the tier setting.',
    },
    {
      on: has.tier,
      t: 'Production',
      d: 'Full scope plus the operational furniture a platform team expects: resource '
       + 'monitor, budget, object tags, error notification, a refresh SLA and an operations view.',
      c: 'ongoing',
      sql: ["SET " + p + "_DEPLOY_TIER = 'PRODUCTION';",
            "SET " + p + "_APPROVE     = TRUE;"],
      note: 'A resource monitor caps warehouses only. It cannot cap serverless or '
          + 'AI-services tokens \u2014 use a BUDGET for those. Block 0 prints exactly which '
          + 'categories it does and does not cover.',
      off: 'This one predates the tier setting.',
    },
  ];

  STEPS.forEach((s, i) => {
    const w = el('div', 'step' + (s.on ? '' : ' step--off'));
    w.dataset.open = 'false';
    const b = el('button', 'step__b');
    b.type = 'button';
    b.setAttribute('aria-expanded', 'false');
    b.appendChild(el('span', 'step__n', String(i + 1)));
    const x = el('div', 'step__x');
    x.appendChild(el('div', 'step__t', s.t));
    x.appendChild(el('div', 'step__d', s.on ? s.d : s.off));
    b.appendChild(x);
    b.appendChild(el('span', 'step__c', s.on ? s.c : 'n/a'));
    w.appendChild(b);
    if (s.on) {
      const body = el('div', 'step__body');
      body.appendChild(sqlBlock(s.sql));
      body.appendChild(el('p', 'step__note', s.note));
      w.appendChild(body);
      b.addEventListener('click', () => {
        const open = w.dataset.open === 'true';
        w.dataset.open = open ? 'false' : 'true';
        b.setAttribute('aria-expanded', open ? 'false' : 'true');
      });
    } else {
      b.disabled = true;
    }
    box.appendChild(w);
  });
  a.appendChild(box);
  const repo = (DATA.repo && DATA.repo.https) || '';
  if (repo) {
    const note = el('p', 'step__note');
    note.appendChild(document.createTextNode('The file itself: '));
    const link = el('a', null, it.path);
    link.href = repo + '/blob/main/' + it.path;
    note.appendChild(link);
    a.appendChild(note);
  }
  return a;
}

function listCard(it) {
  const b = el('button', 'lcard');
  b.type = 'button';
  b.setAttribute('aria-label', it.name + '. ' + (it.headline || ''));
  const s = el('div', 'lcard__s');
  if (it.thumb) {
    const im = el('img');
    im.src = it.thumb;
    im.alt = '';
    im.loading = 'lazy';
    s.appendChild(im);
  }
  b.appendChild(s);
  const bd = el('div', 'lcard__b');
  const lg = glyph(it, 24);
  lg.classList.add('lcard__g');
  bd.appendChild(lg);
  bd.appendChild(el('div', 'lcard__n', it.name));
  bd.appendChild(el('div', 'lcard__p', it.play));
  const tg = el('div', 'tags');
  // NO TEST-RESULT TAG EITHER. The tag rail used to lead with a verdict badge, which
  // put our pass count in the reader's first glance at every tile in the grid -- and a
  // grid is exactly where that comparison is most misleading, because the step counts
  // differ per solution and "15 checks pass" beside "21 checks pass" reads as a ranking
  // of quality when it is a difference in how many rungs a solution declares. `seen` is
  // now the only tag, which is the one piece of state that is genuinely about the reader.
  //
  // NO CREDIT TAG. A tile is read at a glance, in a grid, next to twenty-one others,
  // and "0.645 cr" there was doing the one thing a glance-level number must never do:
  // inviting a comparison it does not support. It was the cost of OUR sample-data run
  // on an X-Small -- so the tiles sorted, to the eye, by how big a sample each solution
  // happens to ship with, and a reader could conclude that the cheap-looking one is the
  // cheap one to own. The ongoing figure cannot take its place here either: it is
  // modelled, it moves with three sliders, and the law for this grid is that every
  // number on a tile is measured. So no cost number on the tile, and the projection
  // one click in, on the panel that owns the dials.
  if (seen.has(it.key)) tg.appendChild(el('span', 'tag', 'seen'));
  bd.appendChild(tg);
  b.appendChild(bd);
  b.addEventListener('click', () => { show('stage'); promote(it); });
  return b;
}

function paintList() {
  const got = shown();
  const host = $('#cards');
  host.textContent = '';
  if (!got.length) {
    host.appendChild(el('p', 'empty2', 'Nothing matches. Clear the search or a filter.'));
    return;
  }
  DATA.groups.forEach(g => {
    const inG = got.filter(i => i.group === g);
    if (!inG.length) return;
    host.appendChild(el('div', 'gname', g));
    const grid = el('div', 'cards');
    inG.forEach(i => grid.appendChild(listCard(i)));
    host.appendChild(grid);
  });
}
